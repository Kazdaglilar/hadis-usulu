dis” terimidir.", "Bu, “Tedvin” terimidir.", "Bu, “Tasnif” terimidir.", "Doğru."], "p": "138"}]}, {"id": "v1", "scope": "final", "bolum": "Uygulama", "title": "Vaka Soruları: Bu Senet Ne Olur?", "pages": "tüm kitap", "qs": [{"q": "Bir tâbiî, senedde sahabeyi anmadan \"Rasûlullah şöyle buyurdu\" diyerek hadis rivayet ediyor. Bu hadis nedir?", "o": ["Mürsel", "Muallak", "Mevkuf", "Maktû'"], "a": 0, "n": ["Doğru. Cumhur muhaddislere göre merduddur; Hanefî, Mâlikî ve Hanbelîlere göre ilk üç asrın mürseli makbuldür.", "Muallak: İsnadın baş tarafından bir veya daha fazla ravinin peş peşe hazfedildiği hadis.", "Mevkuf: Söz, fiil veya takrir olarak sahabeye izafe edilen rivayet.", "Maktû': Tâbiîye ve sonrakilere izafe edilen söz ve fiil."], "p": "62–63"}, {"q": "Senedin ortasında iki ravi peş peşe düşmüştür. Hadisin adı nedir?", "o": ["Munkatı'", "Mu'dal", "Muallak", "Mürsel"], "a": 1, "n": ["Munkatı': Sahabeden önce bir yerde tek ravinin (ya da peş peşe olmaksızın birden fazla ravinin) düştüğü hadis.", "Doğru. Zayıflığı mürsel ve munkatıdan fazladır.", "Muallak: İsnadın baş tarafından bir veya daha fazla ravinin peş peşe hazfedildiği hadis.", "Mürsel: Senedi tâbiîye kadar muttasıl olup tâbiînin doğrudan almadan Hz. Peygamber'e izafe ettiği hadis."], "p": "64"}, {"q": "Senedin iki ayrı yerinden, peş peşe olmaksızın birer ravi düşmüştür. Hadis nedir?", "o": ["Mu'dal", "Munkatı'", "Muallak", "Müdelles"], "a": 1, "n": ["Mu'dal: Senetten iki veya daha fazla ravinin peş peşe düştüğü hadis.", "Doğru. Peş peşe olmayan çoklu düşme munkatı'dır; peş peşe olsaydı mu'dal olurdu.", "Muallak: İsnadın baş tarafından bir veya daha fazla ravinin peş peşe hazfedildiği hadis.", "Müdelles: İsnaddaki bir kusurun saklanıp senedin zahirinin güzelleştirildiği hadis."], "p": "65"}, {"q": "Musannif, hadisi kendi şeyhinden başlayan senedi atlayarak doğrudan \"Zührî dedi ki\" diye veriyor. Bu hadis nedir?", "o": ["Muallak", "Mürsel", "Mu'dal", "Mürsel-i hafî"], "a": 0, "n": ["Doğru. Düşme senedin başındadır; birden fazla ravi peş peşe düştüyse aynı zamanda mu'daldır.", "Mürsel: Senedi tâbiîye kadar muttasıl olup tâbiînin doğrudan almadan Hz. Peygamber'e izafe ettiği hadis.", "Mu'dal: Senetten iki veya daha fazla ravinin peş peşe düştüğü hadis.", "Mürsel-i hafî: Ravinin muasırı olup görüşmediği ya da görüşüp bu hadisi işitmediği birinden işitmiş gibi rivayet etmesi."], "p": "62, 65"}, {"q": "Bir ravi, şeyhinden başka hadisler işitmiştir ama bu hadisi ondan işitmemiştir. Yine de \"an fülân\" diyerek ondan rivayet ediyor. Bu nedir?", "o": ["Mürsel-i hafî", "Tedlîsü'l-isnâd", "Tedlîsü'ş-şuyûh", "Muanan"], "a": 1, "n": ["Mürsel-i hafî: Ravinin muasırı olup görüşmediği ya da görüşüp bu hadisi işitmediği birinden işitmiş gibi rivayet etmesi.", "Doğru. Mürsel-i hafîde ravi o şeyhten hiç hadis almamıştır; fark budur.", "Tedlîsü'ş-şuyûh: Müdellisin şeyhini bilinmesin diye tanınmayan ismi, künyesi veya nisbesiyle anması.", "Muanan: Ravinin hadisi \"fülân an fülân\" şeklinde rivayet etmesi."], "p": "66, 69"}, {"q": "Bir ravi muasırı olduğu ama hiç görüşmediği birinden işitmiş gibi rivayet ediyor. Bu nedir?", "o": ["Tedlîsü'l-isnâd", "Mürsel-i hafî", "Mu'dal", "Sahabe mürseli"], "a": 1, "n": ["Tedlîsü'l-isnâd: Ravinin, şeyhinden işitmediği bir hadisi \"an\", \"kâle\" gibi lafızlarla ondan işitmiş izlenimi vererek rivayet etmesi.", "Doğru. Hadis imamlarının beyanı, mürsilin kendi ifadesi veya başka bir rivayetle bilinir.", "Mu'dal: Senetten iki veya daha fazla ravinin peş peşe düştüğü hadis.", "Sahabe mürseli: Sahabinin, hadisi işittiği başka bir sahabiyi düşürerek Hz. Peygamber'e isnad ettiği hadis."], "p": "68"}, {"q": "Bir ravi, çok hadis aldığı şeyhinin adının sürekli geçmesini istemediği için onu tanınmayan künyesiyle anıyor. Bu nedir?", "o": ["Tedlîsü't-tesviye", "Tedlîsü'ş-şuyûh", "Mübhem", "Mühmel"], "a": 1, "n": ["Tedlîsü't-tesviye: Müdellisin \"sika–zayıf–sika\" senedindeki zayıf şeyhi düşürüp senedi sikalardan ibaret göstermesi.", "Doğru. Tedlîs türleri içinde en az mekruh olanıdır.", "Mübhem: Metinde veya senedde ismi yerine kim olduğunun tespitini zorlaştıran ifade (racül, imraet gibi) kullanılan şahıs.", "Mühmel: Aynı isimli iki kişiden hangisinden rivayet edildiğinin ayırt edilemediği durum."], "p": "66–67"}, {"q": "Müdellis bir ravi \"sika – zayıf – sika\" senedindeki zayıf şeyhi düşürüp senedi tamamen sikalardan oluşuyor gibi gösteriyor. Bu nedir?", "o": ["Tedlîsü'l-isnâd", "Tedlîsü't-tesviye", "Tedlîsü'ş-şuyûh", "Muallak"], "a": 1, "n": ["Tedlîsü'l-isnâd: Ravinin, şeyhinden işitmediği bir hadisi \"an\", \"kâle\" gibi lafızlarla ondan işitmiş izlenimi vererek rivayet etmesi.", "Doğru. Tedlîsin en çirkinidir; Bakıyye b. Velîd ve Velîd b. Müslim bununla meşhurdur.", "Tedlîsü'ş-şuyûh: Müdellisin şeyhini bilinmesin diye tanınmayan ismi, künyesi veya nisbesiyle anması.", "Muallak: İsnadın baş tarafından bir veya daha fazla ravinin peş peşe hazfedildiği hadis."], "p": "66"}, {"q": "Günlük hayatında yalan söylediği bilinen ama hadiste yalanı tespit edilmemiş bir ravinin tek başına rivayet ettiği hadis nedir?", "o": ["Mevzû", "Metrûk", "Münker", "Muallel"], "a": 1, "n": ["Mevzû: Ravinin Hz. Peygamber'e yalan söz isnad ettiği rivayet.", "Doğru. Yalancılıkla itham edilen ravinin rivayetidir; matrûh veya vâh da denir.", "Münker: İbn Hacer'e göre zayıf ravinin sika raviye muhalefet ederek rivayet ettiği hadis.", "Muallel: Zahiren sağlam görünüp sika ravinin vehminden doğan gizli, sıhhati zedeleyici bir illetin tespit edildiği hadis."], "p": "72"}, {"q": "Bir ravi, hadis aldığını iddia ettiği şeyhin vefatından sonra doğduğu anlaşılınca rivayeti nasıl değerlendirilir?", "o": ["Mürsel", "Mevzû", "Şaz", "Muzdarib"], "a": 1, "n": ["Mürsel: Senedi tâbiîye kadar muttasıl olup tâbiînin doğrudan almadan Hz. Peygamber'e izafe ettiği hadis.", "Doğru. İkrar hükmünde bir karinedir; şartı, o hadisi sadece o şeyhin rivayet etmiş olmasıdır.", "Şaz: İbn Hacer'e göre sika ravinin kendinden daha sika raviye muhalefet ederek rivayet ettiği hadis.", "Muzdarib: Kuvvet dereceleri eşit, cem ve tercih yapılamayacak şekilde birbirinden farklı rivayet edilen hadis."], "p": "71"}, {"q": "Hammâd b. Zeyd sika bir ravidir; ama birçok sika ravinin İbn Abbas'tan merfû rivayet ettiği hadisi mürsel rivayet etmiştir. Hammâd'ın rivayeti nedir?", "o": ["Münker", "Şaz", "Mâruf", "Muzdarib"], "a": 1, "n": ["Münker: İbn Hacer'e göre zayıf ravinin sika raviye muhalefet ederek rivayet ettiği hadis.", "Doğru. Diğerlerinin rivayeti mahfuzdur.", "Mâruf: Zayıf ravinin muhalefet ettiği, sika ravinin rivayet ettiği makbul hadis (münkerin mukabili).", "Muzdarib: Kuvvet dereceleri eşit, cem ve tercih yapılamayacak şekilde birbirinden farklı rivayet edilen hadis."], "p": "80"}, {"q": "Zayıf bir ravi, sika ravilerin rivayetine muhalefet ederek rivayette bulunuyor. İbn Hacer'e göre bu rivayet nedir; sikaların rivayeti nedir?", "o": ["Şaz – Mahfuz", "Münker – Mâruf", "Metrûk – Sahih", "Muallel – Muhkem"], "a": 1, "n": ["Bu durum için geçerli değildir.", "Doğru. Münker zayıf cidden hadislerdendir; zayıflıkta metruktan sonra gelir.", "Bu durum için geçerli değildir.", "Bu durum için geçerli değildir."], "p": "74–75"}, {"q": "Sika bir ravinin hadisi zahiren sağlam görünüyor; bütün tarikler toplanınca ravinin vehmine dayalı gizli bir kusur bulunuyor. Bu hadis nedir?", "o": ["Muallel", "Şaz", "Munkatı'", "Maklûb"], "a": 0, "n": ["Doğru. İllet; teferrüd, muhalefet ve başka karinelerle tespit edilir.", "Şaz: İbn Hacer'e göre sika ravinin kendinden daha sika raviye muhalefet ederek rivayet ettiği hadis.", "Munkatı': Sahabeden önce bir yerde tek ravinin (ya da peş peşe olmaksızın birden fazla ravinin) düştüğü hadis.", "Maklûb: Senedinde veya metninde takdim-tehir yoluyla bir lafzın başkasıyla yer değiştirdiği hadis."], "p": "75"}, {"q": "Ravi, hadisteki garîb bir kelimeyi açıklamak için metne kendi sözünü ayırıcı işaret koymadan ekliyor. Bu nedir?", "o": ["Müdrec", "Musahhaf", "Maklûb", "Ziyâdetü's-sika"], "a": 0, "n": ["Doğru. İdrac ittifakla haramdır; ama Zührî'nin idracları gibi sahih niyetle yapılanlara bazı âlimler cevaz vermiştir; beyan edilmesi evladır.", "Musahhaf: Hadisteki bir kelimenin sika ravilerin rivayetinden farklı bir lafza veya manaya çevrilerek rivayet edilmesi.", "Maklûb: Senedinde veya metninde takdim-tehir yoluyla bir lafzın başkasıyla yer değiştirdiği hadis.", "Ziyâdetü's-sika: Âdil ve zâbıt bir ravinin rivayetinde diğer sikaların rivayetinde olmayan fazlalık."], "p": "76–77"}, {"q": "Bir ravi \"Sağ elinin vereceğini sol eli bilmesin\" ifadesini \"sol elinin vereceğini sağ eli bilmesin\" diye rivayet ediyor. Bu nedir?", "o": ["Musahhaf", "Maklûb", "Müdrec", "Muzdarib"], "a": 1, "n": ["Musahhaf: Hadisteki bir kelimenin sika ravilerin rivayetinden farklı bir lafza veya manaya çevrilerek rivayet edilmesi.", "Doğru. Maklûbü'l-metindir; Müslim'deki bir rivayette geçer.", "Müdrec: İsnadın siyakının değiştirildiği veya metnine ondan olmayan bir şeyin ayırıcı işaret konmadan eklendiği hadis.", "Muzdarib: Kuvvet dereceleri eşit, cem ve tercih yapılamayacak şekilde birbirinden farklı rivayet edilen hadis."], "p": "77"}, {"q": "Bir hadisin eşit kuvvette, birbirine aykırı rivayetleri var; cem de tercih de mümkün değil. Bu hadis nedir?", "o": ["Muhtelifü'l-hadîs", "Muzdarib", "Şaz", "Muhkem"], "a": 1, "n": ["Muhtelifü'l-hadîs: Kuvvetçe denk makbul bir hadisle teâruz hâlinde olup aralarının cem edilmesi mümkün olan hadis.", "Doğru. Izdırap çoğunlukla senette olur; ızdırap sika ravinin adında olursa zayıf denemez.", "Şaz: İbn Hacer'e göre sika ravinin kendinden daha sika raviye muhalefet ederek rivayet ettiği hadis.", "Muhkem: Kendi kuvvetinde başka bir hadisle teâruz hâlinde olmayan makbul hadis."], "p": "78–79"}, {"q": "Yazıdaki noktasızlık yüzünden bir ravi \"sitten\" kelimesini \"şey'en\" okumuştur. Bu nedir?", "o": ["Musahhaf", "Maklûb", "Müdrec", "Mezîd"], "a": 0, "n": ["Doğru. Tashîf-i basardır; tashîfin en yaygın sebebidir.", "Maklûb: Senedinde veya metninde takdim-tehir yoluyla bir lafzın başkasıyla yer değiştirdiği hadis.", "Müdrec: İsnadın siyakının değiştirildiği veya metnine ondan olmayan bir şeyin ayırıcı işaret konmadan eklendiği hadis.", "Bu durum için geçerli değildir."], "p": "79"}, {"q": "Yaşlanınca hafızası bozulan bir ravinin bu durumdan SONRA yaptığı rivayetler nasıl değerlendirilir?", "o": ["Makbuldür", "Merduddur", "Mevzûdur", "Hasendir"], "a": 1, "n": ["Bu durum için geçerli değildir.", "Doğru. Ravi muhtelittir. İhtilattan önceki rivayetleri makbul, zamanı bilinmeyenlerde tevakkuf edilir.", "Bu durum için geçerli değildir.", "Bu durum için geçerli değildir."], "p": "81"}, {"q": "Bir sahabi \"Hz. Peygamber döneminde şöyle yapardık\" diyor. Bu rivayet nedir?", "o": ["Mevkuf", "Hükmen merfû", "Maktû'", "Mürsel"], "a": 1, "n": ["Mevkuf: Söz, fiil veya takrir olarak sahabeye izafe edilen rivayet.", "Doğru. Sadece \"biz böyle yapardık\" deseydi cumhura göre mevkuf olurdu.", "Maktû': Tâbiîye ve sonrakilere izafe edilen söz ve fiil.", "Mürsel: Senedi tâbiîye kadar muttasıl olup tâbiînin doğrudan almadan Hz. Peygamber'e izafe ettiği hadis."], "p": "82"}, {"q": "Bir tâbiînin kendi fetvası nedir?", "o": ["Mevkuf", "Maktû'", "Mürsel", "Munkatı'"], "a": 1, "n": ["Mevkuf: Söz, fiil veya takrir olarak sahabeye izafe edilen rivayet.", "Doğru. İmam Şâfiî maktû'yu munkatı' ile bir tutmuştur; sonra ayrı ıstılahlar olmuştur.", "Mürsel: Senedi tâbiîye kadar muttasıl olup tâbiînin doğrudan almadan Hz. Peygamber'e izafe ettiği hadis.", "Munkatı': Sahabeden önce bir yerde tek ravinin (ya da peş peşe olmaksızın birden fazla ravinin) düştüğü hadis."], "p": "83"}, {"q": "Bir hadisin her tabakasında iki ravi, bir tabakasında ise beş ravi var. Bu hadis nedir?", "o": ["Meşhur", "Azîz", "Garîb", "Mütevâtir"], "a": 1, "n": ["Meşhur: Tevatür şartlarını taşımayan, her tabakada en az üç ravisi bulunan rivayet.", "Doğru. Bazı tabakalarda ikiden fazla ravi olması azîzliğe zarar vermez.", "Garîb: Bir veya daha fazla tabakasında tek bir ravinin bulunduğu hadis.", "Mütevâtir: Aklın yalan üzerinde birleşmelerini mümkün görmediği bir topluluğun her nesilde kendileri gibi bir topluluktan alıp naklettiği, hisse dayanan rivayet."], "p": "51"}, {"q": "Sahabe tabakasında üç ravi var, tebe-i tâbiîn tabakasında ise hadisi tek bir ravi rivayet etmiş. Bu hadis nedir?", "o": ["Garîb-i mutlak", "Ferd-i nisbî", "Azîz", "Meşhur"], "a": 1, "n": ["Bu durum için geçerli değildir.", "Doğru. Teferrüd eden raviye kadar hadis meşhurdur; teferrüd bunu iptal ettiği için nisbî denir.", "Azîz: Her tabakada en az iki ravisi bulunan hadis.", "Meşhur: Tevatür şartlarını taşımayan, her tabakada en az üç ravisi bulunan rivayet."], "p": "52–53"}, {"q": "Şeyh talebesine \"Bu kitap benim semâımdır\" diyor ama rivayet izni vermiyor. Bu tahammül yolu nedir?", "o": ["İcazet", "İ'lâm", "Münâvele", "Vasiyet"], "a": 1, "n": ["İcazet: Sözlü veya yazılı olarak hadis rivayetine izin vermek.", "Doğru. Sahih olana göre bununla rivayet caiz değildir.", "Münâvele: Şeyhin rivayetlerini içeren kitabını talebesine vermesi; icazetli olursa caizdir.", "Vasiyet: Şeyhin ölümünden veya yolculuktan önce rivayet ettiği bir kitabını birine vasiyet etmesi."], "p": "46"}, {"q": "Talebe hadisleri şeyhe okuyor, şeyh kitabından takip ediyor. Bu tahammül yolu nedir?", "o": ["Semâ", "Kıraat (arz)", "İcazet", "Mükâtebe"], "a": 1, "n": ["Semâ: Şeyhin ezberinden veya kitaptan okuması, talebenin dinlemesi; cumhura göre en üstün tahammül yolu.", "Doğru. Edâ lafzı \"أخبرنا\" ya da en ihtiyatlısı \"قرأت على فلان\"dır.", "İcazet: Sözlü veya yazılı olarak hadis rivayetine izin vermek.", "Mükâtebe: Şeyhin \"Bu yazım sana ulaşınca bu isnadla benden rivayet et\" diye yazıp bir aracıyla göndermesi."], "p": "45"}, {"q": "Şeyh, sesini duyuramadığı uzak bir talebeye \"Bu yazım sana ulaşınca bu isnadla benden rivayet et\" diye yazıp bir aracıyla gönderiyor. Bu nedir?", "o": ["Mürâsele", "Mükâtebe", "Vicâde", "İ'lâm"], "a": 1, "n": ["Mürâsele: Şeyhin talebesine yazılı metin vermeden elçi göndermesi; elçinin rivayeti ezberinde götürmesi.", "Doğru. Taşıyan güvenilir değilse mektubun mühürlenmesi gerekir.", "Vicâde: Talebenin, hiç hadis almadığı bir şeyhin kendi el yazısıyla yazdığı hadisleri bulması; bu hadisler munkatı sayılır.", "İ'lâm: Şeyhin talebesine bir hadisin veya kitabın kendi semâı olduğunu haber vermesi; sahih olana göre bununla rivayet caiz değildir."], "p": "47"}, {"q": "Bir talebe, hiç ders almadığı bir şeyhin el yazısıyla yazılmış hadisleri buluyor. Bu nedir?", "o": ["Kitabet", "Vicâde", "Vasiyet", "Münâvele"], "a": 1, "n": ["Kitabet: Şeyhin hadislerini yanındaki veya uzaktaki birine kendisinin yazması ya da yazdırması.", "Doğru. Bulunan hadisler munkatı sayılır; tashîfe yol açtığı için âlimler bununla rivayete izin vermemiştir.", "Vasiyet: Şeyhin ölümünden veya yolculuktan önce rivayet ettiği bir kitabını birine vasiyet etmesi.", "Münâvele: Şeyhin rivayetlerini içeren kitabını talebesine vermesi; icazetli olursa caizdir."], "p": "47"}, {"q": "Bir hasen li-zâtihî hadis, başka bir tarikten gelen hasen li-zâtihî bir hadisle destekleniyor. Hadis ne olur?", "o": ["Hasen li-gayrihî", "Sahih li-gayrihî", "Sahih li-zâtihî", "Muhkem"], "a": 1, "n": ["Hasen li-gayrihî: Zayıflığı fısk veya kizb sebebiyle olmayan, başka tariklerle desteklenen zayıf hadis.", "Doğru. Zayıf hadis desteklenirse hasen li-gayrihî olur.", "Bu durum için geçerli değildir.", "Muhkem: Kendi kuvvetinde başka bir hadisle teâruz hâlinde olmayan makbul hadis."], "p": "58"}, {"q": "Bir ravi kendinden yaşça ve ilimce küçük birinden hadis alıyor. Bu durumun adı nedir?", "o": ["Rivâyetü'l-akrân", "Rivâyetü'l-ekâbir ani'l-esâğir", "Müdebbec", "Sâbık ve lâhık"], "a": 1, "n": ["Rivâyetü'l-akrân: Yaşları yakın ve aynı şeyhten hadis alan iki raviden birinin diğerinden rivayeti.", "Doğru. Bilinmesi senette kalb olmadığını anlamaya yarar.", "Müdebbec: Birbirlerinden karşılıklı hadis rivayet etmiş iki akran ravinin senedi.", "Sâbık ve lâhık: Vefatları arasında uzun süre bulunan iki ravinin aynı şeyhten rivayette ortak olması."], "p": "98–99"}, {"q": "Senette \"Ahmed\" diye geçen ravi Ahmed b. Sâlih de olabilir, Ahmed b. Îsâ da. Bu durumun adı nedir ve ikisi de sika ise sorun var mıdır?", "o": ["Mühmel – sorun yoktur", "Mübhem – sorun vardır", "Müttefik-müfterik – hadis reddedilir", "Mühmel – hadis reddedilir"], "a": 0, "n": ["Doğru. Sorun sadece biri sika, diğeri zayıf olduğunda çıkar.", "Bu durum için geçerli değildir.", "Bu durum için geçerli değildir.", "Bu durum için geçerli değildir."], "p": "101"}, {"q": "Bir hadisin senedinde \"bir adam\" (رجل) diye adı verilmeyen biri geçiyor. Bu kişiye ne denir?", "o": ["Mühmel", "Mübhem", "Meçhulü'l-ayn", "Muhadram"], "a": 1, "n": ["Mühmel: Aynı isimli iki kişiden hangisinden rivayet edildiğinin ayırt edilemediği durum.", "Doğru. Kimliği başka rivayetlerden veya siyercilerden tespit edilir.", "Meçhulü'l-ayn: Senedde adı geçen ama kendisinden sadece tek ravinin rivayet ettiği kimse.", "Muhadram: Câhiliyeyi yaşayıp Hz. Peygamber zamanında Müslüman olduğu hâlde onunla karşılaşamayan kimse."], "p": "101"}, {"q": "Bir müellif, Müslim'in hadislerini kendi senedleriyle, Müslim'in şeyhinde veya daha üstte buluşarak rivayet ediyor. Ortaya çıkan eser nedir?", "o": ["Müstedrek", "Müstahrec", "Zevâid", "Cem' çalışması"], "a": 1, "n": ["Müstedrek: Bir muhaddisin şartlarına uyduğu hâlde eserine almadığı hadislerin toplandığı kitap.", "Doğru. Örnek: Ebû Avâne el-İsferâyînî'nin Müslim üzerine müstahreci.", "Zevâid: Bir hadis kitabının başka eserlerde olmayan, fazla hadislerini bir araya getiren çalışma.", "Cem' çalışması: Birden fazla hadis kitabındaki hadisleri bir eserde toplayan çalışma (Câmiu'l-usûl)."], "p": "38, 57"}, {"q": "Bir eserde Hz. Ebû Bekir'in, Hz. Ömer'in rivayetleri ayrı ayrı bölümler hâlinde toplanmış. Bu eser hangi türdendir?", "o": ["Müsned (eser)", "Sünen", "Musannef", "Mu'cem"], "a": 0, "n": ["Doğru. Bazen tek bir sahabinin rivayetlerinden oluşan müsned de olur.", "Sünen: Fıkıh bablarına göre düzenlenmiş, çoğunlukla sadece merfû rivayet içeren eser.", "Musannef: Fıkıh konularına göre düzenlenmiş; merfû, mevkuf, maktû ve az da olsa tebe-i tâbiîn fetvalarını içeren eser.", "Mu'cem: Müellifin şeyhlerinin isimlerine, beldelere veya sahabe isimlerine göre tertip edilmiş hadis kitabı."], "p": "38"}, {"q": "Bir âlim, İbn Ömer'den gelen bir ferd hadisi destekleyen, yine İbn Ömer'den ve lafızca ortak başka bir rivayet buluyor. İbnu's-Salâh'a göre bu bulunan rivayet nedir?", "o": ["Şâhid", "Mütâbi'", "Ferd-i nisbî", "Muhkem"], "a": 1, "n": ["Şâhid: İbnu's-Salâh'a göre ferd hadise ortak olan ama farklı bir sahabiden gelen hadis.", "Doğru. Farklı sahabiden gelseydi şâhid olurdu.", "Ferd-i nisbî: Sahabe veya tâbiîn tarafında birden çok ravi varken sonraki bir tabakada tek ravinin rivayet ettiği hadis.", "Muhkem: Kendi kuvvetinde başka bir hadisle teâruz hâlinde olmayan makbul hadis."], "p": "35"}, {"q": "\"Sadûk\" lafzıyla nitelenmiş bir ravinin hadisi hakkında hüküm nedir?", "o": ["İhticac edilir", "İhticac edilmez; yazılır ve sikaların rivayetiyle karşılaştırılır", "Yazılmaz", "Mevzûdur"], "a": 1, "n": ["Bu durum için geçerli değildir.", "Doğru. Bu 4. ta'dil mertebesidir.", "Bu durum için geçerli değildir.", "Bu durum için geçerli değildir."], "p": "86–87"}, {"q": "Bir ravi hakkında hem müfesser bir cerh hem de bir ta'dil var. Hangisi esas alınır?", "o": ["Ta'dil", "Cerh", "Çoğunluk hangisiyse o", "Tevakkuf edilir"], "a": 1, "n": ["Bu durum için geçerli değildir.", "Doğru. Ta'dil edenler daha çok diye ta'dili tercih etmek zayıf bir görüştür.", "Bu durum için geçerli değildir.", "Bu durum için geçerli değildir."], "p": "85"}, {"q": "Bir fakih, bir hadise dayanarak fetva vermiştir. Bu, hadisin sahih olduğunu gösterir mi?", "o": ["Evet, kesinlikle", "Hayır; âlimin bir hadisle amel etmesi onun sahih olduğunu göstermez", "Sadece Hanefîlere göre gösterir", "Hadisi mütevâtir yapar"], "a": 1, "n": ["Bu durum için geçerli değildir.", "Doğru. Âmidî ve bazı usulcüler bunun tersini söylemiştir.", "Bu durum için geçerli değildir.", "Bu durum için geçerli değildir."], "p": "85"}]}];

window.UNITS.forEach(u=>{(window.EXTRA[u.id]||[]).forEach(q=>u.qs.push(q))});
window.TERM_UNITS.forEach(u=>window.UNITS.push(u));
window.ATLAS_UNITS.forEach(u=>window.UNITS.push(u));
</script>
<script>
if(!window.UNITS){document.getElementById("app").innerHTML="<p class=\"empty\">Sorular yüklenemedi. Sayfayı yenile.</p>";throw new Error("no data")}
const L=["a","b","c","d"];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* soru dizini */
const ALL=[]; UNITS.forEach(u=>u.qs.forEach((q,i)=>{q.id=u.id+"-"+i;q.unit=u;ALL.push(q)}));
const BYID=Object.fromEntries(ALL.map(q=>[q.id,q]));

/* durum: bu tarayıcıda saklanır */
const KEY="hadis-atolye-v1";
let S={xp:0,best:0,combo:0,mastered:{},wrong:{},scope:"vize"};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

const level=()=>Math.floor(S.xp/150)+1;
const lvlPct=()=>Math.round((S.xp%150)/150*100);
const TITLES=["Tâlib","Müstemli","Râvi","Müsnid","Muhaddis","Müfîd","Hâfız","Hüccet","Emîrü'l-mü'minîn fi'l-hadîs"];
const title=()=>TITLES[Math.min(level()-1,TITLES.length-1)];
const unitStats=u=>{const m=u.qs.filter(q=>S.mastered[q.id]).length;return{m,t:u.qs.length,pct:m/u.qs.length}};
const starsOf=p=>p>=1?3:p>=.7?2:p>=.4?1:0;
const starHTML=n=>`<span class="stars" aria-label="${n} yıldız">${[0,1,2].map(i=>i<n?"<b>★</b>":"★").join("")}</span>`;
const inScope=u=>S.scope==="eser"?u.scope==="eser":(u.scope==="vize"||(S.scope==="final"&&u.scope==="final"));

/* ---------- ana ekran ---------- */
function home(){
  const units=UNITS.filter(inScope);
  const pool=units.flatMap(u=>u.qs);
  const mastered=pool.filter(q=>S.mastered[q.id]).length;
  const wrongN=Object.keys(S.wrong).filter(id=>BYID[id]&&inScope(BYID[id].unit)).length;
  $("#app").innerHTML=`<div class="wrap" style="gap:16px">
    <section class="stats">
      <div class="stat"><span class="k">Seviye ${level()} · ${title()}</span><span class="v">${S.xp} puan</span><div class="lvlbar"><i style="width:${lvlPct()}%"></i></div></div>
      <div class="stat"><span class="k">Öğrenilen</span><span class="v">${mastered}/${pool.length}</span></div>
      <div class="stat"><span class="k">En iyi seri</span><span class="v">${S.best}</span></div>
    </section>
    <div class="row">
      <div class="seg" role="group" aria-label="Kapsam">
        <button id="sc-vize" aria-pressed="${S.scope==='vize'}">Vize · I–II</button>
        <button id="sc-final" aria-pressed="${S.scope==='final'}">Final · Tüm kitap</button>
        <button id="sc-eser" aria-pressed="${S.scope==='eser'}">Eserler</button>
      </div>
      <div class="actions">
        <button class="btn" id="mix">Karışık 10 soru</button>
        <button class="btn ghost" id="rev" ${wrongN?"":"disabled"}>Yanlışlarım (${wrongN})</button>
      </div>
    </div>
    <section class="units">
      ${units.map(u=>{const s=unitStats(u);return `<button class="unit" data-u="${u.id}">
        <span class="b"><span>${u.bolum} · s. ${u.pages}</span>${u.scope==="vize"?'<span class="tag">VİZE</span>':''}</span>
        <span class="t">${esc(u.title)}</span>
        <div class="pbar"><i style="width:${Math.round(s.pct*100)}%"></i></div>
        <span class="meta"><span>${s.m}/${s.t} soru</span>${starHTML(starsOf(s.pct))}</span>
      </button>`}).join("")}
      ${S.scope==="eser"?`<button class="unit" id="cat">
        <span class="b"><span>Literatür Atlası · 32 eser</span><span class="tag">KATALOG</span></span>
        <span class="t">Eser kartları ve zaman çizelgesi</span>
        <span class="muted">Asırlara göre eserler, müellifler, vefat yılları ve hangi metne dayandıkları.</span>
      </button>`:`<button class="unit" id="toeser" style="border-style:dashed">
        <span class="b"><span>Ek modül</span><span class="tag">ESERLER</span></span>
        <span class="t">Eserler ve Müellifler</span>
        <span class="muted">Hadis usulü literatür atlası: 32 eser, 28 müellif, 144 soru.</span>
      </button>`}
    </section>
    <button class="btn ghost" id="reset" style="align-self:flex-start;font-size:13px;padding:6px 12px">İlerlemeyi sıfırla</button>
  </div>`;
  $("#sc-vize").onclick=()=>{S.scope="vize";save();home()};
  $("#sc-final").onclick=()=>{S.scope="final";save();home()};
  $("#sc-eser").onclick=()=>{S.scope="eser";save();home()};
  const ce=$("#cat"); if(ce) ce.onclick=catalog;
  const te=$("#toeser"); if(te) te.onclick=()=>{S.scope="eser";save();home()};
  $("#mix").onclick=()=>start("Karışık tekrar",pickMix(pool,10));
  $("#rev").onclick=()=>start("Yanlışlarım",shuffle(Object.keys(S.wrong).filter(id=>BYID[id]&&inScope(BYID[id].unit)).map(id=>BYID[id])).slice(0,15),true);
  document.querySelectorAll(".unit[data-u]").forEach(b=>b.onclick=()=>{const u=UNITS.find(x=>x.id===b.dataset.u);
    const fresh=u.qs.filter(q=>!S.mastered[q.id]), done=u.qs.filter(q=>S.mastered[q.id]);
    start(u.title,[...shuffle(fresh),...shuffle(done)]);});
  const rs=$("#reset"); let armed=false;
  rs.onclick=()=>{if(!armed){armed=true;rs.textContent="Emin misin? Tekrar bas";setTimeout(()=>{armed=false;rs.textContent="İlerlemeyi sıfırla"},3000);return}
    S={xp:0,best:0,combo:0,mastered:{},wrong:{},scope:S.scope};save();home();};
}
function pickMix(pool,n){const w=pool.filter(q=>S.wrong[q.id]),f=pool.filter(q=>!S.mastered[q.id]&&!S.wrong[q.id]),r=pool.filter(q=>S.mastered[q.id]);
  return [...shuffle(w),...shuffle(f),...shuffle(r)].slice(0,n).sort(()=>Math.random()-.5)}

/* ---------- çalışma turu ---------- */
let R=null;
function start(name,list,review=false){
  if(!list.length){home();return}
  R={name,queue:list.map(q=>({q,again:false})),i:0,res:[],xp:0,review,requeued:new Set()};
  S.combo=0; show(); window.scrollTo({top:0});
}
function show(){
  const item=R.queue[R.i], q=item.q;
  const order=shuffle([0,1,2,3]);
  $("#app").innerHTML=`<div class="wrap" style="gap:14px">
    <div class="playhead">
      <button class="btn ghost" id="back" style="padding:6px 12px;font-size:13px">← Üniteler</button>
      <span class="combo" id="combo">${S.combo>1?"Seri ×"+S.combo:""}</span>
    </div>
    <div class="playhead"><span class="ut">${esc(R.name)} · ${q.unit.bolum}</span><span class="ref">${R.i+1}/${R.queue.length}</span></div>
    <div class="dots">${R.queue.map((x,k)=>`<i class="${k<R.i?(R.res[k]?'ok':'bad'):k===R.i?'cur':''}"></i>`).join("")}</div>
    <article class="card">
      ${item.again?'<span class="again">Tekrar: bunu az önce kaçırmıştın</span>':''}
      <p class="q">${esc(q.q)}</p>
      <ul class="opts">${order.map((oi,k)=>`<li><button class="opt" data-oi="${oi}"><span class="l">${L[k]}</span><span class="body"><span class="txt">${esc(q.o[oi])}</span><span class="note" hidden>${esc(q.n[oi])}</span></span></button></li>`).join("")}</ul>
      <div class="verdict" id="verdict" hidden></div>
    </article>
  </div>`;
  $("#back").onclick=home;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.oi));
}
function answer(oi){
  const item=R.queue[R.i], q=item.q, ok=oi===q.a;
  document.querySelectorAll(".opt").forEach(b=>{const x=+b.dataset.oi;b.disabled=true;b.querySelector(".note").hidden=false;
    if(x===q.a)b.classList.add("right");else if(x===oi)b.classList.add("wrong");});
  let gain=0;
  if(ok){S.combo++;S.best=Math.max(S.best,S.combo);gain=10+Math.min(S.combo-1,5)*2;if(item.again)gain=5;
    S.mastered[q.id]=true; if(S.wrong[q.id]){S.wrong[q.id]--; if(S.wrong[q.id]<=0)delete S.wrong[q.id];}}
  else{S.combo=0;delete S.mastered[q.id];S.wrong[q.id]=2;
    if(!R.requeued.has(q.id)){R.requeued.add(q.id);R.queue.push({q,again:true});}}
  S.xp+=gain;R.xp+=gain;R.res[R.i]=ok;save();
  const v=$("#verdict"); v.hidden=false;
  const last=R.i===R.queue.length-1;
  v.innerHTML=`<span class="v ${ok?'ok':'bad'}">${ok?'Doğru':'Yanlış'}${ok?` <span class="xp-pop">+${gain}</span>`:' · turun sonunda tekrar gelecek'}</span>
    <span class="ref">Kitap s. ${esc(q.p)}</span>
    <button class="btn" id="next">${last?'Sonucu gör':'Sonraki →'}</button>`;
  $("#combo").textContent=S.combo>1?"Seri ×"+S.combo:"";
  $("#next").onclick=()=>{R.i++; R.i<R.queue.length?show():end()}; $("#next").focus({preventScroll:true});
}
function end(){
  const first=R.queue.map((x,k)=>({x,k})).filter(o=>!o.x.again);
  const right=first.filter(o=>R.res[o.k]).length, tot=first.length;
  const pct=tot?right/tot:0;
  $("#app").innerHTML=`<div class="wrap"><article class="card end">
    <span class="muted">${esc(R.name)}</span>
    <span class="big">${right}/${tot}</span>
    ${starHTML(starsOf(pct))}
    <span class="xp-pop">+${R.xp} puan · Seviye ${level()} (${title()})</span>
    <p class="muted" style="margin:0">${pct===1?'Hepsi ilk seferde doğru.':pct>=.7?'Güzel. Kaçırdıkların “Yanlışlarım” destesinde, iki kez doğru bilince oradan çıkar.':'Kaçırdıkların “Yanlışlarım” destesine eklendi; şık notlarını okuyarak bir tur daha dene.'}</p>
    <div class="actions"><button class="btn" id="h">Ünitelere dön</button>${Object.keys(S.wrong).length?'<button class="btn ghost" id="w">Yanlışlarımı çalış</button>':''}</div>
  </article></div>`;
  $("#h").onclick=home;
  const w=$("#w"); if(w) w.onclick=()=>start("Yanlışlarım",shuffle(Object.keys(S.wrong).filter(id=>BYID[id]&&inScope(BYID[id].unit)).map(id=>BYID[id])).slice(0,15),true);
  window.scrollTo({top:0});
}

/* ---------- katalog ---------- */
const HAT={salah:["İbnü's-Salâh hattı","var(--accent)"],elfiyye:["Irâkî Elfiyye hattı","var(--gold)"],diger:["Diğer doğrudan ilişki","var(--ok)"],bag:["Bağımsız eser","var(--muted)"]};
const ROM=["","I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII","XIII","XIV","XV"];
function catalog(){
  let f="";
  const draw=()=>{
    const nz=s=>s.toLocaleLowerCase("tr").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/ı/g,"i").replace(/[ʿ‘'’]/g,"");const list=ATLAS.filter(c=>!f||nz(c.t+" "+c.m+" "+(c.b||"")).includes(nz(f)));
    const groups={}; list.forEach(c=>{const a=c.v?Math.floor((c.v-1)/100)+1:15;(groups[a]=groups[a]||[]).push(c)});
    $("#catlist").innerHTML=Object.keys(groups).sort((a,b)=>a-b).map(a=>`<section class="asr">
      <h3>${ROM[a]}. asır <span class="muted">(${(a-1)*100+1}–${a*100}) · ${groups[a].length} eser</span></h3>
      ${groups[a].map(c=>`<article class="ecard" style="--hat:${HAT[c.h][1]}">
        <div class="eno">${String(c.no).padStart(2,"0")}</div>
        <div class="ebody"><div class="et">${esc(c.t)}</div>
        <div class="em">${esc(c.m)} · ${c.v?"ö. "+c.v:"çağdaş"}</div>
        ${c.b?`<div class="er"><b>${esc(c.r)}</b> → ${esc(c.b)}</div>`:(c.r?`<div class="er"><b>${esc(c.r)}</b></div>`:"")}
        <div class="eh">${HAT[c.h][0]}</div></div></article>`).join("")}
    </section>`).join("")||'<p class="empty">Eşleşen eser yok.</p>';
  };
  $("#app").innerHTML=`<div class="wrap" style="gap:14px">
    <div class="playhead"><button class="btn ghost" id="back" style="padding:6px 12px;font-size:13px">← Üniteler</button>
    <span class="ref">Hadis Usûlü Literatür Atlası</span></div>
    <input id="q" class="search" type="search" placeholder="Eser veya müellif ara (örn. Irâkî, Nüket)" autocomplete="off">
    <div class="legend">${Object.values(HAT).map(([t,c])=>`<span><i style="background:${c}"></i>${t}</span>`).join("")}</div>
    <div id="catlist"></div></div>`;
  $("#back").onclick=home; $("#q").oninput=e=>{f=e.target.value.trim();draw()};
  draw(); window.scrollTo({top:0});
}
home();
</script>

</body>
</html>
