{q:"Hangisi \"haber\" kavramının üç ıstılahî tarifinden biri değildir?",o:["Hadisle aynı anlamdadır","Hz. Peygamber dışındakilere nispet edilen rivayetlerdir","Hz. Peygamber'e ve başkalarına nispet edilen rivayetlerdir","Sadece mütevâtir rivayetlerdir"],a:3,n:["Tariflerden biridir.","Tariflerden biridir.","Tariflerden biridir.","Böyle bir tarif yoktur."],p:"32"},
{q:"Musa kıssasındaki \"فارتدا على آثارهما قصصا\" ifadesi hangi kelimenin sözlük anlamına örnek verilir?",o:["Haber","Eser","Sened","Metin"],a:1,n:["Yanlış.","Doğru. \"Ayak izi\", geride kalan şey.","Yanlış.","Yanlış."],p:"32"},
{q:"\"Senedin ulaştığı söz\" neyin tarifidir?",o:["Metin","İsnad","Müsned","Eser"],a:0,n:["Doğru.","Seneddeki ravileri hadisi söyleyenine dayandırma işi; ya da senedle müradif.","Birden çok anlamı vardır.","Yanlış."],p:"33"},
{q:"\"İsnad\" kelimesinin iki anlamı hangi seçenekte doğru verilmiştir?",o:["Sahabe kitabı – merfû hadis","Ravileri birbirine ekleyerek hadisi söyleyenine dayandırma işi – metne kadar uzanan raviler zinciri","Hadisin baş kısmı – ravinin künyesi","Hadisi ezberleme – yazma"],a:1,n:["Bunlar müsned'in anlamlarıdır.","Doğru. İkinci anlamıyla senedle müradiftir.","Yanlış.","Yanlış."],p:"33"},
{q:"Rivayetle ilgili meseleleri ve sened-metnin makbul veya merdud olduğunu bilmeye yarayan kanunları bilen, hadislerin çoğunu ezberlemiş kimseye ne denir?",o:["Müsnid","Muhaddis","Hâkim","Müfîd"],a:1,n:["Bilgisi olsun olmasın senediyle rivayet eden kimse.","Doğru.","Kitaba göre hadis için uygun olmayan bir terimdir.","Hafızın asistanıdır."],p:"34"},
{q:"Kitaptaki hâfız tarifinde hangisi yer almaz?",o:["Hadisleri ravilerden şifahî olarak almak","Ravilerin tabaka ve mertebelerini bilmek","Zayıfı sahihten ayırabilmek","Fıkıh mezhebinde müctehid olmak"],a:3,n:["Yer alır.","Yer alır.","Yer alır.","Yer almaz. Bazılarına göre hâfız muhaddisten daha fazla hadis ilmine vakıftır."],p:"34"},
{q:"İbnu's-Salâh'a göre mütâbi' nedir?",o:["Aynı sahabeye dayanan, ferd hadise lafız ve mana ya da sadece mana ile ortak olan ikinci hadis","Farklı sahabiden gelen hadis","Sadece mana ile ortak olan hadis","Ravinin tek kaldığı hadis"],a:0,n:["Doğru.","Bu şâhiddir.","Bu İbn Hacer'e göre şâhiddir.","Bu ferd/garîbdir."],p:"35"},
{q:"\"İki ravinin bir hadiste aynı şeyhte buluşmasına\" ne denir?",o:["Eksik mütâbeat","Tam mütâbeat","Şâhid","İ'tibâr"],a:1,n:["Eksikte buluşma şeyhin şeyhinde veya üstündedir.","Doğru.","Yanlış.","Yanlış."],p:"35"},
{q:"\"İbn Huzeyme – Âsım b. Muhammed – Muhammed b. Zeyd – İbn Ömer\" rivayeti, Şâfiî'nin \"Mâlik – Abdullah b. Dînâr – İbn Ömer\" rivayeti için nedir?",o:["Tam mütâbeat","Eksik (kâsıra) mütâbeat","Şâhid","Ferd-i mutlak"],a:1,n:["Aynı şeyhte buluşmuyor.","Doğru. Buluşma İbn Ömer'de, yani Mâlik'in şeyhinin şeyhindedir.","Sahabi aynı (İbn Ömer).","Yanlış."],p:"35"},
{q:"Kitap, İbn Hacer'in şâhid ve mütâbi'yi ferd-i nisbîye hasretmesi hakkında ne der?",o:["Doğru bulur","Ferd-i mutlakta da bu ikisinin geçerli olduğunu söyler","Hiç geçerli olmadığını söyler","Sadece mütevâtirde geçerli olduğunu söyler"],a:1,n:["Yanlış.","Doğru.","Yanlış.","Yanlış."],p:"36"},
{q:"İmam Şâfiî'nin rivayet ettiği \"…otuza tamamlayın\" hadisinin Buhârî'deki şâhidi hangi sahabiden gelir?",o:["İbn Ömer","Ebû Hüreyre","Hz. Âişe","Enes b. Mâlik"],a:1,n:["Asıl rivayetin sahabisidir; şâhid farklı sahabiden gelir.","Doğru. Nesâî'deki ikinci şâhid İbn Abbas'tandır.","Yanlış.","Yanlış."],p:"36–37"},
{q:"Nesâî'ye göre senedi en uzun sahih hadiste kaç tâbiî bulunur?",o:["Üç","Dört","Altı","On"],a:2,n:["Yanlış.","Yanlış.","Doğru. Sayının 6 veya 7 diye tereddütlü olması bir ravinin tâbiî mi sahabe mi olduğu ihtilafındandır.","Uşârî (on ravili) hadis farklı bir konudur."],p:"37"},
{q:"Sehâvî'nin \"ilk asırda zayıf ravi çok azdı, ikinci asırda çoğaldı\" sözü kime yönelik bir itirazdır?",o:["Şâfiîlerin mürseli reddetmesine","Hanefîlerin ilk üç asır ravilerinin inkıtaını makbul saymasına","Zâhirîlere","Mu'tezile'ye"],a:1,n:["Yanlış.","Doğru.","Yanlış.","Yanlış."],p:"37"},
{q:"Akaid, ibadât, muamelât, siyer, menâkıb, rikâk, fiten ve kıyamet ahvâli konularının hepsini içeren esere ne denir?",o:["Sünen","Câmi'","Musannef","Mu'cem"],a:1,n:["Fıkıh bablarına göredir.","Doğru. Sekiz ana konuyu içerir.","Fıkıh konularına göredir.","Şeyh, belde veya sahabe isimlerine göredir."],p:"38"},
{q:"Müellifin şeyhlerinin isimlerine, beldelere veya sahabe isimlerine göre tertip edilmiş hadis kitabına ne denir?",o:["Mu'cem","Müsned","Cüz","Etrâf"],a:0,n:["Doğru.","Sadece sahabe isimlerine göredir.","Bir ravinin hadisleri veya tek konu.","Hadisin baş kısmı."],p:"38"},
{q:"İbn Ebî Hâtim ve Dârekutnî'nin eserleri hangi türe örnektir?",o:["Müstedrek","İlel kitapları","Cüz","Etrâf"],a:1,n:["Örneği Hâkim'in Müstedrek'idir.","Doğru. İlletli hadisler ve illetleri beyan edilir.","Yanlış.","Yanlış."],p:"38"},
{q:"Müsnedlerle ilgili hangisi yanlıştır?",o:["Bazen tek bir sahabinin hadislerinden oluşur","Bazıları ale'l-ebvâb sisteme göre yeniden düzenlenmiştir","Müsned adı az da olsa sahabe esaslı olmayan kitaplar için de kullanılmıştır","Müsnedler daima fıkıh bablarına göre düzenlenir"],a:3,n:["Doğru bilgi (Hz. Ebû Bekir'in müsnedi gibi).","Doğru bilgi.","Doğru bilgi (Buhârî'nin \"el-Câmiu'l-müsned…\" adı).","Yanlış bilgi. Asıl düzeni sahabe isimlerine göredir."],p:"38"},
{q:"Musanneflerin içeriği için hangisi doğrudur?",o:["Sadece merfû rivayet içerir","Merfû, mevkuf, maktû ve az da olsa tebe-i tâbiînin fetvalarını içerir","Sadece sahabe görüşlerini içerir","Hadislerin sadece baş kısmını içerir"],a:1,n:["Bu çoğunlukla sünenlerin özelliğidir.","Doğru.","Yanlış.","Bu etrâftır."],p:"38"},
{q:"Hadis ezberleyenlerin mertebeleri aşağıdan yukarıya doğru hangisidir?",o:["Muhaddis – müsnid – hâfız – müfîd – emîr","Müsnid – muhaddis – müfîd – hâfız – emîrü'l-mü'minîn fi'l-hadîs","Müfîd – müsnid – muhaddis – hâfız – emîr","Hâfız – muhaddis – müsnid – müfîd – emîr"],a:1,n:["Yanlış.","Doğru.","Yanlış.","Yanlış."],p:"39"},
{q:"\"Emîrü'l-mü'minîn fi'l-hadîs\" ve \"müfîd\" kavramları sırasıyla hangi asırlarda ortaya çıkmıştır?",o:["2. asır – 3. asır","3. asır – 2. asır","4. asır – 5. asır","1. asır – 3. asır"],a:0,n:["Doğru.","Ters.","Yanlış.","Yanlış."],p:"39"}
],
u3:[
{q:"Hangisi hadislerin ihtisarı hakkındaki görüşlerden biri değildir?",o:["İhtisar caiz değildir","Manayı bozmamak kaydıyla caizdir","Hadisin tamamı rivayet edildikten sonra caizdir","Sadece sahabeye caizdir"],a:3,n:["Görüşlerden biridir.","Görüşlerden biridir.","Görüşlerden biridir.","Böyle bir görüş yoktur; dördüncü görüş \"âlimlere caizdir\"dir."],p:"43–44"},

{q:"Kitaba göre tahammül (hadis alma) yolları kaç tanedir?",o:["Dört","Altı","Sekiz","On"],a:2,n:["Yanlış.","Yanlış.","Doğru: semâ, kıraat, icazet, münâvele, kitabet, i'lâm, vasiyet, vicâde.","Yanlış."],p:"44"},
{q:"Mükâtebe ile mürâsele arasındaki fark nedir?",o:["Mürâselede elçiye yazılı metin verilmez, elçi rivayeti ezberinde tutar","Mükâtebede şeyh hiç yazmaz","İkisinde de izin şarttır","Mürâsele sadece sahabe arasında olur"],a:0,n:["Doğru. Sahih görüşe göre ikisinde de izne gerek yoktur.","Mükâtebede şeyh yazar ve bir aracıyla gönderir.","Sahih görüşe göre izne gerek yoktur.","Yanlış."],p:"47"},
{q:"\"قال\" lafzıyla yapılan rivayet ne zaman semâ mesabesindedir?",o:["Her zaman","Ravi semâdan başka metotla rivayette bulunmuyorsa","Ravi müdellisse","Hiçbir zaman"],a:1,n:["Yanlış.","Doğru. Başka metotlarla da aldığı biliniyorsa semâ kesinleşmeden kabul edilmez.","Yanlış.","Yanlış."],p:"47"},
{q:"Hangisi rivayet metotlarının amaçlarından biri değildir?",o:["Yazı hatalarını düzeltmek","Hadisin yorumunu öğrenmek","Hadisin sıhhatini öğrenmek","Ravinin şöhret kazanması"],a:3,n:["Amaçtır.","Amaçtır.","Amaçtır (hadisin aidiyetini öğrenmek de).","Amaç değildir."],p:"47"},
{q:"\"أنّ\" lafzıyla rivayet hangi durumda muttasıl kabul edilir?",o:["Ravi müdellis değilse ve hocasıyla görüştüğü biliniyorsa","Ravi tâbiî ise","Her durumda","Hiçbir durumda"],a:0,n:["Doğru.","Yanlış.","Yanlış.","Yanlış."],p:"47"},
{q:"Vasiyet yoluyla tahammül hakkında doğru olan görüş nedir?",o:["Vasiyet edilen kitabın rivayeti caizdir","Vasiyet edilen kitabın o ravi tarafından rivayeti caiz değildir","Vasiyet semâdan üstündür","Vasiyet sadece yolculukta geçerlidir"],a:1,n:["Seleften bazıları caiz demiştir ama doğru olan bu değildir.","Doğru. İlk dönem muhaddisler vasiyeti güvenilir bir metot görmemiştir.","Yanlış.","Yanlış."],p:"46–47"}
],

{q:"Âhâd haberin bilgi değeri nedir?",o:["İlm-i zarûrî","İlm-i nazarî (zannî)","Hiçbir bilgi ifade etmez","Sadece amel ifade eder"],a:1,n:["Bu mütevâtirindir.","Doğru.","Yanlış.","Yanlış."],p:"51"},
{q:"Meşhur hadisin sıhhati hakkında hangisi doğrudur?",o:["Her zaman sahihtir","Sahih, hasen veya zayıf olabilir","Her zaman zayıftır","Mütevâtir hükmündedir"],a:1,n:["Yanlış.","Doğru. Meşhurluk ravi sayısıyla ilgilidir, sıhhatle değil.","Yanlış.","Yanlış."],p:"51"},
{q:"Nuhbetü'l-fiker şarihlerinin çoğu garîb-i mutlakta hangi tabakanın teferrüdünü esas alır?",o:["Sahabe","Tâbiîn","Tebe-i tâbiîn","Musannif"],a:1,n:["Kitaptaki asıl tarif sahabenin tek kalmasıdır; şarihler ise tâbiîyi esas alır.","Doğru.","Yanlış.","Yanlış."],p:"52"},
{q:"İbn Hacer öncesi bazı âlimlere göre hadisin BÜTÜN tabakalarında teferrüd olursa ne denir?",o:["Ferd-i nisbî","Ferd-i mutlak","Azîz","Meşhur"],a:1,n:["Senedin sadece bazı yerlerinde teferrüd olursa.","Doğru.","Yanlış.","Yanlış."],p:"53"},
{q:"Lafzî ve manevî mütevâtir hakkında hangisi doğrudur?",o:["Lafzî mütevâtir manevîden çok daha fazladır","Manevî mütevâtir lafzîye göre azımsanmayacak derecede çoktur","İkisi eşit sayıdadır","Manevî mütevâtir yoktur"],a:1,n:["Ters.","Doğru.","Yanlış.","Yanlış."],p:"50"},
{q:"\"Katfü'l-ezhâr\" nedir?",o:["Kettânî'nin mütevâtir hadis eseri","Süyûtî'nin el-Ezhârü'l-mütenâsira'yı telhis ettiği eser","Garîb hadis eseri","Dârekutnî'nin eseri"],a:1,n:["Kettânî'nin eseri Nazmü'l-mütenâsir'dir.","Doğru.","Yanlış.","Yanlış."],p:"50"}

u5:[
{q:"Kitaba göre makbul rivayetin tarifi nedir?",o:["Senedi mütevâtir olan haber","Ravilerinin doğruluğu noktasında zann-ı galibin oluştuğu haber","Ravileri fakih olan haber","Sahîhayn'da geçen haber"],a:1,n:["Yanlış.","Doğru. Zann-ı galib oluşmazsa merduddur. Cumhura göre makbulle amel vaciptir.","Yanlış.","Yanlış."],p:"54"},
{q:"Hadis ilminde \"adalet\" nasıl tarif edilir?",o:["Ravinin hafızasının güçlü olması","Kişiyi takvaya sevk eden, büyük günahtan alıkoyan, küçük günahta ısrarı engelleyen meleke","Ravinin çok hadis bilmesi","Ravinin Arap olması"],a:1,n:["Bu zabttır.","Doğru. Bazı âlimler mürûeti de adaletin şartı sayar.","Yanlış.","Yanlış."],p:"54"},
{q:"Mürûet ile ilgili hangisi doğrudur?",o:["Tamamen dinîdir, örfe göre değişmez","Daha çok örfîdir, örften örfe değişebilir; değişmeyen yönleri dinin belirlediği ahlaki erdemlerdir","Zabtın bir parçasıdır","Sadece sahabede aranır"],a:1,n:["Yanlış.","Doğru. Örnek: yollara bevletmek, hamamlarda oynamak mürûete aykırıdır.","Adaletle ilgilidir.","Yanlış."],p:"55"},
{q:"Ravinin hadisleri yazdığı kitabını yazım anından rivayet edene kadar korumasına ne denir?",o:["Zabt-ı sadr","Zabt-ı kitâb","Mukabele","İtkan"],a:1,n:["Hadisi istediği zaman hatırlayacak şekilde ezberlemektir.","Doğru.","Nüshayı aslıyla karşılaştırmaktır.","Yanlış."],p:"55"},
{q:"Hâkim'in Müstedrek'i hakkında hangisi doğrudur?",o:["Sadece sahih hadis içerir","Sahih olmayan hadisleri de almış, onlara işaret etmiştir; işaret etmediği illetli hadisler de vardır","Sahîhayn'ın müstahrecidir","Sadece Müslim'in şartlarını esas alır"],a:1,n:["Yanlış.","Doğru.","Müstedrektir, müstahrec değil.","Buhârî ve Müslim'in şartlarını esas alır."],p:"56–57"},
{q:"Müstahreclerdeki bir hadis ne zaman \"Buhârî'nin hadisi\" diye rivayet edilebilir?",o:["Her zaman","Lafız Sahîhayn'a uyuyorsa veya müstahric \"Sahîhayn'ın lafzı\" diye kayıt düşmüşse","Hiçbir zaman","Senet aynı ise"],a:1,n:["Yanlış.","Doğru.","Yanlış.","Yanlış."],p:"57"},
{q:"Hangisi içinde hasen hadis bulunan eserlerden biri olarak sayılmaz?",o:["Câmiu't-Tirmizî","Sünen-i Ebî Dâvûd","Sünen-i Dârekutnî","Buhârî'nin Sahîh'i"],a:3,n:["Sayılır.","Sayılır.","Sayılır.","Sayılmaz. Sadece sahih hadisleri içeren ilk eserdir."],p:"56, 58"},
{q:"Kendi kuvvetinde başka bir hadisle teâruz hâlinde olmayan makbul hadise ne denir?",o:["Muhkem","Muhtelifü'l-hadîs","Nâsih","Mahfuz"],a:0,n:["Doğru. Bu tür hadislerle amel edilebilir.","Denk bir hadisle teâruz eden ama cem edilebilen hadis.","Önceki hükmü kaldıran hadis.","Şazın mukabilidir."],p:"59"},
{q:"\"el-İ'tibâr fi'n-nâsih ve'l-mensûh mine'l-âsâr\" kimin eseridir?",o:["İbn Kuteybe","Ebû Bekir el-Hâzimî","Tahâvî","İbnü'l-Cevzî"],a:1,n:["Te'vîlü muhtelifi'l-hadîs onundur.","Doğru.","Müşkilü'l-âsâr onundur.","Tecrîdü'l-ehâdîsi'l-mensûha onundur."],p:"60"}
],
u6:[

{q:"Mevzu rivayetleri zayıfın bir kısmı sayanlar ile ayrı başlıkta inceleyenler sırasıyla hangisidir?",o:["İbn Hacer, Zerkeşî – Hattâbî, İbnu's-Salâh, Irâkî","Hattâbî, İbnu's-Salâh, Irâkî – İbn Hacer, Zerkeşî","Buhârî – Müslim","Süyûtî – Sehâvî"],a:1,n:["Ters.","Doğru. Zayıfın mertebeleri: zayıf, zayıf cidden, vâhî, münker.","Yanlış.","Yanlış."],p:"60"},
{q:"\"et-Terğîb ve't-terhîb\" adlı eserde \"ruviye\" diye nakledilen hadis nasıl değerlendirilir?",o:["Sahihtir","Hasendir","Zayıftır","Mevzûdur"],a:2,n:["Yanlış.","Yanlış.","Doğru.","Yanlış."],p:"60"},
{q:"Hangisi sadece zayıf hadisleri içeren eserlerden biridir?",o:["Ebû Dâvûd'un el-Merâsîl'i","İbn Hibbân'ın ed-Du'afâ'sı","Zehebî'nin Mîzânü'l-i'tidâl'i","Tirmizî'nin Câmi'i"],a:0,n:["Doğru. Dârekutnî'nin el-İlel'i de sayılır.","İçinde zayıf hadis olduğu düşünülen eser.","İçinde zayıf hadis olduğu düşünülen eser.","Yanlış."],p:"61"},
{q:"Sakt-ı zâhir nedir?",o:["Ravi ile şeyhin mülaki olmaması (aynı asırda yaşamamak veya yaşayıp görüşmemek)","Düşen raviyi ancak uzmanların tespit edebilmesi","Senede ravi eklenmesi","Metne kelime eklenmesi"],a:0,n:["Doğru.","Bu sakt-ı hafîdir.","Bu el-mezîd fî muttasılı'l-esânîd'dir.","Bu idracdır."],p:"61"},
{q:"Sahabe mürselinin cumhura göre hükmü nedir?",o:["Merduddur","Sahihtir, delil olmaya elverişlidir","Mevzûdur","Tevakkuf edilir"],a:1,n:["Yanlış.","Doğru. Sahabenin sahabeyi atlaması çoktur; tâbiîden alıp düşürmesi çok nadirdir.","Yanlış.","Yanlış."],p:"63"},
{q:"Mürsel hadislerle ilgili \"Câmiu't-tahsîl li-ahkâmi'l-merâsîl\" kimin eseridir?",o:["Ebû Dâvûd","Ebû Hâtim","el-Alâî","el-Hatîb"],a:2,n:["el-Merâsîl onundur.","el-Merâsîl onundur.","Doğru.","Yanlış."],p:"63"},
{q:"\"Tedlîs\" kelimesinin sözlük anlamı nedir?",o:["Gizlemek – malın ayıbını müşteriden gizlemek","Eklemek","Değiştirmek","Kısaltmak"],a:0,n:["Doğru. Istılahta isnaddaki kusurun saklanıp senedin zahirinin güzelleştirilmesidir.","Bu idracdır.","Bu kalbdir.","Bu ihtisardır."],p:"66"},
{q:"Tedlîs çeşitlerinin kerahat sıralaması en çirkinden aşağı doğru hangisidir?",o:["Şuyûh – isnad – tesviye","Tesviye – isnad – şuyûh","İsnad – tesviye – şuyûh","Tesviye – şuyûh – isnad"],a:1,n:["Ters.","Doğru.","Yanlış.","Yanlış."],p:"67"},
{q:"\"Haddesenâ fülân, enne fülânen kâle\" şeklindeki rivayete ne denir?",o:["Muanan","Müennen","Müselsel","Müdrec"],a:1,n:["\"Fülân an fülân\" şeklindedir.","Doğru. Cumhura göre muanan gibidir; şartlarıyla semâya hamledilir.","Yanlış.","Yanlış."],p:"70"},
{q:"Mürsel-i hafî sahasında yazılan eserlerin başında gelen hangisidir?",o:["el-Hatîb'in et-Tafsîl li-mübhemi'l-merâsîl'i","Ebû Dâvûd'un el-Merâsîl'i","İbn Hacer'in Takrîbü'l-menhec'i","Dârekutnî'nin el-İlel'i"],a:0,n:["Doğru.","Mürsel eseridir.","Müdrec eseridir.","Muallel eseridir."],p:"69"}
],
u7:[

{q:"Mevzu bir haberi rivayet etmenin hükmü nedir?",o:["Her durumda caizdir","Mevzu olduğu belirtilmeden nakli haramdır","Fezâilde caizdir","Mekruhtur"],a:1,n:["Yanlış.","Doğru.","Yanlış. Bu şartlarıyla zayıf hadis için söylenir.","Yanlış."],p:"71"},
{q:"Hadis uyduranların bir kısmının zühd ve takva sahibi olması hangi uydurma sebebiyle ilgilidir?",o:["Siyasi görüşlere destek","İslâm'a zarar vermek","Allah'a yaklaşmak, insanları iyiliğe yöneltmek","Şöhret olma"],a:2,n:["Hâricî ve Şiîlerle anılır.","Yanlış.","Doğru.","Yanlış."],p:"72"},
{q:"Ravi mübhem bıraktığı kişi için \"Bana sika haber verdi\" derse rivayet kabul edilir mi?",o:["Evet, ravi sika dediği için","Hayır; cerh-ta'dil âlimlerinin araştırmasına engeldir, kim olduğu bilinene kadar reddedilir","Sadece sahabe ise","Sadece fezâilde"],a:1,n:["Yanlış.","Doğru.","Yanlış.","Yanlış."],p:"73"},
{q:"İbn Hacer'in münker tarifi neden mütekaddimûnun ıstılahıyla örtüşmez?",o:["Onlar münkeri hiç kullanmamıştır","Onlar sika ravinin teferrüd ettiği hadise de münker demiş, muhalefeti şart koşmamıştır","Onlar münkeri sahih saymıştır","Onlar münkeri mevzû saymıştır"],a:1,n:["Yanlış.","Doğru. Nesâî gibi bazıları teferrüdle birlikte hatayı da şart koşar.","Yanlış.","Yanlış."],p:"74"},
{q:"Hangisi illetin tespit yollarından biri değildir?",o:["Ravinin teferrüdü","Başka bir ravinin muhalefeti","Bu ikisi birlikte ve başka karineler","Hadisin kısa olması"],a:3,n:["Yoldur.","Yoldur.","Yoldur.","Yol değildir."],p:"75"},
{q:"Müdrec hadis hakkındaki \"el-Fasl li'l-vasli'l-müdrec fi'n-nakl\" kimin eseridir?",o:["el-Hatîb el-Bağdâdî","İbn Hacer","Dârekutnî","Süyûtî"],a:0,n:["Doğru.","İbn Hacer'in eseri Takrîbü'l-menhec bi-tertîbi'l-müdrec'tir.","Yanlış.","Yanlış."],p:"77"},
{q:"Ravinin \"Ka'b b. Mürre\"yi \"Mürre b. Ka'b\" diye kaydetmesi hangi tür kalbdir ve böyle raviye ne denir?",o:["Maklûbü'l-metin – \"hata etti\"","Maklûbü's-sened – \"hadisi çaldı\"","Musahhaf – \"tashîf etti\"","Müdrec – \"ekledi\""],a:1,n:["Metinde kalb, \"sağ elinin vereceğini…\" örneğindeki gibidir.","Doğru.","Tashîf kelimenin başka lafza çevrilmesidir.","Yanlış."],p:"77"},
{q:"\"el-Mezîd fî muttasılı'l-esânîd\"de ziyadenin reddedilmesi için hangi iki şart gerekir?",o:["Ziyade yapmayan daha mutkin olmalı ve ziyade yerinde açık semâ lafzı bulunmalı","Ziyade yapan zayıf olmalı ve hadis garîb olmalı","Hadis mürsel olmalı ve ravi meçhul olmalı","Ziyade metinde olmalı"],a:0,n:["Doğru. İkisi birlikte yoksa ziyade makbuldür; ziyadesiz rivayet mürsel-i hafî sayılır.","Yanlış.","Yanlış.","Yanlış."],p:"78"},
{q:"İbn Hacer'in taksiminde \"musahhaf\" ile \"muharref\" arasındaki fark nedir?",o:["Musahhaf noktalarda, muharref harekelerdeki tashîftir","Musahhaf senette, muharref metindedir","İkisi aynıdır","Musahhaf işitmeden, muharref görmeden kaynaklanır"],a:0,n:["Doğru.","Yanlış.","Yanlış.","Yanlış."],p:"80"},
{q:"Ravilerin tashîfe düşmesinin en önde gelen sebeplerinden biri nedir?",o:["Hadisi doğrudan kitaptan almaları","Hadisi şeyhten dinlemeleri","Çok seyahat etmeleri","Hadisi ezberlemeleri"],a:0,n:["Doğru. Şeyhten değil kitaptan alınca bu hatalar olur.","Tersi.","Yanlış.","Yanlış."],p:"80"}
],

{q:"Merfû hadis ile ilgili hangisi doğrudur?",o:["Merfû hadisin senedi mutlaka muttasıldır","Bir hadis merfû-mürsel veya merfû-munkatı' olabilir","Merfû sadece sahabe tarafından izafe edilir","Merfû sadece sözdür"],a:1,n:["Yanlış. İzafe edenin kim olduğu ve ittisal fark etmez.","Doğru.","Tâbiî de izafe edebilir.","Fiil, takrir ve sıfatları da kapsar."],p:"82"},
{q:"Horasan fakihleri merfû ve mevkufa ne demişlerdir?",o:["Merfûya eser, mevkufa haber","Merfûya haber, mevkufa eser","İkisine de hadis","İkisine de eser"],a:1,n:["Ters.","Doğru. Hadisçiler ise ikisine de eser der.","Yanlış.","Bu hadisçilerin kullanımıdır."],p:"82"},
{q:"Mevkuf hadisle ihticac hakkında hangisi doğrudur?",o:["Hanefîlere göre mevkufla ihticac edilir","Hiçbir mezhep mevkufla ihticac etmez","Şâfiî'den nakledilen \"mevkuf hüccet değildir\" sözü herkesçe doğru kabul edilmiştir","Mevkuf her zaman zayıftır"],a:0,n:["Doğru.","Yanlış.","Birçok âlim bu nakli doğru görmemiştir.","Sahih, hasen veya zayıf olabilir."],p:"82"},
{q:"Sahih görüşe göre cerh ve ta'dil kaç kişinin sözüyle sabit olur?",o:["Bir","İki","Üç","Çoğunluk"],a:0,n:["Doğru.","Mu'temed olmayan görüştür.","Yanlış.","Yanlış."],p:"85"},
{q:"Adil bir ravinin adaleti bilinmeyen birinden hadis alması çoğunluğa göre nedir?",o:["Ta'dil sebebidir","Ta'dil sebebi sayılmaz","Cerh sebebidir","Tevakkuf sebebidir"],a:1,n:["Zayıf bir görüştür.","Doğru.","Yanlış.","Yanlış."],p:"85"},
{q:"Hadis rivayetinden ücret alan ravi hakkında Ebû İshak eş-Şîrâzî'nin fetvası nedir?",o:["Kesinlikle caiz değildir","Rivayetle uğraşmaktan geçimini temin edemiyorsa caizdir","Her durumda caizdir","Sadece sahabeye caizdir"],a:1,n:["Bazı muhaddislerin görüşüdür.","Doğru.","Yanlış.","Yanlış."],p:"85"},
{q:"İlk iki cerh mertebesindeki (\"leyyinü'l-hadîs\", \"zaîf\") ravilerin hükmü nedir?",o:["İhticac edilir","İhticac edilmez ama hadisleri i'tibâr için yazılır","Hadisleri yazılmaz","Mevzû sayılır"],a:1,n:["Yanlış.","Doğru. Diğer dört cerh mertebesinin hadisleri yazılmaz da.","Bu ağır mertebeler içindir.","Yanlış."],p:"87"},
{q:"Hadis dinlemenin müstehab olduğu yaş konusunda Basralı, Kûfeli ve Şamlılar sırasıyla ne demiştir?",o:["10 – 20 – 30","20 – 10 – 30","30 – 20 – 10","5 – 10 – 15"],a:0,n:["Doğru. Doğru olan, hadis dinlemenin sahih olduğu en erken yaştır.","Yanlış.","Ters.","Yanlış."],p:"88"},
{q:"Senette \"ح\" kısaltması ne anlama gelir?",o:["Haddesenâ","Senedin değiştiği, yeni bir sened getirildiği","Hasen hadis","Hâfız"],a:1,n:["Haddesenâ \"ثنا\" veya \"نا\" diye kısaltılır.","Doğru.","Yanlış.","Yanlış."],p:"89"},
{q:"\"en-Nihâye fî garîbi'l-hadîs ve'l-eser\" kimin eseridir?",o:["Ebû Ubeyd","İbnü'l-Esîr","Zemahşerî","Süyûtî"],a:1,n:["Onun eseri Garîbü'l-hadîs'tir.","Doğru. Süyûtî'nin ed-Dürrü'n-nesîr'i bunun telhisidir.","Onun eseri el-Fâik'tir.","Yanlış."],p:"90"},
{q:"Hangisi ravinin riayet etmesi gereken adaptan biri değildir?",o:["Sahih niyet ve ihlas","Kendinden daha öncelikli bir âlimin huzurunda rivayet etmemek","İmla meclisleri tertiplemek","Niyeti bozuk görünen kimseye hadis rivayet etmekten uzak durmak"],a:3,n:["Adaptandır.","Adaptandır.","Adaptandır. İmla meclisi rivayetin en üstün mertebesidir.","Değildir. O kişi ileride niyetini düzeltebilir; ondan uzak durulmaz."],p:"90"},
{q:"Muhaddislerin isnadın âlî olmasına önem vermesinin sebebi nedir?",o:["Sened uzadıkça hata ihtimali artar","Kısa senetler daha kolay ezberlenir","Uzun senetler mevzûdur","Sadece şöhret için"],a:0,n:["Doğru. Bu yüzden senetler sünâî, sülâsî, rubâî diye adlandırılmıştır.","Yanlış.","Yanlış.","Yanlış."],p:"92"}
],

{q:"\"Yezîd b. Esved / Esved b. Yezîd\" örneği hangi konuya aittir?",o:["Müttefik-müfterik","Müteşâbih","Mühmel","Müdebbec"],a:1,n:["Yanlış.","Doğru. Müteşâbihin isim ve baba isminin yer değiştirdiği çeşididir.","Yanlış.","Yanlış."],p:"97"},
{q:"Rivâyetü'l-ekâbir ani'l-esâğir bilgisinin faydası nedir?",o:["Senette kalb (yer değiştirme) olmadığını anlamak","Hadisin mevzû olduğunu anlamak","Ravinin yaşını bulmak","Hadisin mütevâtir olduğunu anlamak"],a:0,n:["Doğru. Genelde rivayet edilen büyük olduğu için tersi kalb sanılabilir.","Yanlış.","Yanlış.","Yanlış."],p:"99"},

{q:"Vuhdân raviler hakkında Hâkim ve cumhurun görüşü nedir?",o:["Hâkim: Sahîhayn'da vuhdân yoktur; cumhur: sahabeden vuhdân vardır","İkisi de yoktur der","İkisi de çoktur der","Hâkim: vardır; cumhur: yoktur"],a:0,n:["Doğru. Müslim'in el-Münferidât ve'l-vuhdân adlı eseri vardır.","Yanlış.","Yanlış.","Ters."],p:"100"},

],
u10:[
{q:"Kitaba göre hadis ilminin doğmasının temel sebebi nedir?",o:["Fetihler","Hz. Peygamber'in sözlerinin yanında bulunmayanlara aktarılmasını istemesi","Mu'tezile tartışmaları","Oryantalist eleştiriler"],a:1,n:["Yanlış.","Doğru. Bu istek rivayet metodunu doğurmuş, kriterleri Kur'ân koymuştur (\"Fâsık bir haber getirirse…\").","Yanlış.","Yanlış."],p:"103"},
{q:"Hangisi Hz. Peygamber dönemindeki hadis yazımına örnek değildir?",o:["es-Sahîfetü's-sâdıka","Yemenli Ebû Şâh için hutbenin yazılması","Hz. Ali'nin yazdıkları","İmam Mâlik'in Muvatta'ı"],a:3,n:["Örnektir.","Örnektir.","Örnektir (Amr b. Hazm'ınkiler de).","Örnek değildir; hicrî 2. asır eseridir."],p:"103"},
{q:"Hicrî ikinci asrın temel özelliği nedir?",o:["Şifâhî rivayetin hâkim olması","Yazılı rivayete geçilmesi","Kütüb-i sittenin yazılması","Rivayetin sona ermesi"],a:1,n:["1. asrın özelliğidir.","Doğru. Yazıdan doğan problemleri çözmek için eğitim metotları ve rivayet lafızları geliştirilmiştir.","3. asırdır.","Nakil döneminin özelliğidir."],p:"105"},
{q:"Mu'tezile rü'yetullahı neden reddeder?",o:["Teşbih ve tecsimden kaçınmak için","Haber-i vâhidi reddettiği için","Kader inancı yüzünden","Kur'ân mahlûk olduğu için"],a:0,n:["Doğru. Allah cisim olmadığı için gözle görülmez derler. Ehl-i hadise göre rü'yete iman farzdır.","Yanlış.","Yanlış.","Yanlış."],p:"106"},
{q:"Ehl-i hadis Halku'l-Kur'ân görüşüne nasıl karşılık vermiştir?",o:["Kur'ân'ın mahlûk olduğunu söylemekle onun beşer sözü olduğunu iddia etmek arasında fark yoktur","Kur'ân'ın lafzı mahlûktur","Bu konuda susulmalıdır","Sadece manası mahlûktur"],a:0,n:["Doğru.","Yanlış.","Yanlış.","Yanlış."],p:"106"}

u11:[
{q:"Buhârî'nin soyundaki Berdizbe hakkında hangisi doğrudur?",o:["Müslüman olarak ölmüştür","Mecûsî olarak ölmüştür; sülaleden ilk Müslüman olan oğlu Muğîre'dir","Arap asıllıdır","Buhârî'nin babasıdır"],a:1,n:["Yanlış.","Doğru. Berdizbe Farsçada \"çiftçi\" demektir.","Yanlış.","Yanlış."],p:"107"},

{q:"Buhârî'nin fıkhî mezhebiyle ilgili hangi eşleştirme yanlıştır?",o:["Tâceddin es-Sübkî – Şâfiî","İbnü'l-Kayyim – Hanbelî","Enver Şah Keşmîrî – müctehid","Tâhir el-Cezâirî – Hanefî"],a:3,n:["Doğru eşleşme. Maruf olan budur.","Doğru eşleşme.","Doğru eşleşme. Kandehlevî de müctehid der.","Yanlış eşleşme. Cezâirî onu müctehid sayar."],p:"108"},
{q:"\"el-Câmi'\" kelimesinin kapsadığı sekiz konudan hangisi değildir?",o:["Siyer","Eşrâtü's-sâa","Menâkıb","Nahiv"],a:3,n:["Sekiz konudandır.","Sekiz konudandır.","Sekiz konudandır.","Değildir. Diğerleri: âdâb, tefsir, akaid, fiten, ahkâm."],p:"109"},
{q:"Dârekutnî Buhârî'nin Sahîh'inde kaç hadisi tenkit etmiştir?",o:["22","80","110","160"],a:2,n:["Buhârî'deki sülâsî sayısıdır.","Buhârî'de zayıflıkla itham edilen ravi sayısıdır.","Doğru. Çoğunun cevabı verilmiştir.","Müslim'de zayıflıkla itham edilen ravi sayısıdır."],p:"112"},
{q:"Buhârî'nin \"ve kâle ba'du'n-nâs\" ifadesi hakkında hangisi doğrudur?",o:["Sadece Ebû Hanîfe için kullanmıştır","Kabul etmediği görüşleri reddetmek için yaklaşık 25 yerde kullanmıştır; Ebû Hanîfe dışındakiler için de kullanmıştır","Hiç kullanmamıştır","Övgü ifadesidir"],a:1,n:["Şöhret bu yöndedir ama doğru değildir; Îsâ b. Ebân, İmam Muhammed ve Şâfiî için de kullanmıştır.","Doğru. Keşmîrî'ye göre ilk kez Rikâz babında geçer.","Yanlış.","Yanlış."],p:"115"},
{q:"Müslim Sahîh'inin telifine kaç yaşında ve nerede başlamıştır?",o:["29 yaşında, Nîşâbur'da (h. 235)","40 yaşında, Bağdat'ta","20 yaşında, Mekke'de","16 yaşında, Buhara'da"],a:0,n:["Doğru. Ahmed b. Seleme'ye göre 15 yılda tamamlanmıştır.","Yanlış.","Yanlış.","Yanlış."],p:"118"},
{q:"Müslim eserinin telifini bitirince kime arz etmiştir?",o:["Buhârî","Ebû Zür'a er-Râzî","Ahmed b. Hanbel","Zühelî"],a:1,n:["Yanlış.","Doğru. Onun işaret ettiği illetli hadisleri çıkarmıştır.","Ebû Dâvûd eserini ona arz etmiştir.","Yanlış."],p:"119"},
{q:"Müslim'e göre eserine hangi hadisleri almıştır?",o:["Kendi görüşüne göre sahih olanları","Muhaddislerin üzerinde ittifak ettiği sahih hadisleri","Bütün sahih hadisleri","Sadece Buhârî'den aldıklarını"],a:1,n:["Kendi ifadesine göre değildir.","Doğru. Bulkînî bu muhaddisleri Ahmed, İbn Maîn, Osman b. Ebî Şeybe, Saîd b. Mansûr diye sayar.","Yanlış.","Buhârî'den Sahîh'inde hiç hadis nakletmemiştir."],p:"118–119"},
{q:"Muhammed Fuâd Abdülbâkî'ye göre Müslim'in Sahîh'inde tekrarsız kaç hadis vardır?",o:["4000","3033","7275","2513"],a:1,n:["Cezâirî ve birçok âlimin verdiği yaklaşık sayıdır.","Doğru.","Nevevî'nin Buhârî için verdiği tekrarlı sayıdır.","Süyûtî'nin Buhârî için verdiği tekrarsız sayıdır."],p:"118"}
],
u12:[
{q:"Ebû İshak eş-Şîrâzî Tabakâtü'l-fukahâ'da Ebû Dâvûd'u hangi mezhepten saymıştır?",o:["Şâfiî","Hanbelî","Hanefî","Mâlikî"],a:1,n:["Sıddîk Hasan Han'ın görüşüdür.","Doğru.","Yanlış.","Yanlış."],p:"121"},
{q:"Kandehlevî'ye göre hadis öğretiminde ilk okutulması gereken eser hangisidir?",o:["Buhârî","Tirmizî'nin Sünen'i","Muvatta","Nesâî"],a:1,n:["Üçüncü sıradadır (Sahîhayn).","Doğru. Sonra Ebû Dâvûd, Sahîhayn, Nesâî, İbn Mâce ve en son Muvatta gelir.","En sondadır.","Yanlış."],p:"121"},
{q:"Ebû Dâvûd'un Sünen'inin özelliklerinden hangisi doğrudur?",o:["Yaş önceliğini ilimde büyüklüğe tercih ederek rivayetleri zikretmiştir","Hiç ihtisar yapmamıştır","Sadece sahih hadis almıştır","Bab başlığı yoktur"],a:0,n:["Doğru. En âlî senedi sülâsî hükmündeki rubâî hadistir.","Uzun hadisleri ihtisar etmiştir.","Yanlış.","Yanlış."],p:"122"},
{q:"Tirmizî'nin \"وفي الباب عن فلان\" ifadesi ne anlama gelir?",o:["Falanca aynı hadisi rivayet etmiştir","Bu babta başka hadisler de mevcuttur","Hadis zayıftır","Hadis mevzûdur"],a:1,n:["Yanlış anlaşılan budur.","Doğru.","Yanlış.","Yanlış."],p:"126"},
{q:"Tirmizî \"kerâhet\" kavramını nasıl kullanmıştır?",o:["Sadece tahrîmen mekruh","Hem tahrîm hem tenzih anlamında","Sadece tenzîhen mekruh","Hiç kullanmamıştır"],a:1,n:["Mütekaddimîn böyle kullanırdı; Tirmizî daha geniş kullanır.","Doğru.","Yanlış.","Yanlış."],p:"126"},
{q:"İbnü'l-Cevzî'nin Tirmizî'nin Câmi'inde mevzu olduğunu iddia ettiği hadislere cevap veren Süyûtî'nin eseri hangisidir?",o:["et-Teakkubât ale'l-mevzûât","el-Leâli'l-masnûa","Kûtü'l-müteğazzî","Tedrîbü'r-râvî"],a:0,n:["Doğru. Nevevî de İbnü'l-Cevzî'nin birçok hasene mevzu dediğini söyler.","Süyûtî'nin mevzuat eseridir.","Süyûtî'nin Tirmizî şerhidir.","Usul eseridir."],p:"126–127"},
{q:"Nesâî'nin Sünen'inde en çok tekrarladığı hadis hangisidir?",o:["\"Ameller niyetlere göredir\" (16 kez)","\"Kim benim adıma yalan uydurursa\"","Uşârî hadis","\"Din nasihattir\""],a:0,n:["Doğru.","Yanlış.","Senedinde on ravi bulunan hadistir.","Yanlış."],p:"129"},
{q:"Bazı Mağrib âlimlerinin Nesâî'nin Sünen'ini Buhârî'den üstün görmesinin sebebi nedir?",o:["Hadis sayısının çokluğu","İllet beyanı ve tertibinin güzelliği","Senedlerinin kısalığı","Mevkufları çok alması"],a:1,n:["Yanlış.","Doğru. Nesâî eserini en geç telif eden kütüb-i sitte imamıdır.","Yanlış.","Yanlış."],p:"128"},
{q:"İbn Mâce'nin Sünen'i hakkında hangisi doğrudur?",o:["32 kitap, 1500 bab, yaklaşık 4000 hadis; Ebu'l-Hasen el-Kattân rivayeti meşhurdur","Hiç zayıf hadis yoktur","Kütüb-i sittenin ilk kitabıdır","İbn Mâce 303'te vefat etmiştir"],a:0,n:["Doğru.","Şiddetli zayıf hadisler bulunur.","Mertebece en alttadır.","303 Nesâî'nin vefatıdır; İbn Mâce 273'te vefat etmiştir."],p:"130"},
{q:"Muvatta'yı kütüb-i sitteye almayanlar hangi gerekçeyi öne sürmüştür?",o:["Muvatta'nın zayıf olması","İçeriğinin Sahîhayn ile aynı olması","Mâlik'in muhaddis olmaması","Mevkufların fazlalığı"],a:1,n:["Yanlış.","Doğru.","Yanlış.","Yanlış."],p:"131"}
],
u13:[
{q:"Câmiu'l-usûl li-ehâdîsi'r-rasûl hakkında hangisi doğrudur?",o:["Rezîn'in el-Cem' beyne usûli's-sitte'sini İbnü'l-Esîr yeniden düzenlemiştir; 9523 hadis vardır","Süyûtî'nin eseridir","Sadece Sahîhayn'ı toplar","Ricâl kitabıdır"],a:0,n:["Doğru. Sahabe dışındaki raviler hazfedilmiştir.","Süyûtî'nin eseri Cem'u'l-cevâmi'dir.","el-Cem' beyne's-sahîhayn eserleri bunu yapar.","Yanlış."],p:"134"},
{q:"Süyûtî'nin el-Câmiu's-sağîr'ine 4440 hadis ekleyerek Kenzü'l-ummâl'i yazan kimdir?",o:["Ali el-Müttakî el-Hindî","Rûdânî","Heysemî","İbn Kesîr"],a:0,n:["Doğru.","Cem'u'l-fevâid'in sahibidir.","Mecma'u'z-zevâid'in sahibidir.","Câmiu'l-mesânîd ile anılır."],p:"134"},
{q:"Mevzu hadis eserleriyle ilgili hangi eşleştirme yanlıştır?",o:["İbnü'l-Cevzî – el-Mevzûât","Süyûtî – el-Leâli'l-masnûa","Ali el-Kārî – el-Esrâru'l-merfûa","Şevkânî – Tehzîbü'l-Kemâl"],a:3,n:["Doğru eşleşme.","Doğru eşleşme.","Doğru eşleşme.","Yanlış eşleşme. Şevkânî'nin eseri el-Fevâidü'l-mecmûa'dır; Tehzîbü'l-Kemâl Mizzî'nindir."],p:"134"},
{q:"Nakil döneminin en temel özelliği nedir?",o:["Rivayetin sona ermesi ve rivayet döneminde yazılan kaynakların aktarılmaya başlaması","Hadislerin ilk defa yazılması","Mihne olayı","İsnadın ortaya çıkması"],a:0,n:["Doğru. Terimlerin tanımlanması da bu dönemin özelliğidir.","Yanlış.","Yanlış.","Yanlış."],p:"135"},
{q:"İlk dönem oryantalistlerin hadisler için kullandığı \"tradition\" kelimesi neyi yansıtır?",o:["Hadislerin Hz. Peygamber'le ilişkisi olmadığı, Müslümanların geliştirdiği gelenek olduğu iddiasını","Hadislere saygıyı","Hadislerin mütevâtir olduğunu","Sünnetin Kur'ân'dan önce geldiğini"],a:0,n:["Doğru.","Yanlış.","Yanlış.","Yanlış."],p:"136"},
{q:"\"Kur'ân Peygamber'in tefsirine ihtiyaç duymayacak kadar açıktır; hadislerle amel şirktir\" diyen ekol ve temsilcisi hangisidir?",o:["Aligarh – Seyyid Ahmed Han","Ehl-i Kur'ân – Abdullah Çekrâlevî","Ehl-i hadis – Nezir Hüseyin","Diyûbend – Keşmîrî"],a:1,n:["Hadisleri akıl süzgecinden geçirir ama tamamen reddetmez; Ehl-i Kur'ân'ın alt yapısını hazırlamıştır.","Doğru.","Kur'ân ve hadisin zahirine göre hüküm verir.","İnançta ehl-i sünnet, fıkıhta Hanefî."],p:"139"},
{q:"Müslim'in Sahîh'ine yapılan ilk şerh hangisidir?",o:["Nevevî – el-Minhâc","Mâzerî – el-Mu'lim bi-fevâidi Müslim","Kâdî İyâz – İkmâlü'l-Mu'lim","Suyûtî – ed-Dîbâc"],a:1,n:["Sonraki dönemdir.","Doğru.","Mâzerî'nin eserini tamamlar.","Sonraki dönemdir."],p:"135"},
{q:"Schacht'ın \"isnadlar geriye doğru gelişir\" iddiasına karşı hangi delil getirilir?",o:["Abdürrezzâk ve İbn Ebû Şeybe'nin musanneflerinde merfû kadar, hatta daha çok mevkuf ve maktû bulunması","Buhârî'nin tüm hadislerinin mütevâtir olması","Schacht'ın Arapça bilmemesi","Hadislerin hiç senedinin olmaması"],a:0,n:["Doğru. Ayrıca Schacht'ın kullandığı en eski kaynaklarda eksik ve mükemmel isnadlar yan yanadır.","Yanlış.","Kitapta geçmez.","Yanlış."],p:"137–138"}
]

u."], "p": "19"}, {"q": "“Rivâyetü'l-hadis” nedir?", "o": ["Ravinin tek başına rivayet ettiği hadis için başka tarikler arama eylemi.", "Hz. Peygamber'in söz ve fiillerini nakleden; ravilerini, zabtını ve tahririni içeren ilim.", "Ortaklığın ravinin şeyhinde değil, şeyhinin şeyhinde veya daha üstte gerçekleşmesi.", "Sözlükte geride kalan şey, ayak izi; ıstılahta hadisle eş anlamlı ya da sahabe, tâbiîn ve başkalarına izafe edilen söz ve fiil."], "a": 1, "n": ["Bu, “İ'tibâr” terimidir.", "Doğru.", "Bu, “Eksik (kâsıra) mütâbeat” terimidir.", "Bu, “Eser” terimidir."], "p": "19"}, {"q": "Şu tanım hangi terime aittir?\n“Rivayetin hakikatinin, şartlarının, nevilerinin, hükümlerinin ve ravilerin hallerinin bilindiği ilim.”", "o": ["Eser", "Dirâyetü'l-hadis", "Müsnid", "Rivâyetü'l-hadis"], "a": 1, "n": ["Eser: Sözlükte geride kalan şey, ayak izi; ıstılahta hadisle eş anlamlı ya da sahabe, tâbiîn ve başkalarına izafe edilen söz ve fiil.", "Doğru.", "Müsnid: Hadis ilmi bilgisi olsun olmasın, hadisi senediyle rivayet eden kimse.", "Rivâyetü'l-hadis: Hz. Peygamber'in söz ve fiillerini nakleden; ravilerini, zabtını ve tahririni içeren ilim."], "p": "19"}, {"q": "“Dirâyetü'l-hadis” nedir?", "o": ["Seneddeki ravileri birbirine ekleyerek hadisi söyleyenine dayandırma işi (ikinci anlamıyla senedle müradif).", "Metne kadar devam eden raviler zinciri.", "Cerh ve ta'dil ilminde ravinin adaletini gösteren en üstün ifade; belirli sayıda hadis bilen kişi anlamına gelmez.", "Rivayetin hakikatinin, şartlarının, nevilerinin, hükümlerinin ve ravilerin hallerinin bilindiği ilim."], "a": 3, "n": ["Bu, “İsnad” terimidir.", "Bu, “Sened” terimidir.", "Bu, “Hüccet” terimidir.", "Doğru."], "p": "19"}, {"q": "Şu tanım hangi terime aittir?\n“Akaid, ibadât, muamelât, siyer, menâkıb, rikâk, fiten ve kıyamet ahvâli gibi sekiz ana konuyu içeren eser.”", "o": ["Mu'cem", "Câmi'", "Müstahrec", "Muvatta"], "a": 1, "n": ["Mu'cem: Müellifin şeyhlerinin isimlerine, beldelere veya sahabe isimlerine göre tertip edilmiş hadis kitabı.", "Doğru.", "Müstahrec: Bir eserin hadislerinin, o eserin müellifinin şeyhinde veya daha üstte buluşan başka senedlerle tahric edildiği eser.", "Muvatta: Fıkıh bablarına göre düzenlenmiş, merfû, mevkuf ve maktû içeren, adı \"kolaylaştırılmış\" ya da \"uygun bulunmuş\" anlamına gelen eser."], "p": "38"}, {"q": "“Câmi'” nedir?", "o": ["Fıkıh konularına göre düzenlenmiş; merfû, mevkuf, maktû ve az da olsa tebe-i tâbiîn fetvalarını içeren eser.", "Fıkıh bablarına göre düzenlenmiş, çoğunlukla sadece merfû rivayet içeren eser.", "Bir eserin hadislerinin, o eserin müellifinin şeyhinde veya daha üstte buluşan başka senedlerle tahric edildiği eser.", "Akaid, ibadât, muamelât, siyer, menâkıb, rikâk, fiten ve kıyamet ahvâli gibi sekiz ana konuyu içeren eser."], "a": 3, "n": ["Bu, “Musannef” terimidir.", "Bu, “Sünen” terimidir.", "Bu, “Müstahrec” terimidir.", "Doğru."], "p": "38"}, {"q": "Şu tanım hangi terime aittir?\n“Fıkıh bablarına göre düzenlenmiş, merfû, mevkuf ve maktû içeren, adı \"kolaylaştırılmış\" ya da \"uygun bulunmuş\" anlamına gelen eser.”", "o": ["Muvatta", "Sünen", "Mu'cem", "Musannef"], "a": 0, "n": ["Doğru.", "Sünen: Fıkıh bablarına göre düzenlenmiş, çoğunlukla sadece merfû rivayet içeren eser.", "Mu'cem: Müellifin şeyhlerinin isimlerine, beldelere veya sahabe isimlerine göre tertip edilmiş hadis kitabı.", "Musannef: Fıkıh konularına göre düzenlenmiş; merfû, mevkuf, maktû ve az da olsa tebe-i tâbiîn fetvalarını içeren eser."], "p": "38"}, {"q": "“Muvatta” nedir?", "o": ["Bir eserin hadislerinin, o eserin müellifinin şeyhinde veya daha üstte buluşan başka senedlerle tahric edildiği eser.", "Fıkıh bablarına göre düzenlenmiş, merfû, mevkuf ve maktû içeren, adı \"kolaylaştırılmış\" ya da \"uygun bulunmuş\" anlamına gelen eser.", "Hadislerin sahabe isimlerine göre tasnif edildiği eser.", "Fıkıh bablarına göre düzenlenmiş, çoğunlukla sadece merfû rivayet içeren eser."], "a": 1, "n": ["Bu, “Müstahrec” terimidir.", "Doğru.", "Bu, “Müsned (eser)” terimidir.", "Bu, “Sünen” terimidir."], "p": "38"}, {"q": "Şu tanım hangi terime aittir?\n“Müellifin şeyhlerinin isimlerine, beldelere veya sahabe isimlerine göre tertip edilmiş hadis kitabı.”", "o": ["Sünen", "Mu'cem", "Câmi'", "Musannef"], "a": 1, "n": ["Sünen: Fıkıh bablarına göre düzenlenmiş, çoğunlukla sadece merfû rivayet içeren eser.", "Doğru.", "Câmi': Akaid, ibadât, muamelât, siyer, menâkıb, rikâk, fiten ve kıyamet ahvâli gibi sekiz ana konuyu içeren eser.", "Musannef: Fıkıh konularına göre düzenlenmiş; merfû, mevkuf, maktû ve az da olsa tebe-i tâbiîn fetvalarını içeren eser."], "p": "38"}, {"q": "“Mu'cem” nedir?", "o": ["Bir ravinin hadislerinin toplandığı veya tek bir konuya göre yazılmış eser.", "Akaid, ibadât, muamelât, siyer, menâkıb, rikâk, fiten ve kıyamet ahvâli gibi sekiz ana konuyu içeren eser.", "Hadislerin sahabe isimlerine göre tasnif edildiği eser.", "Müellifin şeyhlerinin isimlerine, beldelere veya sahabe isimlerine göre tertip edilmiş hadis kitabı."], "a": 3, "n": ["Bu, “Cüz” terimidir.", "Bu, “Câmi'” terimidir.", "Bu, “Müsned (eser)” terimidir.", "Doğru."], "p": "38"}, {"q": "Şu tanım hangi terime aittir?\n“İlletli hadislerin yer aldığı ve illetlerinin beyan edildiği eser (İbn Ebî Hâtim, Dârekutnî).”", "o": ["Etrâf kitabı", "Müstedrek", "İlel kitabı", "Câmi'"], "a": 2, "n": ["Etrâf kitabı: Çoğunlukla sahabe müsnedlerine göre alfabetik düzenlenip hadisin sadece baş kısmının zikredildiği eser.", "Müstedrek: Bir muhaddisin şartlarına uyduğu hâlde eserine almadığı hadislerin toplandığı kitap.", "Doğru.", "Câmi': Akaid, ibadât, muamelât, siyer, menâkıb, rikâk, fiten ve kıyamet ahvâli gibi sekiz ana konuyu içeren eser."], "p": "38"}, {"q": "“İlel kitabı” nedir?", "o": ["Müellifin şeyhlerinin isimlerine, beldelere veya sahabe isimlerine göre tertip edilmiş hadis kitabı.", "İlletli hadislerin yer aldığı ve illetlerinin beyan edildiği eser (İbn Ebî Hâtim, Dârekutnî).", "Fıkıh bablarına göre düzenlenmiş, çoğunlukla sadece merfû rivayet içeren eser.", " "Terimler", "title": "Terimler: Rivayet Yolları ve Haber", "pages": "tüm bölümler", "qs": [{"q": "Şu tanım hangi terime aittir?\n“Hadisi Hz. Peygamber'den duyulan lafızlarla rivayet etmek.”", "o": ["Lafzen rivayet", "Mürâsele", "Semâ", "İcazet"], "a": 0, "n": ["Doğru.", "Mürâsele: Şeyhin talebesine yazılı metin vermeden elçi göndermesi; elçinin rivayeti ezberinde götürmesi.", "Semâ: Şeyhin ezberinden veya kitaptan okuması, talebenin dinlemesi; cumhura göre en üstün tahammül yolu.", "İcazet: Sözlü veya yazılı olarak hadis rivayetine izin vermek."], "p": "40"}, {"q": "“Lafzen rivayet” nedir?", "o": ["Ravinin yazdığı hadisleri şeyhinin asıl nüshası veya mukabele edilmiş bir nüshayla karşılaştırması.", "Sözlü veya yazılı olarak hadis rivayetine izin vermek.", "Hadisin bir kısmını bir şeyhten, diğer kısmını başka şeyhten alıp birleştirmek; ilk yapan Zührî.", "Hadisi Hz. Peygamber'den duyulan lafızlarla rivayet etmek."], "a": 3, "n": ["Bu, “Mukabele” terimidir.", "Bu, “İcazet” terimidir.", "Bu, “Telfik” terimidir.", "Doğru."], "p": "40"}, {"q": "Şu tanım hangi terime aittir?\n“Hz. Peygamber'den işitilen lafızlar yerine aynı anlama gelen farklı lafızlarla nakletmek.”", "o": ["Kitabet", "Mükâtebe", "Lafzen rivayet", "Manen rivayet"], "a": 3, "n": ["Kitabet: Şeyhin hadislerini yanındaki veya uzaktaki birine kendisinin yazması ya da yazdırması.", "Mükâtebe: Şeyhin \"Bu yazım sana ulaşınca bu isnadla benden rivayet et\" diye yazıp bir aracıyla göndermesi.", "Lafzen rivayet: Hadisi Hz. Peygamber'den duyulan lafızlarla rivayet etmek.", "Doğru."], "p": "40"}, {"q": "“Manen rivayet” nedir?", "o": ["Şeyhin rivayetlerini içeren kitabını talebesine vermesi; icazetli olursa caizdir.", "Hadisin bazı lafızlarını hazfetmek.", "Hz. Peygamber'den işitilen lafızlar yerine aynı anlama gelen farklı lafızlarla nakletmek.", "Hadisin bir kısmını bir şeyhten, diğer kısmını başka şeyhten alıp birleştirmek; ilk yapan Zührî."], "a": 2, "n": ["Bu, “Münâvele” terimidir.", "Bu, “İhtisar” terimidir.", " ": "49"}, {"q": "“Mütevâtir” nedir?", "o": ["Bir veya daha fazla tabakasında tek bir ravinin bulunduğu hadis.", "Aklın yalan üzerinde birleşmelerini mümkün görmediği bir topluluğun her nesilde kendileri gibi bir topluluktan alıp naklettiği, hisse dayanan rivayet.", "Sahabenin Hz. Peygamber'den rivayette tek kaldığı hadis (garîb-i mutlak).", "Lafızları farklı olup ortak bir manada birleşen rivayetler (Hz. İsa'nın nüzûlü)."], "a": 1, "n": ["Bu, “Garîb” terimidir.", "Doğru.", "Bu, “Ferd-i mutlak” terimidir.", "Bu, “Manevî mütevâtir” terimidir."], "p": "49"}, {"q": "Şu tanım hangi terime aittir?\n“Mütevâtir derecesine ulaşmayan haber; ilm-i nazarî ifade eder.”", "o": ["Mütevâtir", "Lafzî mütevâtir", "Garîb", "Âhâd"], "a": 3, "n": ["Mütevâtir: Aklın yalan üzerinde birleşmelerini mümkün görmediği bir topluluğun her nesilde kendileri gibi bir topluluktan alıp naklettiği, hisse dayanan rivayet.", "Lafzî mütevâtir: Hem lafızların hem mananın tevatür ettiği haber (\"Kim kasten benim adıma yalan…\").", "Garîb: Bir veya daha fazla tabakasında tek bir ravinin bulunduğu hadis.", "Doğru."], "p": "51"}, {"q": "“Âhâd” nedir?", "o": ["Hem lafızların hem mananın tevatür ettiği haber (\"Kim kasten benim adıma yalan…\").", "Sahabenin Hz. Peygamber'den rivayette tek kaldığı hadis (garîb-i mutlak).", "Sahabe veya tâbiîn tarafında birden çok ravi varken sonraki bir tabakada tek ravinin rivayet ettiği hadis.", "Mütevâtir derecesine ulaşmayan haber; ilm-i nazarî ifade eder."], "a": 3, "n": ["Bu, “Lafzî mütevâtir” terimidir.", "Bu, “Ferd-i mutlak” terimidir.", "Bu, “Ferd-i nisbî” terimidir.", "Doğru."], "p": "51"}, {"q": "Şu tanım hangi terime aittir?\n“Tevatür şartlarını taşımayan, her tabakada en az üç ravisi bulunan rivayet.”", "o": ["Tabaka tevatürü", "Âhâd", "Meşhur", "Mütevâtir"], "a": 2, "n": ["Tabaka tevatürü: Senede ihtiyaç olmadan nesilden nesile aktarılan haber (mushaflara yazılan Kur'ân).", "Âhâd: Mütevâtir derecesine ulaşmayan haber; ilm-i nazarî ifade eder.", "Doğru.", "Mütevâti  olup görüşmediği ya da görüşüp bu hadisi işitmediği birinden işitmiş gibi rivayet etmesi."], "p": "69"}, {"q": "“Muanan” nedir?", "o": ["Sahabinin, hadisi işittiği başka bir sahabiyi düşürerek Hz. Peygamber'e isnad ettiği hadis.", "Ravinin hadisi \"fülân an fülân\" şeklinde rivayet etmesi.", "Senedi tâbiîye kadar muttasıl olup tâbiînin doğrudan almadan Hz. Peygamber'e izafe ettiği hadis.", "Ravinin muasırı olup görüşmediği ya da görüşüp bu hadisi işitmediği birinden işitmiş gibi rivayet etmesi."], "a": 1, "n": ["Bu, “Sahabe mürseli” terimidir.", "Doğru.", "Bu, “Mürsel” terimidir.", "Bu, “Mürsel-i hafî” terimidir."], "p": "69"}, {"q": "Şu tanım hangi terime aittir?\n“Ravinin hadisi \"haddesenâ fülân, enne fülânen kâle\" şeklinde rivayet etmesi.”", "o": ["Müennen", "Mu'dal", "Sahabe mürseli", "Mürsel-i hafî"], "a": 0, "n": ["Doğru.", "Mu'dal: Senetten iki veya daha fazla ravinin peş peşe düştüğü hadis.", "Sahabe mürseli: Sahabinin, hadisi işittiği başka bir sahabiyi düşürerek Hz. Peygamber'e isnad ettiği hadis.", "Mürsel-i hafî: Ravinin muasırı olup görüşmediği ya da görüşüp bu hadisi işitmediği birinden işitmiş gibi rivayet etmesi."], "p": "70"}, {"q": "“Müennen” nedir?", "o": ["İsnaddaki bir kusurun saklanıp senedin zahirinin güzelleştirildiği hadis.", "Sahabeden önce bir yerde tek ravinin (ya da peş peşe olmaksızın birden fazla ravinin) düştüğü hadis.", "Düşen raviyi ancak hadiste derinleşmiş âlimlerin tespit edebildiği düşme.", "Ravinin hadisi \"haddesenâ fülân, enne fülânen kâle\" şeklinde rivayet etmesi."], "a": 3, "n": ["Bu, “Müdelles” terimidir.", "Bu, “Munkatı'” terimidir.", "Bu, “Sakt-ı hafî” terimidir.", "Doğru."], "p": "70"}, {"q": "Şu tanım hangi terime aittir?\n“Ravinin Hz. Peygamber'e yalan söz isnad ettiği rivayet.”", "o": ["Maklûb", "Mevzû", "Mâruf", "Müdrec"], "a": 1, "n": ["Maklûb: Senedinde veya metninde takdim-tehir yoluyla bir lafzın başkasıyla yer değiştirdiği hadis.", "Doğru.", "Mâruf: Zayıf ravinin muhalefet ettiği, sika ravinin rivayet ettiği makbul hadis (münkerin mukabili).", "Müdrec: İsnadın siyakının değiştirildiği veya metnine ondan olmayan bir şeyin ayırıcı işaret konmadan eklendiği hadis."], "p": "71"}, {"q": "“Mevzû” nedir?", "o": ["İbn Hacer'e göre zayıf ravinin sika raviye muhalefet ederek rivayet ettiği hadis.", "Zayıf ravinin muhalefet ettiği, sika ravinin rivayet ettiği makbul hadis (münkerin mukabili).", "Ravinin Hz. Peygamber'e yalan söz isnad ettiği rivayet.", "Ravinin hatalı ezberlediği hadisleri doğru zannederek rivayet etmesi."], "a": 2, "n": ["Bu, “Münker” terimidir.", "Bu, “Mâruf” terimidir.", "Doğru.", "Bu, “Vehem” terimidir."], "p": "71"}, {"q": "Şu tanım hangi terime aittir?\n“Yalancılıkla itham edilen ravinin rivayet ettiği hadis.”", "o": ["el-Mezîd fî muttasılı'l-esânîd", "Sû-i hıfz", "Muallel", "Metrûk"], "a": 3, "n": ["el-Mezîd fî muttasılı'l-esânîd: Muttasıl görünmesine rağmen senedine ravi ziyade edilmiş hadis.", "Sû-i hıfz: Ravinin hataları doğrularından az olmakla birlikte önemsiz sayılmayacak seviyede olması.", "Muallel: Zahiren sağlam görünüp sika ravinin vehminden doğan gizli, sıhhati zedeleyici bir illetin tespit edildiği hadis.", "Doğru."], "p": "72"}, {"q": "“Metrûk” nedir?", "o": ["İsnadın siyakının değiştirildiği veya metnine ondan olmayan bir şeyin ayırıcı işaret konmadan eklendiği hadis.", "Şaz rivayetin mukabili olan, daha sika ravilerin makbul rivayeti.", "Yalancılıkla itham edilen ravinin rivayet ettiği hadis.", "Kendisinden iki veya daha fazla ravi rivayet ettiği hâlde sika olduğu belirtilmemiş kimse."], "a": 2, "n": ["Bu, “Müdrec” terimidir.", "Bu, “Mahfuz” terimidir.", "Doğru.", "Bu, “Meçhulü'l-hâl (mestûr)” terimidir."], "p": "72"}, {"q": "Şu tanım hangi terime aittir?\n“İbn Hacer'e göre zayıf ravinin sika raviye muhalefet ederek rivayet ettiği hadis.”", "o": ["Meçhulü'l-ayn", "Münker", "Mahfuz", "Vehem"], "a": 1, "n": ["Meçhulü'l-ayn: Senedde adı geçen ama kendisinden sadece tek ravinin rivayet ettiği kimse.", "Doğru.", "Mahfuz: Şaz rivayetin mukabili olan, daha sika ravilerin makbul rivayeti.", "Vehem: Ravinin hatalı ezberlediği hadisleri doğru zannederek rivayet etmesi."], "p": "74"}, {"q": "“Münker” nedir?", "o": ["Kendisinden iki veya daha fazla ravi rivayet ettiği hâlde sika olduğu belirtilmemiş kimse.", "İbn Hacer'e göre zayıf ravinin sika raviye muhalefet ederek rivayet ettiği hadis.", "Şaz rivayetin mukabili olan, daha sika ravilerin makbul rivayeti.", "Ravinin hata oranının doğrularına eşit veya onlardan fazla olması."], "a": 1, "n": ["Bu, “Meçhulü'l-hâl (mestûr)” terimidir.", "Doğru.", "Bu, “Mahfuz” terimidir.", "Bu, “Fuhş-ı galat” terimidir."], "p": "74"}, {"q": "Şu tanım hangi terime aittir?\n“Zayıf ravinin muhalefet ettiği, sika ravinin rivayet ettiği makbul hadis (münkerin mukabili).”", "o": ["Mâruf", "Muallel", "Musahhaf", "Mahfuz"], "a": 0, "n": ["Doğru.", "Muallel: Zahiren sağlam görünüp sika ravinin vehminden doğan gizli, sıhhati zedeleyici bir illetin tespit edildiği hadis.", "Musahhaf: Hadisteki bir kelimenin sika ravilerin rivayetinden farklı bir lafza veya manaya çevrilerek rivayet edilmesi.", "Mahfuz: Şaz rivayetin mukabili olan, daha sika ravilerin makbul rivayeti."], "p": "75"}, {"q": "“Mâruf” nedir?", "o": ["Kendisinden iki veya daha fazla ravi rivayet ettiği hâlde sika olduğu belirtilmemiş kimse.", "Zayıf ravinin muhalefet ettiği, sika ravinin rivayet ettiği makbul hadis (münkerin mukabili).", "Zahiren sağlam görünüp sika ravinin vehminden doğan gizli, sıhhati zedeleyici bir illetin tespit edildiği hadis.", "Ravinin hata oranının doğrularına eşit veya onlardan fazla olması."], "a": 1, "n": ["Bu, “Meçhulü'l-hâl (mestûr)” terimidir.", "Doğru.", "Bu, “Muallel” terimidir.", "Bu, “Fuhş-ı galat” terimidir."], "p": "75"}, {"q": "Şu tanım hangi terime aittir?\n“Zahiren sağlam görünüp sika ravinin vehminden doğan gizli, sıhhati zedeleyici bir illetin tespit edildiği hadis.”", "o": ["Maklûb", "Muallel", "Fuhş-ı galat", "Musahhaf"], "a": 1, "n": ["Maklûb: Senedinde veya metninde takdim-tehir yoluyla bir lafzın başkasıyla yer değiştirdiği hadis.", "Doğru.", "Fuhş-ı galat: Ravinin hata oranının doğrularına eşit veya onlardan fazla olması.", "Musahhaf: Hadisteki bir kelimenin sika ravilerin rivayetinden farklı bir lafza veya manaya çevrilerek rivayet edilmesi."], "p": "75"}, {"q": "“Muallel” nedir?", "o": ["İbn Hacer'e göre sika ravinin kendinden daha sika raviye muhalefet ederek rivayet ettiği hadis.", "Zahiren sağlam görünüp sika ravinin vehminden doğan gizli, sıhhati zedeleyici bir illetin tespit edildiği hadis.", "İsnadın siyakının değiştirildiği veya metnine ondan olmayan bir şeyin ayırıcı işaret konmadan eklendiği hadis.", "Hafıza zayıflığı sonradan (yaşlılık, görme kaybı, kitapların yanması gibi sebeplerle) ortaya çıkan ravi."], "a": 1, "n": ["Bu, “Şaz” terimidir.", "Doğru.", "Bu, “Müdrec” terimidir.", "Bu, “Muhtelit” terimidir."], "p": "75"}, {"q": "Şu tanım hangi terime aittir?\n“İsnadın siyakının değiştirildiği veya metnine ondan olmayan bir şeyin ayırıcı işaret konmadan eklendiği hadis.”", "o": ["Mevzû", "el-Mezîd fî muttasılı'l-esânîd", "Fuhş-ı galat", "Müdrec"], "a": 3, "n": ["Mevzû: Ravinin Hz. Peygamber'e yalan söz isnad ettiği rivayet.", "el-Mezîd fî muttasılı'l-esânîd: Muttasıl görünmesine rağmen senedine ravi ziyade edilmiş hadis.", "Fuhş-ı galat: Ravinin hata oranının doğrularına eşit veya onlardan fazla olması.", "Doğru."], "p": "76"}, {"q": "“Müdrec” nedir?", "o": ["Hafıza zayıflığı sonradan (yaşlılık, görme kaybı, kitapların yanması gibi sebeplerle) ortaya çıkan ravi.", "İsnadın siyakının değiştirildiği veya metnine ondan olmayan bir şeyin ayırıcı işaret konmadan eklendiği hadis.", "Senedde adı geçen ama kendisinden sadece tek ravinin rivayet ettiği kimse.", "Ravinin hataları doğrularından az olmakla birlikte önemsiz sayılmayacak seviyede olması."], "a": 1, "n": ["Bu, “Muhtelit” terimidir.", "Doğru.", "Bu, “Meçhulü'l-ayn” terimidir.", "Bu, “Sû-i hıfz” terimidir."], "p": "76"}, {"q": "Şu tanım hangi terime aittir?\n“Senedinde veya metninde takdim-tehir yoluyla bir lafzın başkasıyla yer değiştirdiği hadis.”", "o": ["Musahhaf", "Muzdarib", "Muhtelit", "Maklûb"], "a": 3, "n": ["Musahhaf: Hadisteki bir kelimenin sika ravilerin rivayetinden farklı bir lafza veya manaya çevrilerek rivayet edilmesi.", "Muzdarib: Kuvvet dereceleri eşit, cem ve tercih yapılamayacak şekilde birbirinden farklı rivayet edilen hadis.", "Muhtelit: Hafıza zayıflığı sonradan (yaşlılık, görme kaybı, kitapların yanması gibi sebeplerle) ortaya çıkan ravi.", "Doğru."], "p": "77"}, {"q": "“Maklûb” nedir?", "o": ["Hadisteki bir kelimenin sika ravilerin rivayetinden farklı bir lafza veya manaya çevrilerek rivayet edilmesi.", "Kuvvet dereceleri eşit, cem ve tercih yapılamayacak şekilde birbirinden farklı rivayet edilen hadis.", "Senedinde veya metninde takdim-tehir yoluyla bir lafzın başkasıyla yer değiştirdiği hadis.", "İbn Hacer'e göre zayıf ravinin sika raviye muhalefet ederek rivayet ettiği hadis."], "a": 2, "n": ["Bu, “Musahhaf” terimidir.", "Bu, “Muzdarib” terimidir.", "Doğru.", "Bu, “Münker” terimidir."], "p": "77"}, {"q": "Şu tanım hangi terime aittir?\n“Muttasıl görünmesine rağmen senedine ravi ziyade edilmiş hadis.”", "o": ["Vehem", "Mâruf", "Muallel", "el-Mezîd fî muttasılı'l-esânîd"], "a": 3, "n": ["Vehem: Ravinin hatalı ezberlediği hadisleri doğru zannederek rivayet etmesi.", "Mâruf: Zayıf ravinin muhalefet ettiği, sika ravinin rivayet ettiği makbul hadis (münkerin mukabili).", "Muallel: Zahiren sağlam görünüp sika ravinin vehminden doğan gizli, sıhhati zedeleyici bir illetin tespit edildiği hadis.", "Doğru."], "p": "78"}, {"q": "“el-Mezîd fî muttasılı'l-esânîd” nedir?", "o": ["Ravinin hataları doğrularından az olmakla birlikte önemsiz sayılmayacak seviyede olması.", "Hafıza zayıflığı sonradan (yaşlılık, görme kaybı, kitapların yanması gibi sebeplerle) ortaya çıkan ravi.", "Muttasıl görünmesine rağmen senedine ravi ziyade edilmiş hadis.", "Kuvvet dereceleri eşit, cem ve tercih yapılamayacak şekilde birbirinden farklı rivayet edilen hadis."], "a": 2, "n": ["Bu, “Sû-i hıfz” terimidir.", "Bu, “Muhtelit” terimidir.", "Doğru.", "Bu, “Muzdarib” terimidir."], "p": "78"}, {"q": "Şu tanım hangi terime aittir?\n“Kuvvet dereceleri eşit, cem ve tercih yapılamayacak şekilde birbirinden farklı rivayet edilen hadis.”", "o": ["Maklûb", "Muzdarib", "Metrûk", "Vehem"], "a": 1, "n": ["Maklûb: Senedinde veya metninde takdim-tehir yoluyla bir lafzın başkasıyla yer değiştirdiği hadis.", "Doğru.", "Metrûk: Yalancılıkla itham edilen ravinin rivayet ettiği hadis.", "Vehem: Ravinin hatalı ezberlediği hadisleri doğru zannederek rivayet etmesi."], "p": "78"}, {"q": "“Muzdarib” nedir?", "o": ["İbn Hacer'e göre sika ravinin kendinden daha sika raviye muhalefet ederek rivayet ettiği hadis.", "Ravinin hata oranının doğrularına eşit veya onlardan fazla olması.", "Kendisinden iki veya daha fazla ravi rivayet ettiği hâlde sika olduğu belirtilmemiş kimse.", "Kuvvet dereceleri eşit, cem ve tercih yapılamayacak şekilde birbirinden farklı rivayet edilen hadis."], "a": 3, "n": ["Bu, “Şaz” terimidir.", "Bu, “Fuhş-ı galat” terimidir.", "Bu, “Meçhulü'l-hâl (mestûr)” terimidir.", "Doğru."], "p": "78"}, {"q": "Şu tanım hangi terime aittir?\n“Hadisteki bir kelimenin sika ravilerin rivayetinden farklı bir lafza veya manaya çevrilerek rivayet edilmesi.”", "o": ["Musahhaf", "Mevzû", "Vehem", "Sû-i hıfz"], "a": 0, "n": ["Doğru.", "Mevzû: Ravinin Hz. Peygamber'e yalan söz isnad ettiği rivayet.", "Vehem: Ravinin hatalı ezberlediği hadisleri doğru zannederek rivayet etmesi.", "Sû-i hıfz: Ravinin hataları doğrularından az olmakla birlikte önemsiz sayılmayacak seviyede olması."], "p": "79"}, {"q": "“Musahhaf” nedir?", "o": ["Zayıf ravinin muhalefet ettiği, sika ravinin rivayet ettiği makbul hadis (münkerin mukabili).", "Hadisteki bir kelimenin sika ravilerin rivayetinden farklı bir lafza veya manaya çevrilerek rivayet edilmesi.", "İbn Hacer'e göre zayıf ravinin sika raviye muhalefet ederek rivayet ettiği hadis.", "Ravinin hata oranının doğrularına eşit veya onlardan fazla olması."], "a": 1, "n": ["Bu, “Mâruf” terimidir.", "Doğru.", "Bu, “Münker” terimidir.", "Bu, “Fuhş-ı galat” terimidir."], "p": "79"}, {"q": "Şu tanım hangi terime aittir?\n“İbn Hacer'e göre sika ravinin kendinden daha sika raviye muhalefet ederek rivayet ettiği hadis.”", "o": ["Muzdarib", "Musahhaf", "Şaz", "el-Mezîd fî muttasılı'l-esânîd"], "a": 2, "n": ["Muzdarib: Kuvvet dereceleri eşit, cem ve tercih yapılamayacak şekilde birbirinden farklı rivayet edilen hadis.", "Musahhaf: Hadisteki bir kelimenin sika ravilerin rivayetinden farklı bir lafza veya manaya çevrilerek rivayet edilmesi.", "Doğru.", "el-Mezîd fî muttasılı'l-esânîd: Muttasıl görünmesine rağmen senedine ravi ziyade edilmiş hadis."], "p": "80"}, {"q": "“Şaz” nedir?", "o": ["Muttasıl görünmesine rağmen senedine ravi ziyade edilmiş hadis.", "Ravinin hata oranının doğrularına eşit veya onlardan fazla olması.", "Zahiren sağlam görünüp sika ravinin vehminden doğan gizli, sıhhati zedeleyici bir illetin tespit edildiği hadis.", "İbn Hacer'e göre sika ravinin kendinden daha sika raviye muhalefet ederek rivayet ettiği hadis."], "a": 3, "n": ["Bu, “el-Mezîd fî muttasılı'l-esânîd” terimidir.", "Bu, “Fuhş-ı galat” terimidir.", "Bu, “Muallel” terimidir.", "Doğru."], "p": "80"}, {"q": "Şu tanım hangi terime aittir?\n“Şaz rivayetin mukabili olan, daha sika ravilerin makbul rivayeti.”", "o": ["Mahfuz", "Fuhş-ı galat", "Sû-i hıfz", "Meçhulü'l-hâl (mestûr)"], "a": 0, "n": ["Doğru.", "Fuhş-ı galat: Ravinin hata oranının doğrularına eşit veya onlardan fazla olması.", "Sû-i hıfz: Ravinin hataları doğrularından az olmakla birlikte önemsiz sayılmayacak seviyede olması.", "Meçhulü'l-hâl (mestûr): Kendisinden iki veya daha fazla ravi rivayet ettiği hâlde sika olduğu belirtilmemiş kimse."], "p": "81"}, {"q": "“Mahfuz” nedir?", "o": ["Yalancılıkla itham edilen ravinin rivayet ettiği hadis.", "Ravinin hataları doğrularından az olmakla birlikte önemsiz sayılmayacak seviyede olması.", "Kendisinden iki veya daha fazla ravi rivayet ettiği hâlde sika olduğu belirtilmemiş kimse.", "Şaz rivayetin mukabili olan, daha sika ravilerin makbul rivayeti."], "a": 3, "n": ["Bu, “Metrûk” terimidir.", "Bu, “Sû-i hıfz” terimidir.", "Bu, “Meçhulü'l-hâl (mestûr)” terimidir.", "Doğru."], "p": "81"}, {"q": "Şu tanım hangi terime aittir?\n“Hafıza zayıflığı sonradan (yaşlılık, görme kaybı, kitapların yanması gibi sebeplerle) ortaya çıkan ravi.”", "o": ["Sû-i hıfz", "Maklûb", "Meçhulü'l-hâl (mestûr)", "Muhtelit"], "a": 3, "n": ["Sû-i hıfz: Ravinin hataları doğrularından az olmakla birlikte önemsiz sayılmayacak seviyede olması.", "Maklûb: Senedinde veya metninde takdim-tehir yoluyla bir lafzın başkasıyla yer değiştirdiği hadis.", "Meçhulü'l-hâl (mestûr): Kendisinden iki veya daha fazla ravi rivayet ettiği hâlde sika olduğu belirtilmemiş kimse.", "Doğru."], "p": "81"}, {"q": "“Muhtelit” nedir?", "o": ["Hafıza zayıflığı sonradan (yaşlılık, görme kaybı, kitapların yanması gibi sebeplerle) ortaya çıkan ravi.", "Hadisteki bir kelimenin sika ravilerin rivayetinden farklı bir lafza veya manaya çevrilerek rivayet edilmesi.", "Ravinin hataları doğrularından az olmakla birlikte önemsiz sayılmayacak seviyede olması.", "Şaz rivayetin mukabili olan, daha sika ravilerin makbul rivayeti."], "a": 0, "n": ["Doğru.", "Bu, “Musahhaf” terimidir.", "Bu, “Sû-i hıfz” terimidir.", "Bu, “Mahfuz” terimidir."], "p": "81"}, {"q": "Şu tanım hangi terime aittir?\n“Ravinin hata oranının doğrularına eşit veya onlardan fazla olması.”", "o": ["Münker", "Mâruf", "Musahhaf", "Fuhş-ı galat"], "a": 3, "n": ["Münker: İbn Hacer'e göre zayıf ravinin sika raviye muhalefet ederek rivayet ettiği hadis.", "Mâruf: Zayıf ravinin muhalefet ettiği, sika ravinin rivayet ettiği makbul hadis (münkerin mukabili).", "Musahhaf: Hadisteki bir kelimenin sika ravilerin rivayetinden farklı bir lafza veya manaya çevrilerek rivayet edilmesi.", "Doğru."], "p": "70"}, {"q": "“Fuhş-ı galat” nedir?", "o": ["Kendisinden iki veya daha fazla ravi rivayet et ederek rivayet ettiği hadis."], "p": "71"}, {"q": "“Vehem” nedir?", "o": ["Zayıf ravinin muhalefet ettiği, sika ravinin rivayet ettiği makbul hadis (münkerin mukabili).", "Kuvvet dereceleri eşit, cem ve tercih yapılamayacak şekilde birbirinden farklı rivayet edilen hadis.", "Ravinin hatalı ezberlediği hadisleri doğru zannederek rivayet etmesi.", "İbn Hacer'e göre zayıf ravinin sika raviye muhalefet ederek rivayet ettiği hadis."], "a": 2, "n": ["Bu, “Mâruf” terimidir.", "Bu, “Muzdarib” terimidir.", "Doğru.", "Bu, “Münker” terimidir."], "p": "71"}, {"q": "Şu tanım hangi terime aittir?\n“Senedde adı geçen ama kendisinden sadece tek ravinin rivayet ettiği kimse.”", "o": ["Mâruf", "Mevzû", "Meçhulü'l-ayn", "Musahhaf"], "a": 2, "n": ["Mâruf: Zayıf ravinin muhalefet ettiği, sika ravinin rivayet ettiği makbul hadis (münkerin mukabili).", "Mevzû: Ravinin Hz. Peygamber'e yalan söz isnad ettiği rivayet.", "Doğru.", "Musahhaf: Hadisteki bir kelimenin sika ravilerin rivayetinden farklı bir lafza veya manaya çevrilerek rivayet edilmesi."], "p": "73"}, {"q": "“Meçhulü'l-ayn” nedir?", "o": ["Senedde adı geçen ama kendisinden sadece tek ravinin rivayet ettiği kimse.", "İsnadın siyakının değiştirildiği veya metnine ondan olmayan bir şeyin ayırıcı işaret konmadan eklendiği hadis.", "İbn Hacer'e göre zayıf ravinin sika raviye muhalefet ederek rivayet ettiği hadis.", "Muttasıl görünmesine rağmen senedine ravi ziyade edilmiş hadis."], "a": 0, "n": ["Doğru.", "Bu, “Müdrec” terimidir.", "Bu, “Münker” terimidir.", "Bu, “el-Mezîd fî muttasılı'l-esânîd” terimidir."], "p": "73"}, {"q": "Şu tanım hangi terime aittir?\n“Kendisinden iki veya daha fazla ravi rivayet ettiği hâlde sika olduğu belirtilmemiş kimse.”", "o": ["Mahfuz", "Vehem", "Meçhulü'l-hâl (mestûr)", "Muallel"], "a": 2, "n": ["Mahfuz: Şaz rivayetin mukabili olan, daha sika ravilerin makbul rivayeti.", "Vehem: Ravinin hatalı ezberlediği hadisleri doğru zannederek rivayet etmesi.", "Doğru.", "Muallel: Zahiren sağlam görünüp sika ravinin vehminden doğan gizli, sıhhati zedeleyici bir illetin tespit edildiği hadis."], "p": "73"}, {"q": "“Meçhulü'l-hâl (mestûr)” nedir?", "o": ["Kendisinden iki veya daha fazla ravi rivayet ettiği hâlde sika olduğu belirtilmemiş kimse.", "Ravinin hatalı ezberlediği hadisleri doğru zannederek rivayet etmesi.", "Ravinin Hz. Peygamber'e yalan söz isnad ettiği rivayet.", "Ravinin hataları doğrularından az olmakla birlikte önemsiz sayılmayacak seviyede olması."], "a": 0, "n": ["Doğru.", "Bu, “Vehem” terimidir.", "Bu, “Mevzû” terimidir.", "Bu, “Sû-i hıfz” terimidir."], "p": "73"}]}, {"id": "g4", "scope": "final", "bolum": "Terimler", "title": "Terimler: Nispet, İsnad ve Ravi", "pages": "tüm bölümler", "qs": [{"q": "Şu tanım hangi terime aittir?\n“Manası Allah'a, lafzı Hz. Peygamber'e ait olup Hz. Peygamber'in Allah'a isnad ederek naklettiği hadis.”", "o": ["Edâ", "Maktû'", "Kudsî hadis", "Müselsel"], "a": 2, "n": ["Edâ: Hadisi talebeye rivayet etmek.", "Maktû': Tâbiîye ve sonrakilere izafe edilen söz ve fiil.", "Doğru.", "Müselsel: Senetteki ravilerin bir halde, sıfatta veya rivayetin zaman, mekân ya da siygasında ortak paydaya sahip olması."], "p": "81"}, {"q": "“Kudsî hadis” nedir?", "o": ["Hadis metninde az kullanıldığı için anlamı kapalı, anlaşılması zor lafızlar.", "Bir musannıfın şeyhinin şeyhine onun senedinden daha kısa bir senetle ulaşmak.", "Bir senetteki ravi sayısının musannıfın talebesinin senedindeki ravi sayısına eşit olması.", "Manası Allah'a, lafzı Hz. Peygamber'e ait olup Hz. Peygamber'in Allah'a isnad ederek naklettiği hadis."], "a": 3, "n": ["Bu, “Garîbü'l-hadîs” terimidir.", "Bu, “Bedel” terimidir.", "Bu, “Musâfaha” terimidir.", "Doğru."], "p": "81"}, {"q": "Şu tanım hangi terime aittir?\n“Söz, fiil, takrir veya sıfat olarak Hz. Peygamber'e izafe edilen rivayet; senedin muttasıl olması şart değildir.”", "o": ["Musâfaha", "Tahammül", "Nâzil isnad", "Merfû"], "a": 3, "n": ["Musâfaha: Bir senetteki ravi sayısının musannıfın talebesinin senedindeki ravi sayısına eşit olması.", "Tahammül: Hadisi şeyhten almak.", "Nâzil isnad: Başka bir senede göre ravi sayısı fazla olan senet.", "Doğru."], "p": "82"}, {"q": "“Merfû” nedir?", "o": ["Manası Allah'a, lafzı Hz. Peygamber'e ait olup Hz. Peygamber'in Allah'a isnad ederek naklettiği hadis.", "Lafzen mevkuf olup sadece vahiyle bilinebilecek bir konuda olduğu ya da Hz. Peygamber dönemine izafe edildiği için merfû sayılan rivayet.", "Başka bir senede göre ravi sayısı fazla olan senet.", "Söz, fiil, takrir veya sıfat olarak Hz. Peygamber'e izafe edilen rivayet; senedin muttasıl olması şart değildir."], "a": 3, "n": ["Bu, “Kudsî hadis” terimidir.", "Bu, “Hükmen merfû” terimidir.", "Bu, “Nâzil isnad” terimidir.", "Doğru."], "p": "82"}, {"q": "Şu tanım hangi terime aittir?\n“Söz, fiil veya takrir olarak sahabeye izafe edilen rivayet.”", "o": ["Mevkuf", "Garîbü'l-hadîs", "Âlî isnad", "Muvâfaka"], "a": 0, "n": ["Doğru.", "Garîbü'l-hadîs: Hadis metninde az kullanıldığı için anlamı kapalı, anlaşılması zor lafızlar.", "Âlî isnad: Başka bir senede göre ravi sayısı az olan senet.", "Muvâfaka: Bir musannıfın şeyhine onun senedinden daha kısa bir senetle ulaşmak."], "p": "82"}, {"q": "“Mevkuf” nedir?", "o": ["Söz, fiil, takrir veya sıfat olarak Hz. Peygamber'e izafe edilen rivayet; senedin muttasıl olması şart değildir.", "Söz, fiil veya takrir olarak sahabeye izafe edilen rivayet.", "Tâbiîye ve sonrakilere izafe edilen söz ve fiil.", "Hadis metninde az kullanıldığı için anlamı kapalı, anlaşılması zor lafızlar."], "a": 1, "n": ["Bu, “Merfû” terimidir.", "Doğru.", "Bu, “Maktû'” terimidir.", "Bu, “Garîbü'l-hadîs” terimidir."], "p": "82"}, {"q": "Şu tanım hangi terime aittir?\n“Tâbiîye ve sonrakilere izafe edilen söz ve fiil.”", "o": ["Maktû'", "Mevkuf", "Muttasıl", "Âlî isnad"], "a": 0, "n": ["Doğru.", "Mevkuf: Söz, fiil veya takrir olarak sahabeye izafe edilen rivayet.", "Muttasıl: Senedinde ravi düşmeyen rivayet.", "Âlî isnad: Başka bir senede göre ravi sayısı az olan senet."], "p": "83"}, {"
