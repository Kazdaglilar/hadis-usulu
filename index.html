<style>
/* Layout: üstte puan şeridi, altında ünite kartları; çalışma ekranı tek soru + şık notları */
:root{
  --paper:#f3f5f1; --sheet:#ffffff; --ink:#1c2420; --muted:#5b6661; --line:#d8ddd5;
  --accent:#1e5d58; --accent-soft:#e1eeeb; --gold:#b7791f; --gold-soft:#fbf0dc;
  --ok:#2c7a4b; --ok-soft:#e0f0e6; --bad:#b3362b; --bad-soft:#f8e3e0;
  --f-display:"Literata", Georgia, "Times New Roman", serif;
  --f-ui:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#121816; --sheet:#1a211f; --ink:#e6ece9; --muted:#9aa7a1; --line:#2c3633;
  --accent:#6cc1b7; --accent-soft:#1d3431; --gold:#e8b45a; --gold-soft:#3a2f1c;
  --ok:#7dd29e; --ok-soft:#1c3326; --bad:#ff8f84; --bad-soft:#3a2220; color-scheme:dark; } }
:root[data-theme="dark"]{
  --paper:#121816; --sheet:#1a211f; --ink:#e6ece9; --muted:#9aa7a1; --line:#2c3633;
  --accent:#6cc1b7; --accent-soft:#1d3431; --gold:#e8b45a; --gold-soft:#3a2f1c;
  --ok:#7dd29e; --ok-soft:#1c3326; --bad:#ff8f84; --bad-soft:#3a2220; color-scheme:dark; }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 72px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-direction:column;gap:4px}
.top .eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.top h1{font-family:var(--f-display);font-size:28px;line-height:1.15;margin:0;text-wrap:balance}
.top .ar{font-family:var(--f-display);color:var(--accent);font-size:18px}

.stats{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:10px}
.stat{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stat .k{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.stat .v{font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums}
.lvlbar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.lvlbar i{display:block;height:100%;background:var(--gold);border-radius:99px}
@media (max-width:480px){.stats{grid-template-columns:1fr 1fr}.stats .stat:first-child{grid-column:1/-1}}

.seg{display:inline-flex;background:var(--sheet);border:1px solid var(--line);border-radius:99px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 16px;border-radius:99px;cursor:pointer;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--sheet)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--sheet);padding:9px 15px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn[disabled]{opacity:.45;cursor:default}

.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.unit{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;min-width:0}
.unit:hover{border-color:var(--accent)}
.unit .b{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.unit .t{font-family:var(--f-display);font-weight:600;font-size:16px;line-height:1.3}
.unit .meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.stars{font-size:15px;letter-spacing:2px;color:var(--line)}
.stars b{color:var(--gold);font-weight:400}
.pbar{height:5px;border-radius:99px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent)}
.unit.locked{cursor:default;border-style:dashed;background:transparent}
.unit.locked:hover{border-color:var(--line)}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--gold-soft);color:var(--gold);font-weight:600;letter-spacing:.03em}

/* oyun ekranı */
.playhead{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.playhead .ut{font-size:13px;color:var(--muted)}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--ok)} .dots i.bad{background:var(--bad)} .dots i.cur{background:var(--accent)}
.combo{font-family:var(--f-mono);font-size:14px;color:var(--gold);font-weight:500}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px}
.q{white-space:pre-line;font-family:var(--f-display);font-size:18px;font-weight:600;line-height:1.45;margin:0;text-wrap:pretty}
.again{font-size:12px;color:var(--gold);font-weight:600}
.opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.opt{width:100%;display:flex;gap:12px;text-align:left;align-items:flex-start;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{cursor:default}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:500 13px var(--f-mono);border:1.5px solid var(--line);background:var(--sheet)}
.opt .body{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.opt .txt{font-family:var(--f-display);font-size:15.5px;line-height:1.45}
.opt .note{font-size:13.5px;line-height:1.5;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.right .l{border-color:var(--ok);color:var(--ok)} .opt.right .note{color:var(--ink)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .l{border-color:var(--bad);color:var(--bad)}
.verdict{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.verdict .v{font-weight:600}
.verdict .v.ok{color:var(--ok)} .verdict .v.bad{color:var(--bad)}
.ref{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.xp-pop{font-family:var(--f-mono);color:var(--gold);font-weight:500}
@media (prefers-reduced-motion:no-preference){
  .xp-pop{animation:pop .6s ease-out}
  @keyframes pop{0%{transform:translateY(6px);opacity:.2}100%{transform:none;opacity:1}}
  .opt{transition:border-color .15s, background .15s}
}
.end{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.end .big{font-family:var(--f-display);font-size:38px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}
.end .stars{font-size:28px}
.muted{color:var(--muted);font-size:14px}
.foot{font-size:12.5px;color:var(--muted);text-align:center}
.empty{background:var(--sheet);border:1px dashed var(--line);border-radius:10px;padding:18px;color:var(--muted)}
.search{width:100%;font:15px var(--f-ui);padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--sheet);color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.asr{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.asr h3{font-family:var(--f-display);font-size:18px;margin:6px 0 0}
.asr h3 .muted{font-family:var(--f-ui);font-weight:400}
.ecard{display:flex;gap:12px;background:var(--sheet);border:1px solid var(--line);border-left:4px solid var(--hat);border-radius:8px;padding:10px 12px;min-width:0}
.eno{font-family:var(--f-mono);font-size:18px;color:var(--muted);flex:none;width:28px}
.ebody{display:flex;flex-direction:column;gap:3px;min-width:0}
.et{font-family:var(--f-display);font-weight:600;font-size:15.5px;line-height:1.35}
.em{font-size:13.5px}
.er{font-size:13px;color:var(--muted)} .er b{color:var(--ink);font-weight:600}
.eh{font-size:11.5px;color:var(--muted);letter-spacing:.03em}
.seg{flex-wrap:wrap}
</style>
</head>

    <span class="eyebrow">Hadis Tarihi ve Usulü</span>
    <h1>Hadis Usulü Atölyesi</h1>
    <span class="ar">أصول الحديث وتاريخه</span>
  </header>
  <main id="app"></main>
  <p class="foot">Her şıkkın altında o şıkkın neyi anlattığı yazar; yanlış şıklar da öğrenmek içindir. Sayfa numaraları kitaba göredir.<br>Kaynaklar: <i>Hadis Usul ve Tarihi</i> · <i>Hadis Usûlü Literatür Atlası</i>. İlerlemen bu cihazın tarayıcısında saklanır.</p>
</div>

<script>
/* Her soru: q=soru, o=şıklar, a=doğru şık, n=şık notları, p=sayfa */
window.UNITS = [
{id:"u1",scope:"vize",bolum:"I. Bölüm",title:"Hadis İlminin Doğuşu ve Usul Eserleri",pages:"14–31",qs:[
{q:"Hicr 15/9'da Kur'ân'ın korunacağının bildirilmesi neden sünnetin de korunması anlamına gelir?",o:["Sünnet de Kur'ân gibi lafzen vahyedilmiştir","Kur'ân'ın anlaşılması sünnetle gerçekleşir; sünnet âyetleri açıklar, umumu tahsis, mutlakı takyit eder","Sahabe hadisleri mushafın kenarına yazmıştır","Hadislerin tamamı mütevâtirdir"],a:1,n:["Yanlış. Kitapta böyle bir iddia yok; Kur'ân-kudsî hadis farkında da sünnetin lafzının Hz. Peygamber'e ait olduğu geçer.","Doğru. Sünnet Kur'ân'ın açıklayıcısıdır; bu yüzden Kur'ân'ın korunması sünnetin korunmasını da içerir.","Yanlış. Böyle bir uygulama anlatılmaz; aksine Kur'ân ile karışma endişesi yazım yasağının gerekçelerinden sayılır (s. 89).","Yanlış. Hadislerin çoğu âhâddır; mütevâtir azdır (IV. Bölüm)."],p:"14"},
{q:"Tâbiîler döneminin ortalarında rivayetlerde hataların ortaya çıkmasının en önde gelen sebeplerinden biri hangisidir?",o:["İslâm topraklarının genişlemesi ve farklı medeniyetlerle karşılaşılması","Hadis yazımının resmen yasaklanması","Sahabenin hadis rivayetinden kaçınması","Ömer b. Abdülazîz'in tedvin emri"],a:0,n:["Doğru. Kitap bunu açıkça \"en önde gelen sebeplerden\" sayar; bu doğal süreç ihtilafları getirmiştir.","Yanlış. Resmî bir yasak yoktur; yazım konusunda sahabe arasında ihtilaf vardır (s. 88).","Yanlış. Sahabe hadisleri rahatça aktarmış, yalan karışmasından aşırı endişe duymamıştır.","Yanlış. Tedvin hataların sebebi değil, hadisleri koruma tedbiridir."],p:"14–15"},
{q:"Aşağıdakilerden hangisi hadis usulünün doğuşuna etki eden sebeplerden değildir?",o:["Siyasi fırkaların görüşlerini güçlendirmek için rivayet uydurmaları","Sahabe ve büyük tâbiîlerin vefatıyla ravilere güvenin azalması","Arap yazısının yeterince gelişmemiş olması","Sahabenin hadislere yalan karışacağından aşırı endişe duyması"],a:3,n:["Sebeptir. Hicrî 1. asrın ortalarında fırkalar rivayet uydurunca âlimler isnad sistemini temel disiplin yaptı.","Sebeptir. Hicrî 2. asırda güven azalınca ravilerin takibi ve ıstılahlar gelişti.","Sebeptir. Yazılı metinlerdeki hataların etkenlerinden biridir; semâ-kıraat metotları bu yüzden gelişti.","Sebep değildir. Kitaba göre sahabe birinci asırda böyle bir aşırı endişe duymamıştır."],p:"14–16"},
{q:"Resmî ve sistemli tedvin faaliyeti ilk defa hangi halife zamanında başlamıştır?",o:["Hz. Ömer","Muâviye","Hârûn Reşîd","Ömer b. Abdülazîz"],a:3,n:["Yanlış. Hz. Ömer döneminde resmî tedvin yoktur.","Yanlış. Emevî halifesidir ama tedvin emri onun değildir.","Yanlış. Abbâsî dönemi; tedvin çok daha önce başlamıştır.","Doğru. Onun emriyle başlayan resmî tedvinde senet ve metin incelemesinin kuralları da konulmaya başlandı."],p:"16"},
{q:"el-Hatîb el-Bağdâdî SONRASI âlimlere göre hadis usulünün tanımı hangisidir?",o:["Ravilerin adalet ve zabtını, senedin muttasıl/munkatı oluşuna göre hadisin Hz. Peygamber'e nispetini inceleyen ilim","Kabul ve ret yönünden ravi ile mervînin durumunun bilinmesi","Hz. Peygamber'in söz ve fiillerini, ravilerini ve zabtını nakleden ilim","Hadislerden fıkhî hüküm istinbat etmenin yolları"],a:1,n:["Bu el-Hatîb'e kadarki âlimlerin tarifidir.","Doğru. el-Hatîb sonrası tarif budur.","Bu İbnu'l-Ekfânî'nin \"rivâyetü'l-hadis\" tarifidir.","Bu fıkıh usulünün işidir; Ğumârî dirâyeti bu yüzden fıkha bırakır."],p:"17"},
{q:"el-Ğumârî, ulûmu'l-hadîsin \"dirâyet\" diye bir bölümü olmasına neden karşı çıkar?",o:["Hadislerin dirâyeti fıkhın konusudur","Dirâyet kelâm ilmine aittir","İbnu'l-Ekfânî muhaddis değildir","Dirâyet hicrî 9. asra kadar bilinmemektedir"],a:0,n:["Doğru. Ona göre hadis ilmi sadece rivayetle ilgilenmeli; el-Kifâye fî ilmi'r-rivâye gibi eser adlarını delil gösterir.","Yanlış. Kelâmdan söz edilmez.","Yanlış. Böyle bir gerekçe yoktur.","Yanlış. Kitapta böyle bir iddia geçmez."],p:"19"},
{q:"Muhammed Avvâme, dirâyetin hadis ilminin parçası olduğunu savunurken hangi argümanı kullanır?",o:["Dirâyet yalnızca fıkıh usulüne aittir","İbnu'l-Ekfânî'nin taksimi ittifakla kabul edilmiştir","Rivayet ve dirâyet aynı müellif tarafından yazılmıştır","Hadiste dirâyet illet, ızdırap, idrac, cerh ve ta'dil gibi konuları da kapsar"],a:3,n:["Bu Ğumârî'nin görüşüne yakındır; Avvâme tam tersini savunur.","Yanlış. Taksime itiraz edenler olmuştur (Ğumârî).","Yanlış. Böyle bir argüman yoktur.","Doğru. Bu yüzden hadis ilminin dirâyetle ilgilenmesi doğaldır; hadis tarihinde aksi bir eğilim bilinmez."],p:"20"},
{q:"Cüz türü eser veren ilk muhaddis ile ulûmu'l-hadîs konularından ilk söz eden âlim sırasıyla hangisidir?",o:["İmam Şâfiî – Ali b. el-Medînî","Humeydî – Ahmed b. Hanbel","Ali b. el-Medînî – İmam Şâfiî","Yahyâ b. Maîn – Râmehürmüzî"],a:2,n:["Sıra ters.","Humeydî Buhârî'nin hocasıdır, küçük bir eserinde mustalah konularına değinmiştir.","Doğru. Ali b. el-Medînî (ö. 234) cüz; İmam Şâfiî (ö. 204) er-Risâle ile ilk söz eden.","Yahyâ b. Maîn cerh-ta'dil âlimidir; Râmehürmüzî ilk müstakil eserin sahibidir."],p:"21"},
{q:"İmam Şâfiî'nin \"Kadın ile halası nikâhta birleştirilmez\" hadisini sadece Ebû Hüreyre'nin rivayet ettiğini söylemesi onun hangi konudaki bilgisini gösterir?",o:["Mürsel hadis","Ferd hadis","Mütevâtir hadis","Mevkuf hadis"],a:1,n:["Mürsel senetten ravi düşmesidir; burada tek sahabi meselesi var.","Doğru. Tek sahabiden gelen hadis ferd hadistir.","Mütevâtir çok sayıda ravi ister; bu tersidir.","Mevkuf sahabeye ait sözdür; burada hadis Hz. Peygamber'e ait."],p:"21–22"},
{q:"Aşağıdaki eşleştirmelerden hangisi yanlıştır?",o:["Tirmizî – el-İlelü's-sağîr","Müslim – Sahîh'in mukaddimesi","Ebû Dâvûd – Mekkelilere mektup","Tahâvî – el-Kifâye"],a:3,n:["Doğru eşleşme. Câmi'in sonundadır; tahammül yolları, lafzen-manen rivayet işlenir.","Doğru eşleşme. Münker, ziyâdetü's-sika, isnad, muanan gibi konular geçer.","Doğru eşleşme. Sünnetini tanıtan mektuptur.","Yanlış eşleşme. el-Kifâye el-Hatîb el-Bağdâdî'nindir; Tahâvî'nin risalesi \"et-Tesviye beyne haddesenâ ve ahberanâ\"dır."],p:"22–23"},
{q:"\"el-Muhaddisü'l-fâsıl beyne'r-râvî ve'l-vâî\" adındaki \"vâî\" kelimesi Ahmet Yücel'e göre ne demektir?",o:["Hafız","Müsnid","Fakih","Talebe"],a:2,n:["Yanlış.","Yanlış. Müsnid hadisi senediyle rivayet edendir.","Doğru. Eser rivayet ile dirâyeti birleştirenin faziletini işler.","Yanlış."],p:"24"},
{q:"İbn Hacer'in Râmehürmüzî için \"فمن أول من صنف\" demesi hakkında yazarın vardığı sonuç nedir?",o:["Râmehürmüzî kesin olarak ilk eser yazandır","\"İlk eser telif edenlerden biri\" diye anlaşılmalıdır","İfade bütün nüshalarda aynıdır","İbn Hacer burada Hâkim'i kastetmiştir"],a:1,n:["Bazıları böyle anlamış ama Nûreddin Itr buna şaşırır.","Doğru. Şarihlerin çoğu, Itr ve İbn Hacer'in el-Mecma'u'l-müesses'teki ifadesi bunu destekler.","Yanlış. Nüshalarda üç farklı ifade vardır.","Yanlış. Hâkim ondan sonra anılır."],p:"25–26"},
{q:"Ebû Nuaym el-İsfahânî'nin müstahreci hangi eser üzerine yapılmıştır?",o:["el-Muhaddisü'l-fâsıl","el-Kifâye","el-İlmâ'","Hâkim'in Ma'rifetü ulûmi'l-hadîs'i"],a:3,n:["Râmehürmüzî'nin eseridir.","el-Hatîb'in eseridir.","Kâdî İyâz'ın eseridir.","Doğru. İbn Hacer, Hâkim'in eserinin tertibinin güzel olmadığını söyler."],p:"26"},
{q:"el-Hatîb'in el-Kifâye'si hakkında hangisi söylenemez?",o:["Delil olarak yalnızca sahih rivayetler kullanılmıştır","Cerh-ta'dil ve rivayet çeşitlerinin temelleri üzerine kurulmuştur","Haber-i vâhid ile amelin vacip olduğu savunulmuştur","Sonraki âlimlerin müracaat kaynağı olmuştur"],a:0,n:["Söylenemez. Eser birçok aşırı zayıf ve uydurma rivayetle delillendirmekle eleştirilir.","Söylenir. Hadis talebelerinin ihtiyacı için bu temeller üzerine kurulmuştur.","Söylenir. İnkârcılara karşı delil getirir.","Söylenir."],p:"27"},
{q:"Talebe adabı ile ravinin adap ve ahlakına dair ilk eserlerden sayılan, imla meclislerinden ve cerh-ta'dilden de bahseden eser hangisidir?",o:["el-İlmâ'","Mâ lâ yesa'u'l-muhaddise cehlühû","el-Câmi' li-ahlâkı'r-râvî ve âdâbi's-sâmi'","Ma'rifetü envâ'i ilmi'l-hadîs"],a:2,n:["Kâdî İyâz'ın tahammül ve edâya dair eseri.","Meyyânişî'nin yedi sayfalık kısa eseri.","Doğru. el-Hatîb el-Bağdâdî'nindir; rivayet adabına dair eserlerin başında gelir (s. 90).","İbnu's-Salâh'ın Mukaddime'si."],p:"27"},
{q:"Kâdî İyâz'ın el-İlmâ' adlı eseri için hangisi doğrudur?",o:["Hadis usulünde ilk müstakil eserdir","İbnu's-Salâh ondan istifade etmiş ama çoğu kere Kâdî İyâz'ın adını anmamıştır","Yedi sayfalık, sahih-hasen kavramlarını anlatan bir eserdir","İmla metoduyla hazırlandığı için tertipsizdir"],a:1,n:["Bu Râmehürmüzî'nin el-Muhaddisü'l-fâsıl'ıdır.","Doğru. Irâkî, Zerkeşî, İbn Hacer, Sehâvî, Süyûtî de ondan istifade etmiştir. Adı \"işaret etmek\" anlamındadır.","Bu Meyyânişî'nin eseridir.","Bu İbnu's-Salâh'ın Mukaddime'sidir."],p:"27–28"},
{q:"Meyyânişî'nin \"Mâ lâ yesa'u'l-muhaddise cehlühû\" adlı eserinin adının usul tarihinde geçmesinin sebebi nedir?",o:["Olgunluk dönemini başlatması","65 neviden oluşması","Mekke'de ders kitabı olması","İbn Hacer'in Nüzhe mukaddimesinde anması"],a:3,n:["Olgunluk dönemi İbnu's-Salâh ile anılır.","65 nevi İbnu's-Salâh'ın Mukaddime'sidir.","Yanlış. Müellif Mekke'de yaşamış ama eser ders kitabı değildir.","Doğru. Eser hatalı ve düzensizdir; Itr, İbn Hacer'in onu adına bakarak anmış olabileceğini söyler."],p:"28–29"},
{q:"İbnu's-Salâh'ın Mukaddime'sinin ilmî bir tertibe sahip olmamasının sebebi nedir?",o:["İmla metoduyla hazırlanması","Müellifin eseri tamamlayamaması","Manzum olması","Önceki eserlerin ihtisarı olması"],a:0,n:["Doğru. Derste yazdırılarak hazırlanmıştır; 65 nevidir ve dönüm noktası kabul edilir.","Yanlış.","Yanlış. Sonradan nazma çekilmiştir ama aslı manzum değildir.","Yanlış. Aksine kendisi ihtisar edilmiştir."],p:"29"},
{q:"İbnu's-Salâh'ın Mukaddime'si üzerine yapılan çalışmalardan hangisi tür bakımından diğerlerinden farklıdır?",o:["İrşâdü tullâbi'l-hakâik (Nevevî)","İhtisâru ulûmi'l-hadîs (İbn Kesîr)","et-Takyîd ve'l-îzâh (Irâkî)","el-Muknî' (İbnü'l-Mülakkın)"],a:2,n:["İhtisar.","İhtisar.","Farklı olan bu. Nüket tarzı çalışmadır (Zerkeşî ve İbn Hacer'in en-Nüket'i de öyle).","İhtisar."],p:"30"},
{q:"Hicrî 7–10. asırlar hadis usul tarihinin hangi dönemi olarak nitelendirilir?",o:["Tedvin dönemi","Tehzip ve tertip dönemi","Müstakil eserler dönemi","Rivayet dönemi"],a:1,n:["Tedvin hicrî 1–2. asırdır.","Doğru. Usul eserlerinin en parlak, olgunluk dönemidir.","Müstakil eserler hicrî 4. asırda başlar (Râmehürmüzî).","Rivayet dönemi Ahmet Yücel'in taksiminde ilk dönemdir (s. 103)."],p:"29"}
]},
{id:"u2",scope:"vize",bolum:"II. Bölüm",title:"Temel Kavramlar ve Tasnif Türleri",pages:"32–39",qs:[
{q:"Hadis usulünün konusu ve faydası hangi seçenekte doğru verilmiştir?",o:["Konusu Hz. Peygamber'in hayatı, faydası siyer bilgisi","Konusu raviler, faydası tabakâtı bilmek","Konusu metinler, faydası fıkhî hüküm","Konusu sened ve metin, faydası makbulü merduddan ayırmak"],a:3,n:["Bu siyerin konusudur.","Eksik. Raviler sened içinde incelenir.","Hüküm çıkarmak fıkhın işidir.","Doğru. Sened ve metin, kabul ve ret yönüyle incelenir."],p:"32"},
{q:"Kitaptaki tarife göre hangisi \"hadis\" kapsamına girmez?",o:["Bir sahabinin kendi içtihadıyla verdiği fetva","Hz. Peygamber'in nübüvvetten önceki bir sözü","Hz. Peygamber'in ten rengine dair bir rivayet","Hz. Peygamber'in huzurunda yapılıp itiraz etmediği bir fiil"],a:0,n:["Girmez. Hz. Peygamber'e izafe edilmez; bu mevkuf/eser olur.","Girer. Tarif nübüvvet öncesini de kapsar.","Girer. Hilkî sıfattır (ten rengi, doğum yeri).","Girer. Bu takrirdir."],p:"32"},
{q:"Hangisi \"eser\" kavramının ıstılahî anlamlarındandır?",o:["Senedin ulaştığı söz","Metne kadar uzanan raviler zinciri","Sahabe isimlerine göre tertip edilen kitap","Sahabe, tâbiîn veya başkalarına izafe edilen söz ve fiiller"],a:3,n:["Bu metin.","Bu sened.","Bu müsned (1. anlamı).","Doğru. Eser ya hadisle eş anlamlıdır ya da bu anlama gelir. Sözlükte \"geriye kalan, ayak izi\"."],p:"32–33"},
{q:"Hangisi \"müsned\" kelimesinin anlamlarından değildir?",o:["Sahabe isimlerine göre hadislerin toplandığı kitap","Senedi muttasıl ve merfû hadis","Sened","Hadisi senediyle rivayet eden kimse"],a:3,n:["Müsned'dir (Ahmed b. Hanbel'in Müsned'i gibi).","Müsned'dir.","Müsned'dir.","Değildir. Bu \"müsnid\"dir; hadis bilgisi olsun olmasın senediyle rivayet eden kişi."],p:"33"},
{q:"Hâkim, hâfız ve hüccet hakkında hangisi doğru değildir?",o:["\"Hâkim\" mahkeme terimi olduğundan hadis için uygun görülmemiştir","Ebû Ğudde unvanları hadis sayısıyla sınırlamayı doğru bulmaz","Hüccet 300 bin hadis bilen muhaddistir ve bu tarif gerçeği yansıtır","Hüccet, cerh-ta'dilde ravinin adaletini gösteren en üstün ifadedir"],a:2,n:["Doğru bilgi.","Doğru bilgi.","Yanlış bilgi. Kitap bu sayı tarifinin gerçeği yansıtmadığını söyler.","Doğru bilgi. Hüccet bir cerh-ta'dil ıstılahıdır."],p:"34"},
{q:"Bir ravinin tek başına rivayet ettiği hadis için başka tarikler arama eylemine ne denir?",o:["İ'tibâr","Mütâbeat","Şâhid","İstihrac"],a:0,n:["Doğru. Bir eylemdir; sonucu mütâbi' veya şâhid bulmaktır.","Bu ravinin başka raviye ortak olmasıdır, arama eylemi değil.","Farklı sahabiden gelen destek rivayettir.","İstihrac müstahrec yazmaktır."],p:"34"},
{q:"İbn Hacer'e göre mütâbi' ile şâhid arasındaki fark nedir?",o:["Dayandığı sahabinin aynı/farklı olması","Ortaklığın lafızla mı mana ile mi olduğu","Senedin muttasıl/munkatı olması","Ortaklığın aynı şeyhte mi üst şeyhte mi olduğu"],a:1,n:["Bu İbnu's-Salâh'ın ölçüsüdür.","Doğru. Lafızla ortaklık mütâbi', mana ile ortaklık şâhiddir; sahabi fark etmez.","Fark bu değildir.","Bu tam ve eksik mütâbeat ayrımıdır."],p:"35"},
{q:"Şâfiî – Mâlik – Abdullah b. Dînâr – İbn Ömer senediyle gelen hadis için bulunan Buhârî – Ka'nebî – Mâlik – Abdullah b. Dînâr – İbn Ömer rivayeti nedir?",o:["Eksik mütâbeat","Şâhid","Ferd-i mutlak","Tam mütâbeat"],a:3,n:["Eksik mütâbeatte buluşma şeyhin şeyhinde olur (Muhammed b. Zeyd – İbn Ömer gibi).","Şâhid farklı sahabiden gelir (İbn Abbas rivayeti gibi).","Destek bulunduğu için artık ferd değildir.","Doğru. Şâfiî ve Ka'nebî aynı şeyhte, Mâlik'te buluşur."],p:"35–36"},
{q:"Bir muhaddisin, başka bir eserin hadislerini kendi senedleriyle rivayet edip o eserin müellifinin şeyhinde veya üstünde buluştuğu esere ne denir?",o:["Müstahrec","Müstedrek","Etrâf","Mu'cem"],a:0,n:["Doğru. Ebû Avâne'nin Müslim üzerine müstahreci gibi.","Bir muhaddisin şartına uyup da almadığı hadisleri toplar (Hâkim'in Müstedrek'i).","Hadisin baş kısmını zikreder, gerisini hazfeder.","Şeyhlere, beldelere veya sahabe isimlerine göre tertip edilir."],p:"38"},
{q:"el-Buhârî'nin \"Ref'u'l-yedeyn fi's-salât\" adlı eseri hangi tasnif türüne örnektir?",o:["Câmi'","Müsned","Etrâf","Cüz"],a:3,n:["Câmi' sekiz ana konuyu kapsar.","Müsned sahabe isimlerine göredir.","Etrâf hadisin baş kısmını verir.","Doğru. Cüz: tek ravinin hadisleri ya da tek konu."],p:"38"},
{q:"Sünen ile musannef arasındaki fark nedir?",o:["Sünen sahabe isimlerine, musannef fıkıh bablarına göredir","Musannef yalnızca merfû içerir","Musannef merfû, mevkuf ve maktû içerir; sünen çoğunlukla sadece merfû içerir","Sünen hadisin yalnızca baş kısmını verir"],a:2,n:["İkisi de fıkıh bablarına göredir.","Tersi.","Doğru. Hadisçiler mevkuf-maktû için sünen adını kullanmaz.","Bu etrâf kitaplarıdır."],p:"38–39"},
{q:"Hangisi \"muvatta\" isminin verilme sebepleri arasında zikredilir?",o:["Sahabe isimlerine göre tertip","Sadece merfû rivayet içermesi","Bir muhaddisin şartlarına göre derlenmesi","İmam Mâlik'in eserini Medine'de 70 fakihe arz edip onaylatması"],a:3,n:["Bu müsned.","Muvattalar merfû, mevkuf ve maktû içerir.","Bu müstedrek.","Doğru. \"Uygun bulmak\" anlamı; ayrıca \"kolaylaştırılmış\" anlamı da zikredilir."],p:"38"},
{q:"Hafızların imla meclislerinde talebeye ön hazırlık yapan, işitemediklerini bildiren, \"hafızın asistanı\" olan kimseye ne denir?",o:["Müfîd","Müsnid","Muhaddis","Emîrü'l-mü'minîn fi'l-hadîs"],a:0,n:["Doğru. Hicrî 3. asırda ortaya çıkan bir terimdir.","Senede önem verip metni bilmeyen kimse (ilk mertebe).","Dirâyet ve rivayeti bilen, hadislerin çoğunu ezberleyen.","En üst rütbe; hicrî 2. asırda ortaya çıkmıştır."],p:"39"},
{q:"Hangisi \"emîrü'l-mü'minîn fi'l-hadîs\" unvanının şartlarından değildir?",o:["Hadisleri yazılı ve şifahî olarak tam zabt etmek","Belirli sayıda (yüz binlerce) hadis ezberlemek","İlel ve ravi ilminde temayüz etmek","Tarihe damga vuran bir eser bırakmak"],a:1,n:["Şarttır.","Şart değildir. Sayı şartı yoktur; kitap sayıyla tarif etmeyi genel olarak doğru bulmaz.","Şarttır.","Şarttır."],p:"39"},
{q:"Hangisi muksirûn sahabiler arasında yer almaz?",o:["Enes b. Mâlik","Hz. Âişe","Hz. Ebû Bekir","Câbir b. Abdullah"],a:2,n:["Muksirdir (2286).","Muksirdir (2210).","Muksir değildir. Muksirûn binden fazla rivayeti olanlardır: Ebû Hüreyre 5374, İbn Ömer 2630, Enes, Âişe, İbn Abbas, Câbir, Ebû Saîd.","Muksirdir (1540)."],p:"39"},
{q:"Âdeti sadece sikalardan rivayet etmek olan bir tâbiînin mürseli hakkında cumhurun görüşü nedir?",o:["İttifakla kabul edilir","Tevakkuf edilir","İttifakla reddedilir","Mevzû sayılır"],a:1,n:["Yanlış. Ravi ona göre sika ama başkasına göre zayıf olabilir.","Doğru. Sika olmayanlardan da rivayet ediyorsa ittifakla kabul edilmez.","Bu sika olmayanlardan da rivayet eden tâbiî içindir.","Yanlış."],p:"37"}
]},
{id:"u3",scope:"final",bolum:"III. Bölüm",title:"Mana ile Rivayet, Tahammül ve Edâ",pages:"40–48",qs:[
{q:"Hangisi mana ile rivayetin caiz olduğunu söyleyenlerin gerekçelerinden değildir?",o:["Sahabenin bir olayı farklı lafızlarla rivayet etmesine itiraz edilmemesi","Şeriatın Arap olmayanlara kendi dillerinde açıklanabilmesi","\"Sözümü işitip işittiği gibi aktaranın Allah yüzünü ağartsın\" hadisi","Asıl amacın lafız değil mana olması"],a:2,n:["Cevaz gerekçesidir.","Cevaz gerekçesidir: Arapçayı başka dille değiştirmek caizse Arapçayla değiştirmek evleviyetle caizdir.","Değildir. Bu, cevaz VERMEYENLERİN delilidir; \"işittiği gibi\" lafzı aynen nakli gösterir.","Cevaz gerekçesidir."],p:"40–42"},
{q:"Şu'be'nin erkeğe yönelik zaferan yasağını \"نهى عن التزعفر\" diye kadınları da kapsayacak şekilde rivayet etmesi hangi görüşe örnek verilir?",o:["Mana ile rivayet sadece sahabeye hastır","Mana ile rivayet eden ravi kelimenin müsavi olduğunu zanneder ama gerçekte fark olabilir","Emir ve nehiylerin mana ile rivayeti caizdir","Hadisin ihtisarı caizdir"],a:1,n:["Bu 8 gruptan biridir ama örnek bununla ilgili değildir.","Doğru. Cevaz vermeyenlerin delilidir; İsmâil b. Uleyye bu rivayeti doğru bulmamıştır.","Bu bir cevaz görüşüdür; örnekle ilgisi yok.","İhtisar lafız hazfidir; konu farklı."],p:"42"},
{q:"Mana ile rivayete cevaz verenlerin 8 görüşü içinde kitabın \"en kuvvetli\" dediği görüş hangisidir?",o:["Lafzı hatırlayan mana ile rivayet edemez; lafzı unutan edebilir","Mana ile rivayet sadece sahabe ve tâbiîlere hastır","Mana ile rivayet sadece fetva için caizdir","Tevile ihtimali olan lafızlar mana ile rivayet edilebilir"],a:0,n:["Doğru. Mâverdî el-Hâvî'de de bunu söyler: lafzı unutanın başka çaresi kalmamıştır.","Bu 8. görüştür.","Tersi: 6. görüşe göre fetva ve delil için caiz değildir.","Tersi: tevile ihtimali OLMAYANLARIN mana ile rivayeti caiz görülmüştür."],p:"42–43"},
{q:"Hadisin bir kısmını bir şeyhten, diğer kısmını başka bir şeyhten alıp birleştirmeye ne denir ve bunu ilk yapan kimdir?",o:["Takti' – Buhârî","İhtisar – Müslim","Telfik – Zührî","İdrac – Zührî"],a:2,n:["Takti' hadisi bölüp bablara dağıtmaktır.","İhtisar lafızların bir kısmını hazfetmektir; Müslim ihtisara cevaz vermiştir.","Doğru. Açıklanırsa caizdir; telfik yapan raviden hadis aldığı için Buhârî eleştirilmiştir.","İdrac metne ondan olmayanı eklemektir (müdrec)."],p:"43–44"},
{q:"Muhaddislerin cumhuruna göre hadis alma yollarının en üstünü hangisidir?",o:["Semâ","Kıraat (arz)","İcazet","Münâvele"],a:0,n:["Doğru. Şeyh okur, talebe dinler veya yazar.","Sahih görüşe göre semâdan bir derece aşağıdadır.","Sözlü veya yazılı rivayet izni; semâ ve kıraatten aşağıdır.","İcazetli münâvele semâ ve kıraatin altında kabul edilir."],p:"44"},
{q:"Edâ lafızları tahammül yollarına tahsis edildikten sonra \"أنبأني / أنبأنا\" hangi yol için kullanılmıştır?",o:["Semâ","Kıraat","İcazet","Vicâde"],a:2,n:["Semâ için سمعت ve حدثني.","Kıraat için أخبرني.","Doğru. Müteahhirînin ıstılahında أنبأنا icazet lafzıdır.","Vicâde için وجدت بخط فلان."],p:"44–46"},
{q:"Sahih görüşe göre kıraatin (arz) derecesi nedir?",o:["Semâdan üstündür","Semâ ile eşittir","Semâdan bir derece aşağıdadır","İcazetten de aşağıdadır"],a:2,n:["Bazı âlimlerin görüşü.","Buhârî ve İmam Mâlik'in görüşü.","Doğru. Ravinin okuyup şeyhin takip ettiği kıraat ittifakla sahihtir.","Yanlış."],p:"45"},
{q:"Cumhura göre hangi icazet çeşidiyle rivayet ve amel kesin olarak sahihtir?",o:["Muayyen birine muayyen bir rivayet için izin","Maduma (doğacak çocuğa) icazet","Meçhul birine izin","Muayyen olmayana muayyen olmayan rivayetler için izin"],a:0,n:["Doğru. \"Sana Buhârî'nin Sahîh'ini rivayet etmen için izin verdim\" gibi.","Tartışmalıdır.","Tartışmalıdır (aynı isimde birçok kişi olması).","Tartışmalıdır."],p:"45–46"},
{q:"Talebe bir şeyhin kendi el yazısıyla yazdığı hadisleri bulur; ondan hiç hadis almamış ve izin de almamıştır. Bu yol nedir, bulunan hadisler nasıl değerlendirilir?",o:["Kitabet – muttasıl","İ'lâm – sahih","Vicâde – munkatı","Vasiyet – makbul"],a:2,n:["Kitabette şeyh bizzat yazıp gönderir.","İ'lâmda şeyh \"bu benim semâımdır\" diye haber verir; sahih olana göre caiz değildir.","Doğru. Tashîfe sebep olduğu için âlimler bu metotla rivayete izin vermemiştir.","Vasiyette şeyh kitabını birine vasiyet eder; doğrusu rivayetin caiz olmamasıdır."],p:"47"},
{q:"\"عن\" lafzıyla gelen rivayeti Müslim hangi şartlarla kabul etmiştir?",o:["Lukıy (görüşmenin sabit olması) ve tedlisçi olmama","Muasır olma ve tedlisçi olmama","Sadece ravinin sika olması","Semâ lafzıyla da gelmesi"],a:1,n:["Bu Buhârî'nin şartıdır.","Doğru. Müslim aynı asırda yaşamayı (görüşme imkânını) yeterli görür.","Eksik.","Böyle bir şart koşmaz."],p:"47"},
{q:"Uzmanlar arasında hadislerin hızlı okunduğu, âlimlerin birbirinin ilminden istifade ettiği okuma yöntemi hangisidir?",o:["Serd (okuyup geçme)","Hall ve bahs (açıklama ve araştırma)","İm'ân (geniş açıklamalı)","Mukabele"],a:0,n:["Doğru. طريق السرد.","Bir kitabın talebelere okutulmasında uygulanır.","Halka hitap edecek biçimde okutulmasında uygulanır.","Mukabele yazılan nüshayı aslıyla karşılaştırmaktır."],p:"48"},
{q:"Şeyh kitabını \"bu benim hocamdan dinlediklerim\" diyerek verir ama rivayet izni vermez. Sahih görüşe göre hüküm nedir?",o:["Semâ derecesindedir","Rivayet caizdir","Rivayet caiz değildir","İcazetten üstündür"],a:2,n:["Yanlış.","Bu icazetli münâvele için geçerlidir.","Doğru. Bu icazetsiz münâveledir.","Yanlış."],p:"46"}
]},
{id:"u4",scope:"final",bolum:"IV. Bölüm",title:"Haber: Mütevâtir ve Âhâd",pages:"49–54",qs:[
{q:"Hangisi mütevâtirin şartlarından değildir?",o:["Çok sayıda ravi bulunması","Bu çokluğun her tabakada olması","Ravi sayısının en az on olması","Haberin beş duyuya dayanması"],a:2,n:["Şarttır.","Şarttır.","Şart değildir. İbn Hacer ve takipçilerine göre alt veya üst sınır koymak yanlıştır; durumdan duruma değişir.","Şarttır. \"Âdem yaratılmıştır\" gibi akıl yürütme mütevâtir olamaz."],p:"49"},
{q:"Mütevâtir haberin hükmü nedir?",o:["İlm-i nazarî ifade eder","Zan ifade eder, senedi incelenir","İlm-i yakînî (zarûrî) ifade eder, ravileri sened tenkidine tabi tutulmaz","Sadece fezâilde kullanılır"],a:2,n:["Bu âhâdın hükmüdür.","Yanlış. Bu yüzden mütevâtir usulün asıl değil tâli konusudur.","Doğru.","Yanlış."],p:"50"},
{q:"\"Kim kasten benim adıma yalan uydurursa cehennemdeki yerine hazırlansın\" hadisi hangi tevatüre örnektir?",o:["Lafzî mütevâtir","Manevî mütevâtir","Tabaka tevatürü","Amel tevatürü"],a:0,n:["Doğru. Hem lafız hem mana tevatür etmiştir.","Manevîye örnek Hz. İsa'nın nüzûlüdür.","Tabaka tevatürüne örnek mushaflara yazılan Kur'ân'dır.","Amel tevatürüne örnek abdestte misvaktır."],p:"50"},
{q:"Abdestte misvak kullanılması âhâd haberle sabit olduğu hâlde sünnet oluşu bize nasıl ulaşmıştır?",o:["Lafzî tevatür","Manevî tevatür","Tabaka tevatürü","Amel (tevârüs) tevatürü"],a:3,n:["Yanlış.","Yanlış.","Senedsiz nesilden nesile aktarılan habere denir; örneği Kur'ân'dır.","Doğru. İnsanların yaparak yaşattığı amel; inkârı küfrü gerektirir."],p:"50"},
{q:"Her tabakada en az üç ravisi bulunan âhâd habere ne denir?",o:["Azîz","Garîb","Meşhur","Müstefîz"],a:2,n:["En az iki ravi.","Bir veya daha fazla tabakada tek ravi.","Doğru. Meşhur sahih, hasen veya zayıf olabilir.","Ayrı bir ıstılahtır; tarifinde ihtilaf vardır."],p:"51"},
{q:"Azîz hadis için hangisi doğrudur?",o:["Her tabakada en az dört ravi gerekir","Bazı tabakalarda ikiden fazla ravi olması azîzliği bozar","Azîz hadisleri toplayan müstakil eser yoktur","Kelime yalnızca \"güçlendi\" anlamındadır"],a:2,n:["Yanlış. En az ikidir.","Yanlış. Bozmaz.","Doğru.","Yanlış. \"Az oldu\" anlamı da vardır."],p:"51"},
{q:"Garîb-i nisbî (ferd-i nisbî) için hangisi doğrudur?",o:["Sahabe tabakasında tek ravi vardır","Hadis hiçbir tabakada azîz veya meşhur olmamıştır","Teferrüd eden raviye kadar hadis azîz veya meşhurdur","Sadece tâbiî tabakasında görülür"],a:2,n:["Bu garîb-i mutlaktır.","Bu da garîb-i mutlaktır.","Doğru. Teferrüd, önceki azîzliği veya meşhurluğu iptal ettiği için \"nisbî\" denir.","Yanlış."],p:"52–53"},
{q:"Hangisi garîb hadisleri toplamak için yazılmış bir eserdir?",o:["Bezzâr'ın Müsned'i","Taberânî'nin el-Mu'cemü'l-evsat'ı","Dârekutnî'nin Garâibu Mâlik'i","Süyûtî'nin el-Ezhârü'l-mütenâsira'sı"],a:2,n:["İçinde garîb hadis bulunan eserdir, onları toplamak için yazılmamıştır.","İçinde garîb hadis bulunan eserdir.","Doğru. Dârekutnî'nin el-Efrâd'ı da bu türdendir.","Mütevâtir hadislere dair eserdir; telhisi Katfü'l-ezhâr'dır."],p:"53–54"},
{q:"Âlimlerin bir kısmı ferd ile garîbi ayırır. Bu ayrıma göre \"ferd\" ve \"garîb\" denince sırasıyla ne kastedilir?",o:["Ferd-i nisbî – ferd-i mutlak","Ferd-i mutlak – ferd-i nisbî","Azîz – meşhur","Mütevâtir – âhâd"],a:1,n:["Sıra ters.","Doğru.","Yanlış.","Yanlış."],p:"51"}
]},
{id:"u5",scope:"final",bolum:"IV. Bölüm",title:"Makbul Hadis: Sahih, Hasen, Muhtelif, Nesh",pages:"54–60",qs:[
{q:"Hangisi sahih hadisin beş şartından değildir?",o:["Senedin muttasıl olması","Ravilerin âdil ve zâbıt olması","Şaz ve muallel olmaması","Ravilerin fakih olması"],a:3,n:["Şarttır.","Şarttır (iki ayrı şart).","Şarttır (iki ayrı şart).","Şart değildir."],p:"54"},
{q:"İbn Hacer'e göre şaz nedir?",o:["Zayıf ravinin sikaya muhalefeti","Sika ravinin kendinden daha sika raviye muhalefeti","Sika ravinin tek kalması","Metinde gizli illet bulunması"],a:1,n:["Bu münkerdir.","Doğru. Mukabili mahfuzdur.","Bu ferd/garîbdir.","Bu muallel tarifidir."],p:"54, 80"},
{q:"Hangisi bir ravinin adaletinin sabit olduğu yollardan değildir?",o:["Ta'dil âlimlerinin tezkiyesi","Şöhret","Sahih şartıyla eser yazanların kitabına alınması","Çok sayıda hadis rivayet etmesi"],a:3,n:["Yoldur.","Yoldur; bu durumda tezkiyeye gerek kalmaz.","Yoldur; Şeyhayn'ın ravileri gibi.","Yol değildir."],p:"55"},
{q:"Esahhu'l-esânîd olarak \"Mâlik – Nâfi' – İbn Ömer\" senedi kimden rivayet edilmiştir?",o:["Ahmed b. Hanbel","Buhârî","İbnü'l-Medînî","Ebû Bekir b. Ebû Şeybe"],a:1,n:["Ahmed b. Hanbel ve İshak'tan: Zührî – Sâlim – babası (İbn Ömer).","Doğru.","İbnü'l-Medînî: İbn Sîrîn – Abîde – Ali.","İbn Ebû Şeybe: A'meş – İbrâhim – Alkame – İbn Mes'ûd."],p:"56"},
{q:"Sahîhayn üzerine yapılan müstahreclerle ilgili hangi eşleştirme doğrudur?",o:["Ebû Avâne – Buhârî","Ebû Bekir el-İsmâilî – Buhârî","Ebû Nuaym – sadece Müslim","Hâkim – Müslim"],a:1,n:["Ebû Avâne Müslim üzerine yazmıştır.","Doğru.","Ebû Nuaym Sahîhayn üzerine yazmıştır.","Hâkim'in eseri müstedrektir."],p:"57"},
{q:"Sahih hadisin şartlarını taşıyıp ravisinin zabtı biraz eksik olan hadise ne denir?",o:["Sahih li-gayrihî","Hasen li-zâtihî","Hasen li-gayrihî","Zayıf"],a:1,n:["Hasen li-zâtihî başka tarikle desteklenirse sahih li-gayrihî olur.","Doğru.","Zayıf hadis başka tarikle desteklenince olur.","Yanlış."],p:"57–58"},
{q:"Zayıf bir hadisin başka tariklerle hasen li-gayrihî mertebesine çıkabilmesi için hangisi gerekir?",o:["Zayıflığın fısk veya kizb sebebiyle olmaması","Sadece bir destekleyici tarik","Ravinin meçhulü'l-ayn olması","Hadisin mevkuf olması"],a:0,n:["Doğru. Adaletteki zayıflık şiddetli, zabttaki zayıflık hafif kabul edilir.","Kitaba göre daha düşük bir hadisle yetmez; en az iki hadis gerekir.","Yanlış.","Yanlış."],p:"58"},
{q:"Irâkî'ye göre hadisleri ilk defa sahih, hasen ve zayıf diye ayıran kimdir?",o:["Tirmizî","Hattâbî","İbnu's-Salâh","Ebû Dâvûd"],a:1,n:["Tirmizî hasen hadisin bol olduğu eserin sahibidir.","Doğru.","Yanlış.","Ebû Dâvûd zayıf hadisleri beyan etmiştir."],p:"58"},
{q:"İki makbul hadis arasında teâruz olduğunda izlenecek yolun sırası hangisidir?",o:["Tercih → cem → nesh → tevakkuf","Cem → nesh → tercih → tevakkuf","Nesh → cem → tevakkuf → tercih","Tevakkuf → cem → tercih → nesh"],a:1,n:["Yanlış.","Doğru. Bu alanda Şâfiî'nin İhtilâfü'l-hadîs'i, İbn Kuteybe'nin Te'vîlü muhtelifi'l-hadîs'i, Tahâvî'nin Müşkilü'l-âsâr'ı vardır.","Yanlış.","Yanlış."],p:"59"},
{q:"Nâsih ve mensuhun tespiti ile ilgili hangisi doğrudur?",o:["İcma kendisi nesheder","İcma neshe delalet eder ama kendisi nesih edici olamaz","Sahabe sözüyle tespit edilemez","Tarih bilgisi işe yaramaz"],a:1,n:["Yanlış.","Doğru. Diğer yollar sahabe sözü ve tarihin bilinmesidir.","Yanlış. İlk yoldur.","Yanlış. İki hadisin tarihinin bilinmesi bir yoldur."],p:"59"}
]},
{id:"u6",scope:"final",bolum:"IV. Bölüm",title:"Merdud: Zayıf Hadis ve Senetten Ravi Düşmesi",pages:"60–70",qs:[
{q:"Zayıf bir hadis, zayıflığı belirtilmeden hangi şartlarla rivayet edilebilir?",o:["Akaid ve helal-haramla ilgili olmamalı","Sadece sahih bir hadisle desteklenmeli","Senedi muttasıl olmalı","Ravisi meşhur olmalı"],a:0,n:["Doğru. Vaaz, terğîb ve terhîb bağlamında caizdir; zayıflığı belirtilirse şartsız caizdir.","Yanlış.","Yanlış.","Yanlış."],p:"60"},
{q:"Cumhura göre fezâil-i amelde zayıf hadisle amel şartlarından hangisi değildir?",o:["Zayıflığın şiddetli olmaması","Amel edilen bir kaide-i külliyeye bağlı olması","İhtiyatla, sübutuna kesin inanmadan amel edilmesi","Akaidle ilgili olması"],a:3,n:["Şarttır.","Şarttır.","Şarttır.","Şart değildir; tersine akaid konuları dışarıda kalır."],p:"61"},
{q:"Hangisi sakt-ı zâhir çeşitlerinden değildir?",o:["Muallak","Mu'dal","Müdelles","Munkatı'"],a:2,n:["Sakt-ı zâhirdir.","Sakt-ı zâhirdir.","Sakt-ı hafîdir; düşen raviyi ancak hadiste derinleşmiş âlimler tespit eder (mürsel-i hafî de öyle).","Sakt-ı zâhirdir (mürsel de)."],p:"61"},
{q:"Musannıfın, isnadın baş tarafından bir veya daha fazla raviyi peş peşe hazfetmesiyle oluşan hadis hangisidir?",o:["Mürsel","Muallak","Mu'dal","Munkatı'-ı hâs"],a:1,n:["Mürselde düşme senedin sonundadır (tâbiîden sonra).","Doğru. Lügatte \"asılı kılınan\".","Mu'dal iki veya daha fazla ravinin peş peşe, herhangi bir yerde düşmesidir.","Munkatı'da sahabeden önce tek ravi düşer."],p:"62"},
{q:"Muallak hadislerle ilgili hangisi doğrudur?",o:["\"Kâle fülân\" gibi cezm sigasıyla gelen muallaklar sahih kabul edilir","\"Ruviye an fülân\" gibi temriz sigasıyla gelenler sahihtir","Sahîhayn'ın muallakları merduddur","İbn Hacer'in \"min musannif\" kaydı herkesçe kabul edilmiştir"],a:0,n:["Doğru.","Yanlış. Bunlar için sahih denemez.","Yanlış. Sahîhayn'ın muallakları merdud değildir.","Yanlış. Muhakkikler bu kaydı lüzumsuz bulmuştur; vaiz bile ta'lik yapar."],p:"62"},
{q:"Hanefî, Mâlikî ve Hanbelîlere göre mürsel hadisin hükmü nedir?",o:["Mutlak zayıftır","İlk üç asrın mürseli sahihtir, ihticaca elverişlidir","Sadece Saîd b. Müseyyeb'in mürseli kabul edilir","Mevzû hükmündedir"],a:1,n:["Bu muhaddislerin çoğunun görüşüdür.","Doğru.","Bu Süyûtî'nin saydığı 10 görüşten biridir.","Yanlış."],p:"63"},
{q:"Senetten iki veya daha fazla ravinin peş peşe düştüğü, zayıflığı mürsel ve munkatıdan fazla olan hadis hangisidir?",o:["Mu'dal","Muallak","Mürsel-i hafî","Müdrec"],a:0,n:["Doğru. Düşme senedin başında, ortasında veya sonunda olabilir.","Muallakta düşme sadece senedin başındadır.","Sakt-ı hafîdir.","Ekleme, düşme değil."],p:"64"},
{q:"Bir tâbiî başka bir tâbiîyi düşürüp senedi sahabeye isnad ederse hadis ne olur?",o:["Mürsel","Mu'dal","Munkatı'","Muallak"],a:2,n:["Mürselde sahabe düşer (tâbiî de düşmüş olabilir).","Tâbiî ve sahabenin ikisinin düştüğü kesinse mu'dal olur.","Doğru (munkatı'-ı hâs).","Yanlış."],p:"64–65"},
{q:"Müdellisin \"sika – zayıf – sika\" senedindeki zayıf şeyhi düşürdüğü, en çirkin kabul edilen tedlîs hangisidir?",o:["Tedlîsü'ş-şuyûh","Tedlîsü't-tesviye","Tedlîsü'l-bilâd","Tedlîsü'l-atf"],a:1,n:["Şeyhi bilinmeyen adıyla anmaktır; en az mekruh olanıdır.","Doğru. En meşhurları Bakıyye b. Velîd ve Velîd b. Müslim'dir.","9 kısımdan biri.","9 kısımdan biri."],p:"66–67"},
{q:"Hangisi tedlîsü'l-isnâda götüren sebeplerdendir ama tedlîsü'ş-şuyûh amaçları arasında sayılmaz?",o:["Şeyhin zayıf olması","Âlî isnad vehmi vermek","Şeyhin kendisinden yaşça küçük olması","Şeyhi uzun yaşadığı için yeni yetmelerin ona ortak olmasını hazmedememek"],a:1,n:["Her ikisinde de geçerlidir.","Doğru. Diğer sebep: çok hadis aldığı şeyhten kaçırdığını telafi etmek.","Her ikisinde de geçerlidir.","Her ikisinde de geçerlidir."],p:"67"},
{q:"Tedlîsü'l-isnâd ile irsâl-i hafî arasındaki fark nedir?",o:["Müdellis, adını andığı şeyhten başka hadisler işitmiştir; irsâl-i hafîde ravi o şeyhten hiç hadis almamıştır","İkisi aynıdır","İrsâl-i hafîde ravi şeyhinden çok hadis almıştır","Müdellis sarih semâ lafzı kullanır"],a:0,n:["Doğru. Ortak noktaları işitmiş izlenimi vermektir.","Yanlış.","Tersi.","Yanlış. Müdellis yalancı değildir; \"an\", \"kâle\" gibi ihtimalli lafız seçer."],p:"68–69"},
{q:"Sahîhayn'daki muanan hadislerle ilgili hangisi doğrudur?",o:["Buhârî'de Müslim'den daha çoktur","Müslim'de daha çoktur, çünkü Müslim görüşme imkânını yeterli görür","Hiç muanan yoktur","Muanan hadisler ittifakla munkatıdır"],a:1,n:["Tersi.","Doğru. Âlimler bu görüşü eleştirmiştir.","Yanlış.","Yanlış. Çoğunluğa göre şartlarıyla muttasıldır."],p:"69"}
]},
{id:"u7",scope:"final",bolum:"IV. Bölüm",title:"Ravide Ta'n: Mevzu'dan Şaz'a",pages:"70–81",qs:[
{q:"Hangisi ravinin ADALETİ ile ilgili ta'n sebeplerinden değildir?",o:["Yalan söylemesi","Fâsık olması","Bid'atçi olması","Sû-i hıfz"],a:3,n:["Adaletle ilgilidir.","Adaletle ilgilidir.","Adaletle ilgilidir.","Zabtla ilgilidir; fuhş-ı galat, gaflet, vehem ve sikalara muhalefet de öyle."],p:"70–71"},
{q:"Hata oranı doğrularına eşit veya fazla olan ravinin kusuruna ne denir?",o:["Sû-i hıfz","Fuhş-ı galat","Gaflet","Vehem"],a:1,n:["Hata oranı doğrularından azdır.","Doğru.","Zabtta gevşeklik.","Hatalı ezberi doğru sanmak."],p:"70–71"},
{q:"Hangisi mevzu rivayeti tespit yollarından değildir?",o:["Uyduranın ikrarı","Ravinin hadis aldığını iddia ettiği şeyhin ölümünden sonra doğmuş olması","Hadisin Kur'ân'ın sarih ifadesine aykırı olması","Ravinin hadisi mana ile rivayet etmesi"],a:3,n:["Yoldur.","Yoldur (ikrar hükmünde karine).","Yoldur.","Yol değildir; mana ile rivayet şartlarıyla caizdir."],p:"71"},
{q:"Terğîb ve terhîb konularında hadis uydurmanın caiz olduğunu iddia eden mezhep hangisidir?",o:["Mu'tezile","Kerrâmiyye","Hâricîler","Mürcie"],a:1,n:["Yanlış.","Doğru. \"Benim adıma yalan uydurmayın\" hadisine \"insanları saptırmak için\" kaydı koymuşlardır.","Hâricîler siyasi görüşleri için uydurmakla anılır.","Yanlış."],p:"72"},
{q:"Yalancılıkla itham edilen ravinin rivayet ettiği hadise ne denir?",o:["Mevzû","Metrûk","Münker","Muallel"],a:1,n:["Hz. Peygamber'e yalan isnad edenin rivayetidir.","Doğru. Matrûh ve vâh diyenler de vardır.","Fuhş-ı galat veya fısk sahibinin rivayetidir.","Sika ravinin vehmidir."],p:"72"},
{q:"Kendisinden iki veya daha fazla ravi rivayette bulunduğu hâlde sika olduğu belirtilmemiş raviye ne denir?",o:["Meçhulü'l-ayn","Meçhulü'l-hâl (mestûr)","Mübhem","Mühmel"],a:1,n:["Kendisinden sadece tek ravi rivayet eder.","Doğru. Cumhura göre hadisi merduddur.","Adı hadiste zikredilmeyen ravidir.","Aynı isimli iki kişiden hangisi olduğu ayırt edilemeyen ravidir."],p:"73"},
{q:"Fıskı gerektiren bid'at sahibinin rivayeti hangi şartla kabul edilir?",o:["Bid'atına davet etmemesi ve bid'atını yaymak için rivayet etmemesi","Bid'atından tövbe etmesi şart değildir, her durumda kabul edilir","Hiçbir şekilde kabul edilmez","Sadece mütevâtir rivayeti kabul edilir"],a:0,n:["Doğru.","Yanlış.","Bu küfrü gerektiren bid'at içindir.","Yanlış."],p:"74"},
{q:"İbn Hacer'in tariflerine göre münker ile şaz arasındaki fark nedir?",o:["Şazda zayıf ravi sikaya, münkerde sika daha sikaya muhalefet eder","Münkerde zayıf ravi sikaya, şazda makbul ravi daha sikaya muhalefet eder","İkisinde de muhalefet yoktur","Münker makbul, şaz merduddur"],a:1,n:["Ters.","Doğru. Ortak payda muhalefettir. Münkerin mukabili mâruf, şazın mukabili mahfuzdur.","Yanlış.","Yanlış. Münker zayıf cidden hadislerdendir."],p:"74"},
{q:"Muallel hadisle ilgili hangisi doğrudur?",o:["Ravisi zayıftır","Ravisi sikadır; kusur sika ravinin vehminden doğar","Illet her zaman açıktır","Irâkî'ye göre en uygun isim \"muallel\"dir"],a:1,n:["Zayıf ravinin hadisi zaten merduddur.","Doğru. İllet gizli ve sıhhati zedeleyici olmalıdır.","Yanlış. Kapalı ve gizli olmalıdır.","Irâkî \"mu'al\" (معل) demeyi uygun bulur; İbnu's-Salâh \"muallel\"i savunur."],p:"75"},
{q:"Hangisi hadise idrac (ekleme) sebeplerinden değildir?",o:["Şer'î bir hükmü açıklamak","Garîb bir kelimeyi açıklamak","Hadisten önce şer'î bir hüküm zikretme isteği","Hadisin senedini kısaltmak"],a:3,n:["Sebeptir.","Sebeptir. Zührî'nin idracları böyledir.","Sebeptir.","Sebep değildir."],p:"76–77"},
{q:"Kalb (maklûb) yapmanın hükmü ile ilgili hangisi doğrudur?",o:["İmtihan için caizdir, sonra doğrusu söylenmelidir","İnsanların dikkatini çekmek için caizdir","Hata ile olursa ravi hiçbir zaman mazur görülmez","Maklûb hadis makbul hadislerdendir"],a:0,n:["Doğru. Buhârî'nin Bağdat imtihanı bu kabildendir.","Caiz değildir.","Hata ile olursa mazurdur; çoğalırsa zabtı düşer.","Merdud çeşitlerindendir."],p:"77–78"},
{q:"Bir hadisin muzdarib sayılması için hangi iki şart gerekir?",o:["Ravinin zayıf olması ve tek kalması","Tarikler arasındaki ihtilafın cem edilememesi ve sıhhat eşitliğinin tercihe engel olması","Senedin munkatı ve metnin garîb olması","Ravinin mana ile rivayeti ve ihtisarı"],a:1,n:["Yanlış.","Doğru. Izdırap çoğunlukla senette olur; muzdarib sahih veya hasen de olabilir.","Yanlış.","Yanlış."],p:"78–79"},
{q:"\"Âsım el-Ahvel\" adının \"Vâsıl el-Ahdeb\" diye zabt edilmesi hangi tashîf türüdür?",o:["Tashîf-i basar","Tashîf-i sem'","Manada tashîf","Muharref"],a:1,n:["Yazının kötülüğü veya noktasızlıktan yanlış okumadır; en yaygın türdür.","Doğru. Uzaklık veya gürültü yüzünden yanlış işitmedir.","Lafız aynı kalır, mana yanlış anlaşılır (Ebû Mûsâ el-Anezî ve \"aneze\").","İbn Hacer'e göre harekelerdeki tashîftir."],p:"79–80"},
{q:"İhtilattan önce mi sonra mı olduğu tespit edilemeyen muhtelit rivayeti hakkında hüküm nedir?",o:["Kabul edilir","Reddedilir","Tespit edilene kadar tevakkuf edilir","Mevzû sayılır"],a:2,n:["İhtilattan önceki rivayetler için.","İhtilattan sonraki rivayetler için.","Doğru. İhtilat yaşlılık, görme kaybı, kitapların yanması gibi sebeplerle olur.","Yanlış."],p:"81"}
]},
{id:"u8",scope:"final",bolum:"IV. Bölüm",title:"Nispet, Cerh-Ta'dil, Rivayet Ehliyeti, İsnad",pages:"81–93",qs:[
{q:"Hangisi Kur'ân ile kudsî hadis arasındaki farklardan biri değildir?",o:["Kur'ân'ın lafzı da manası da Allah'a aittir","Kur'ân'ın okunması ibadettir, kudsî hadisinki değildir","Kur'ân'da tevatür şartı aranır, kudsî hadiste aranmaz","Kudsî hadisin lafzı da manası da Hz. Peygamber'e aittir"],a:3,n:["Farktır.","Farktır.","Farktır.","Yanlış bilgi. Kudsî hadisin manası Allah'a, lafzı Hz. Peygamber'e aittir. Kudsî hadis sayısı 200 küsurdur."],p:"81"},
{q:"Hangisi lafzen mevkuf olup hükmen merfû sayılır?",o:["Sahabinin \"Biz böyle yapardık\" demesi","Sahabinin \"Hz. Peygamber döneminde böyle yapardık\" demesi","Tâbiînin bir fetvası","Sahabinin lügavî bir açıklaması"],a:1,n:["Cumhura göre mevkuftur.","Doğru. \"Şöyle emrolunduk\", \"şu sünnettendir\" ve sebeb-i nüzûl bildirmesi de merfû hükmündedir.","Bu maktû'dur.","Lügavî açıklamalar hükmen merfû sayılmaz."],p:"82"},
{q:"Maktû' ile ilgili hangisi doğrudur?",o:["Sahabeye izafe edilen sözdür","İmam Şâfiî maktû'yu munkatı' ile bir tutmuştur","Senedden ravi düşmesidir","Hz. Peygamber'e izafe edilen fiildir"],a:1,n:["Bu mevkuftur.","Doğru. Sonradan ikisi ayrı ıstılahlar oldu. Maktû' tâbiî ve sonrasına izafe edilen söz ve fiildir.","Bu munkatı'dır.","Bu merfû'dur."],p:"83"},
{q:"Müsned ile merfû arasındaki ilişki nedir?",o:["Her merfû müsneddir","Her müsned merfûdur, ama her merfû müsned değildir","İkisi eş anlamlıdır","Aralarında ilişki yoktur"],a:1,n:["Tersi.","Doğru. Müsned merfû ve muttasıl rivayettir (umum-husus-ı mutlak).","Yanlış.","Yanlış."],p:"83"},
{q:"Sika ravinin metindeki ziyadesi ile ilgili hangisi doğrudur?",o:["Sikalara muhalefet eden ziyade makbuldür","Mutlakı takyid, âmmı tahsis eden ziyade makbul kabul edilmiştir","Hiçbir ziyade kabul edilmez","Ziyade sadece senette olur"],a:1,n:["Merduddur.","Doğru. Bir nevi muhalefet taşısa da makbul sayılır.","Yanlış. Muhalefet etmeyen ziyade makbuldür.","Metinde de olur."],p:"83–84"},
{q:"Cerh ve ta'dilin sebebinin açıklanması konusunda meşhur görüş nedir?",o:["İkisinin de sebebi açıklanmalı","Ta'dil sebepsiz kabul edilir; cerhin sebebi açıklanmalıdır","Cerh sebepsiz kabul edilir; ta'dilin sebebi açıklanmalıdır","İkisi de sebepsiz kabul edilir"],a:1,n:["Yanlış.","Doğru. Adaleti ispat zordur; cerh sebepleri ise âlimlere göre değişir. Buhârî ve Müslim başkalarınca cerh edilen İkrime gibi ravilerden almıştır.","Ters.","Yanlış."],p:"84–85"},
{q:"Bir şeyh rivayet ettiği hadisi sonradan hatırlamazsa hangi durumda rivayet kabul edilir?",o:["\"Onu ben rivayet etmedim\" derse","\"Bana yalan isnad ediyor\" derse","\"Bilmiyorum, hatırlamıyorum\" derse","Hiçbir durumda"],a:2,n:["Kesin inkârda reddedilir.","Kesin inkârda reddedilir.","Doğru. Tereddütlü ifadede kabul edilir; bu ret ikisine cerh sayılmaz. el-Hatîb'in \"Ahbâru men haddese ve nesiye\" eseri vardır.","Yanlış."],p:"86"},
{q:"\"Sadûk\", \"mahallühü's-sıdk\", \"lâ be'se bih\" lafızlarıyla nitelenen ravinin hükmü nedir?",o:["İhticac edilir","İhticac edilmez ama hadisi yazılır ve sikalarla karşılaştırılır (ihtibar)","Hadisi yazılmaz","Mevzû rivayet eder"],a:1,n:["İlk üç ta'dil mertebesi için.","Doğru. Bu 4. ta'dil mertebesidir; 5. mertebe de aynı hükümdedir.","Bu ağır cerh mertebeleri içindir.","Yanlış."],p:"86–87"},
{q:"Sahih görüşe göre hadis tahammülünde ve edâsında Müslüman ve bâliğ olmak şart mıdır?",o:["İkisinde de şarttır","Tahammülde şart değildir, edâda şarttır","Tahammülde şarttır, edâda değildir","Hiçbirinde şart değildir"],a:1,n:["Yanlış.","Doğru. Tahammül hadisi almak, edâ ise rivayet etmektir.","Ters.","Yanlış."],p:"87–88"},
{q:"Hadis yazımını yasaklayan ve izin veren hadisler arasındaki çelişki nasıl giderilmiştir?",o:["Yasak unutmaktan korkanlar içindir","Yasak Kur'ân ile karışmasın diye idi; karışmayacağı anlaşılınca izin geldi, yasak mensuhtur","İzin verilen hadis mevzûdur","Yasak sadece Ebû Şâh içindir"],a:1,n:["Ters. İzin unutmaktan korkan, yasak unutmayacak olanlar içindir.","Doğru.","Yanlış. \"Ebû Şâh için yazın\" Buhârî'dedir.","Yanlış."],p:"88–89"},
{q:"Ravinin ezberlemediği kendi kitabından rivayeti konusunda müteşeddid (katı) tavır kimlere aittir?",o:["Ebû Hanîfe ve İmam Mâlik","İbn Lehîa","Cumhur","Buhârî ve Müslim"],a:0,n:["Doğru. \"Hıfzından rivayet etmediği hadis hüccet olamaz\" demişlerdir.","Mütesâhil (gevşek) tavırdır.","Mu'tedil tavır: tahammül ve mukabele şartlarına uyarsa caiz.","Yanlış."],p:"89"},
{q:"Bir musannıfın şeyhine, musannıfın senedinden daha kısa bir senetle ulaşmaya ne denir?",o:["Bedel","Muvâfaka","Musâvât","Musâfaha"],a:1,n:["Şeyhin şeyhine daha kısa senetle ulaşmaktır.","Doğru.","Ravi sayısının musannıfınkiyle eşit olmasıdır.","Ravi sayısının musannıfın talebesininkiyle eşit olmasıdır."],p:"91"},
{q:"Müselsel hadis ile ilgili hangisi doğrudur?",o:["Teselsül hadisin sahih olduğunu gösterir","Teselsülün senedin tamamında olması şarttır","Teselsül ile hadisin sıhhati arasında bir bağ yoktur","Sadece eda siygasıyla olur"],a:2,n:["Yanlış.","Yanlış. Ortada veya sonda bitebilir.","Doğru. En faziletlisi semânın muttasıl olduğunu gösterenidir.","Ravilerin halleri, sıfatları ve rivayetin zaman ve mekânıyla da olur."],p:"92–93"}
]},
{id:"u9",scope:"final",bolum:"IV. Bölüm",title:"Sahabe, Tâbiîn ve Ravi Bilgisi",pages:"93–102",qs:[
{q:"Sahabe tanımıyla ilgili hangisi doğrudur?",o:["Hz. Peygamber'i uzaktan görmek yetmez, en az bir yıl sohbet şarttır","Müslüman olarak karşılaşıp Müslüman olarak ölen; irtidat edip dönen de sahabe sayılır","İrtidat edip dönen sahabe sayılmaz","Hz. Peygamber'in vefatından sonra Müslüman olanlar da sahabedir"],a:1,n:["Kitapta böyle bir şart yoktur.","Doğru. Sahabelik tevatür, şöhret, sahabenin veya güvenilir bir tâbiînin haberi ya da âdil kişinin kendi şahitliğiyle bilinir.","Yanlış.","Yanlış."],p:"93"},
{q:"Hangisi Abâdile'den değildir?",o:["Abdullah b. Ömer","Abdullah b. Abbas","Abdullah b. Mes'ûd","Abdullah b. Amr b. el-Âs"],a:2,n:["Abâdile'dendir.","Abâdile'dendir.","Kitaptaki listede yoktur. Abâdile: İbn Ömer, İbn Abbas, İbn Zübeyr, İbn Amr.","Abâdile'dendir."],p:"94"},
{q:"Kitaba göre vefat eden son sahabe kimdir?",o:["Enes b. Mâlik","Ebu't-Tufeyl","Câbir b. Abdullah","Abdullah b. Ömer"],a:1,n:["Enes h. 93'te vefat etmiştir.","Doğru. H. 100'de vefat etmiştir.","Yanlış.","Yanlış."],p:"94"},
{q:"Câhiliyeyi yaşayıp Hz. Peygamber zamanında Müslüman olduğu hâlde onunla karşılaşamayan kimseye ne denir?",o:["Sahabe","Muhadram","Tebe-i tâbiîn","Müdebbec"],a:1,n:["Karşılaşma şarttır.","Doğru. Müslim onları 20 kişi saymıştır; sahih olan daha fazla olmalarıdır.","Yanlış.","Birbirinden rivayet eden akranların hadisidir."],p:"95"},
{q:"Hangisi fukahâ-i seb'adan değildir?",o:["Saîd b. Müseyyeb","Urve b. Zübeyr","Hasan-ı Basrî","Kāsım b. Muhammed"],a:2,n:["Fukahâ-i seb'adandır.","Fukahâ-i seb'adandır.","Değildir. Yedi fakih Medinelidir: Saîd b. Müseyyeb, Kāsım b. Muhammed, Urve, Hârice b. Zeyd, Ebû Seleme, Ubeydullah b. Abdullah, Süleyman b. Yesâr.","Fukahâ-i seb'adandır."],p:"95"},
{q:"Ravilerin beş tabakasından hangisinin hepsinden hadis alan kimdir?",o:["Buhârî","Müslim","Ebû Dâvûd","Tirmizî"],a:3,n:["1. tabakanın hepsinden, 2.'den seçerek, 3.'den çok az.","1. ve 2. tabakadan, 3.'den seçerek.","İlk dört tabakadan; 5.'den almamıştır.","Doğru."],p:"95–96"},
{q:"Ravilerin isimlerinin yazılışı aynı, okunuşu farklı olmasına (سلام / سلّام gibi) ne denir?",o:["Mu'telif-muhtelif","Müttefik-müfterik","Müteşâbih","Mühmel"],a:0,n:["Doğru.","Yazılış ve okunuş aynı, kişiler farklıdır (Halil b. Ahmed adında 6 kişi).","İsimler aynı, baba isimlerinin okunuşu farklıdır (Muhammed b. Akîl / Ukayl).","Aynı isimli iki kişiden hangisi olduğu ayırt edilemez."],p:"96–97"},
{q:"Hz. Âişe'nin Ebû Hüreyre'den, Ebû Hüreyre'nin de Hz. Âişe'den rivayetinin bulunduğu senede ne denir?",o:["Rivâyetü'l-akrân","Müdebbec","Rivâyetü'l-ekâbir ani'l-esâğir","Sâbık-lâhık"],a:1,n:["Akranlardan biri diğerinden rivayet eder ama karşılıklı olduğu bilinmez.","Doğru. Dârekutnî'nin el-Müdebbec'i vardır.","Büyüğün küçükten rivayetidir.","Vefatları arasında uzun süre olan iki ravinin aynı şeyhten rivayetidir."],p:"97–98"},
{q:"Buhârî (ö. 256) ile el-Haffâf'ın (ö. 395) aynı şeyhten, Serrâc'dan rivayeti hangi konuya örnektir?",o:["Vuhdân","Sâbık ve lâhık","Müselsel","Mühmel"],a:1,n:["Kendisinden tek ravi rivayet edenlerdir.","Doğru. Bu bilgi senette inkıta şüphesini kaldırır.","Yanlış.","Yanlış."],p:"100"},
{q:"Mühmel ravi ne zaman sorun oluşturur?",o:["İki kişi de sika ise","İki kişi de zayıf ise","Biri sika, diğeri zayıf ise","Hiçbir zaman"],a:2,n:["Sorun olmaz. Buhârî'deki Ahmed b. Sâlih / Ahmed b. Îsâ örneği böyledir.","Sorun olmaz.","Doğru.","Yanlış."],p:"101"},
{q:"Mübhem şahısların kimliği hangi yollarla tespit edilir?",o:["Başka rivayetlerde isimlerinin geçmesi ve siyercilerin açıklaması","Sadece ravinin ikrarı","Cerh-ta'dil kitapları","Rüya ve keşf"],a:0,n:["Doğru. Bu konudaki en derli toplu eser Veliyyüddin el-Irâkî'nin el-Müstefâd'ıdır.","Yanlış.","Yanlış.","Yanlış."],p:"101–102"}
]},
{id:"u10",scope:"final",bolum:"V. Bölüm",title:"Hadis Usulü Tarihi",pages:"103–106",qs:[
{q:"Ahmet Yücel'in hadis tarihi taksimi hangisidir?",o:["Oluşum – gelişim – açılım – daralma – yeni dönem","Rivayet – Nakil – Son dönem","Mütekaddimûn – müteahhirûn","Sahabe – tâbiîn – tebe-i tâbiîn"],a:1,n:["Bu Özafşar'ın taksimidir.","Doğru.","Bu klasik dönemlendirmedir.","Bu tabaka sistemidir."],p:"103"},
{q:"İlk hadis tarihi çalışması kime aittir?",o:["Talat Koçyiğit","İzmirli İsmail Hakkı","İbrahim Canan","Muhammed Ebû Zehv"],a:1,n:["Hadis Tarihi'nin yazarı; ilk değil.","Doğru. Eserin adı Tarih-i Hadis'tir.","Hadis Usulü ve Tarihi.","el-Hadîs ve'l-muhaddisûn."],p:"103"},
{q:"Ömer b. Abdülazîz'in tedvin emri gönderdiği Medine valisi kimdir?",o:["İbn Şihâb ez-Zührî","Ebû Bekir b. Hazm","Saîd b. Cübeyr","Şu'be b. Haccâc"],a:1,n:["Emri ilk yerine getiren âlimdir: \"Ona defter defter yazdık.\"","Doğru (ö. 120).","Tedvine katkıda bulunan âlimlerdendir.","Tedvine katkıda bulunan âlimlerdendir."],p:"103–104"},
{q:"Tasnif nedir?",o:["Hadislerin ilk defa yazıya geçirilmesi","Tedvin edilmiş karışık malzemenin konularına veya ravilerine göre düzenlenmesi","Hadislerin ezberlenmesi","Ravilerin cerh edilmesi"],a:1,n:["Bu kitâbet veya tedvindir.","Doğru. Hicrî 2. asrın ortalarında başlar; ortaya çıkan eserlere musannef denir.","Yanlış.","Yanlış."],p:"104"},
{q:"Hadis tarihi açısından hicrî üçüncü asır nasıl nitelendirilir?",o:["Şifâhî rivayet dönemi","Gelişme dönemi","Nakil dönemi","Tedvin dönemi"],a:1,n:["Hicrî 1. asır şifâhî rivayetin hâkim olduğu dönemdir.","Doğru.","Yanlış.","Tedvin hicrî 1. asır sonu ve 2. asırdır."],p:"105"},
{q:"Mu'tezilî-Hanefî Bişr el-Merîsî'nin itiraz ettiği konu hangisidir?",o:["Haber-i vâhidle kabir azabı, Münker-Nekir, mîzan ve sırat gibi itikadi inançların belirlenmesi","Kur'ân'ın tevatürü","Mütevâtir hadisin varlığı","Namazın farziyeti"],a:0,n:["Doğru. Ehl-i hadise göre sahih haber-i vâhid inanç dahil her konuda delildir.","Yanlış.","Yanlış.","Yanlış."],p:"105"},
{q:"\"Bir fiil iki fail tarafından meydana getirilemez, bu yüzden insanın fiilleri Allah tarafından yaratılmaz\" diyen Mu'tezilî âlim kimdir?",o:["Bişr el-Merîsî","Cübbâî","Ahmed b. Ebû Duâd","Vâsık"],a:1,n:["Haber-i vâhid tartışmasıyla anılır.","Doğru.","Mihnenin teşvikçisidir.","Mihnenin devam ettiği halifedir."],p:"105"},
{q:"Mihne olayıyla ilgili hangisi doğrudur?",o:["Mütevekkil başlatmış, Me'mûn bitirmiştir","Me'mûn 218'de başlatmış, Mu'tasım ve Vâsık döneminde sürmüş, 234'te Mütevekkil bitirmiştir","Rü'yetullah meselesi yüzünden çıkmıştır","Sadece bir yıl sürmüştür"],a:1,n:["Ters.","Doğru. Konu Halku'l-Kur'ân'dır; yaklaşık 16 yıl sürmüştür.","Yanlış.","Yanlış."],p:"106"},
{q:"Mu'tezile'nin \"teaddüd-i kudemâ\" endişesiyle karşı çıktığı mesele hangisidir?",o:["Rü'yetullah","Allah'ın kadîm sıfatları","Kader","Haber-i vâhid"],a:1,n:["Teşbih ve tecsim endişesiyle karşı çıkılır.","Doğru. Ehl-i hadise göre sıfatların kadîm oluşu tevhidle çelişmez.","Yanlış.","Yanlış."],p:"106"}
]},
{id:"u11",scope:"final",bolum:"VI. Bölüm",title:"Buhârî ve Müslim",pages:"107–120",qs:[
{q:"Buhârî'nin en çok istifade ettiği iki hocası kimlerdir?",o:["Ahmed b. Hanbel ve Yahyâ b. Maîn","İshak b. Râhûye ve Ali b. el-Medînî","Mâlik ve Şâfiî","Zühelî ve Humeydî"],a:1,n:["Ahmed b. Hanbel'den Sahîh'inde sadece iki hadis vardır.","Doğru. İshak b. Râhûye'nin teşviki Sahîh'in yazılmasına sebep olmuştur.","Yanlış.","Yanlış. Zühelî Halku'l-Kur'ân meselesinde onu tenkit etmiştir."],p:"107"},
{q:"Buhârî'nin Halku'l-Kur'ân görüşü hangisidir?",o:["Kur'ân mahlûktur","Okunan Kur'ân kadîmdir, okuma fiili hâdistir","Okunan ile okuma eşittir","Bu konuda susmuştur"],a:1,n:["Halk arasında yanlış yayılan ifadedir.","Doğru. Bu yüzden Nîşâbur'da fitne çıkmış ve Buhârî şehri terk etmiştir.","Ahmed b. Hanbel'in tavrıdır.","Yanlış."],p:"109"},
{q:"Buhârî'nin Sahîh'inin tam adındaki \"muhtasar\" kelimesi neyi ifade eder?",o:["Eserin hadisleri kısaltarak verdiğini","Bütün sahihleri alma iddiasında olmadığını","Eserin küçük hacimli olduğunu","Sadece merfû rivayet içerdiğini"],a:1,n:["Yanlış.","Doğru.","Yanlış.","Bu \"müsned\" kelimesinin olası anlamıdır."],p:"109"},
{q:"Buhârî Sahîh'ini kaç yılda ve kaç hadis arasından seçerek yazmıştır?",o:["15 yıl – 300 bin","16 yıl – 600 bin","16 yıl – 500 bin","10 yıl – 600 bin"],a:1,n:["Müslim 300 bin hadis içinden seçmiştir.","Doğru. Bu bilgiyi bizzat Buhârî verir.","Ebû Dâvûd 500 bin hadis yazdığını söyler.","Yanlış."],p:"110"},
{q:"Hâzimî'nin tabakalarına göre Buhârî ikinci tabaka ravilerin (hıfzı var, mülâzemeti kısa) hadislerini nasıl almıştır?",o:["Asıl olarak","Mütâbi' ve şâhid olarak, ayrıca muallak olarak","Hiç almamıştır","Sadece mevkuf olarak"],a:1,n:["Asıl olarak birinci tabakadan alır.","Doğru.","Yanlış.","Yanlış."],p:"111"},
{q:"Buhârî'nin temriz sigasıyla (\"yürvâ\", \"yüzkeru\") verdiği muallaklar için hangisi doğrudur?",o:["Hepsi sahihtir","İçlerinde sahih, hasen ve zayıf bulunabilir","Hepsi mevzûdur","Hepsi şartlarına uygundur"],a:1,n:["Cezm sigasıyla gelenler sahih kabul edilir.","Doğru. İhticac makamında zikrettiyse sahih, hasen veya desteklenebilir zayıf olduğu anlaşılır.","Yanlış.","Yanlış. Çoğu şartlarına uymaz."],p:"113–114"},
{q:"Bugün elimizdeki Buhârî metni kimin birleştirdiği nüshalara dayanır?",o:["Firebrî","Yûnînî","Kastallânî","Nesefî"],a:1,n:["Sahîh'in meşhur ravisidir; \"90 bin kişi dinledi\" demiştir.","Doğru. Hicrî 7. asırda Ebû Zer el-Herevî ve Asîlî gibi nüshaları birleştirmiştir.","İrşâdü's-sârî şerhinin sahibidir.","Sahîh'in ravilerindendir."],p:"115"},
{q:"Hangi şerh–müellif eşleştirmesi yanlıştır?",o:["Fethu'l-bârî – İbn Hacer","Umdetü'l-kârî – Bedreddin el-Aynî","İrşâdü's-sârî – Kastallânî","el-Minhâc – Kirmânî"],a:3,n:["Doğru eşleşme.","Doğru eşleşme.","Doğru eşleşme. Ana kaynakları Feth ve Umde'dir.","Yanlış eşleşme. el-Minhâc, Nevevî'nin Müslim şerhidir; Kirmânî'ninki el-Kevâkibü'd-derârî'dir."],p:"116, 120"},
{q:"Müslim'in Sahîh'indeki bab başlıklarını kim koymuştur?",o:["Bizzat Müslim","İmam Nevevî","Kâdî İyâz","Ebû Zür'a"],a:1,n:["Müslim babları belirlemiş ama başlık koymamıştır.","Doğru. Başlıklarda Şâfiî bir fakihin izleri görülür.","İkmâlü'l-Mu'lim şerhinin sahibidir.","Müslim eserini ona arz etmiş, illetlileri çıkarmıştır."],p:"118"},
{q:"Müslim'in Sahîh'inin Buhârî'ye göre üstün olan özelliği nedir?",o:["Fıkhî çıkarımlar yapması","Hadisin farklı tariklerini bir yerde toplaması","Daha çok muallak içermesi","Bab başlıklarının zenginliği"],a:1,n:["Müslim fıkhî çıkarım ve tariflerden uzak durmuştur.","Doğru. Böylece metin ve senet farkları açıkça görülür.","Mukaddime dışında Ebu'l-Cüheym hadisinden başka muallak yoktur.","Başlıkları Nevevî koymuştur."],p:"117–119"},
{q:"Müslim \"حدثنا\" ve \"أخبرنا\" siygalarını nasıl kullanmıştır?",o:["İkisini eşit görmüştür","Haddesenâ semâ, ahberanâ kıraat içindir","İkisini de icazet için kullanmıştır","Hiç kullanmamıştır"],a:1,n:["Bu Zührî, Mâlik, Buhârî ve Hicazlıların görüşüdür.","Doğru. Şâfiî ve cumhurun görüşü de budur.","Yanlış.","Yanlış."],p:"119"},
{q:"Müslim'in Zühelî ile ilişkisi için hangisi doğrudur?",o:["Sahîh'inde ondan çok hadis almıştır","Zühelî Buhârî'yi dışlayınca ondan işittiklerini geri yollamış, hiçbir eserinde ondan rivayet etmemiştir","Zühelî Müslim'in tek hocasıdır","Zühelî'yi Buhârî'ye karşı savunmuştur"],a:1,n:["Yanlış.","Doğru. Müslim Buhârî'yi savunmuştur.","Yanlış.","Ters."],p:"117"}
]},
{id:"u12",scope:"final",bolum:"VI. Bölüm",title:"Sünen Sahipleri ve Kütüb-i Sitte'nin Oluşumu",pages:"121–132",qs:[
{q:"Ebû Dâvûd'un Sünen'i ile ilgili hangisi doğrudur?",o:["İlk telif edilen sünendir","Sünen'inde 600 bin hadis vardır","Bağdat'ta değil Sicistan'da yazılmıştır","Hiç mürsel içermez"],a:0,n:["Doğru. 500 bin hadisten 4800'ünü seçmiş, 600'ü mürseldir; eserini Ahmed b. Hanbel'e arz etmiştir.","Yanlış.","Bağdat'ta telif etmiştir.","600 mürsel vardır."],p:"121–123"},
{q:"Ebû Dâvûd'un Mekkelilere mektubuna göre hakkında bir şey söylemediği hadis nasıldır?",o:["Zayıftır","Sâlihtir (sahih–hasen)","Mevzûdur","Mürseldir"],a:1,n:["Şiddetli vehim ve zayıflıkları açıkladığını söyler.","Doğru.","Yanlış.","Yanlış."],p:"123"},
{q:"Tirmizî'nin eseri \"sünen\" diye meşhur olsa da aslında hangi türdendir?",o:["Müsned","Câmi'","Musannef","Mu'cem"],a:1,n:["Yanlış.","Doğru. Sekiz konuyu içerir; fıkıh bablarına göre tertip edildiği için sünen diye meşhur olmuştur.","Yanlış.","Yanlış."],p:"124"},
{q:"Tirmizî, garîb olmakla birlikte hasenlik vasfı ağır basan hadis için hangi tabiri kullanır?",o:["Garîb-hasen","Hasen-garîb","Sahih-garîb","Hasen-sahih"],a:1,n:["Garîblik ağır bastığında kullanır.","Doğru.","Yanlış.","Yanlış."],p:"126"},
{q:"Tirmizî, Hanefî mezhebinin görüşlerini hangi ifadeyle nakleder?",o:["Ehl-i Kûfe","Ehl-i re'y","Ashâbu Ebî Hanîfe","Bazı insanlar (ba'du'n-nâs)"],a:0,n:["Doğru. Keşmîrî, Ebû Hanîfe'nin görüşlerinin ona ulaşmadığını söyler.","Yanlış.","Yanlış.","Bu ifadeyi Buhârî kullanır."],p:"126"},
{q:"Tirmizî'nin meçhul biri olduğunu iddia eden kimdir?",o:["Zehebî","İbn Hazm","İbnü'l-Cevzî","Ali el-Kārî"],a:1,n:["Zehebî, İbn Hazm'ın eseri görmediğini söyler.","Doğru. İbn Hacer bu iddiayı İbn Hazm'ın bilgisizliği sayar.","Câmi'de 23 uydurma olduğunu iddia etmiştir.","Tirmizî'nin sıhhatte gevşek davrandığını söyler."],p:"125"},
{q:"Zehebî'ye göre Nesâî'nin el-Müctebâ'sı nasıl oluşmuştur?",o:["Ramle emirinin isteğiyle bizzat Nesâî yazmıştır","Talebesi İbnü's-Sünnî, Sünen-i Kübrâ'dan ihtisar etmiştir","İbnü'l-Esîr derlemiştir","Süyûtî özetlemiştir"],a:1,n:["İbnü'l-Esîr ve Irâkî'nin aktardığı rivayet budur; Zehebî bunu doğru bulmaz.","Doğru.","Yanlış.","Yanlış."],p:"128"},
{q:"Nesâî, Hâris b. Miskîn'den aldığı hadisleri hangi lafızla rivayet etmiştir?",o:["Haddesenî","Ahberanî","Kırâeten aleyhi ve ene esma'","Enbeenî"],a:2,n:["Kullanmamıştır.","Kullanmamıştır.","Doğru. Meclise alınmadığı için kapı dışından dinlemiştir.","Yanlış."],p:"128"},
{q:"Kütüb-i sitteye İbn Mâce'nin Sünen'ini ilk defa ilave ettiği söylenen kimdir?",o:["İbnu's-Salâh","İbn Tâhir el-Makdisî","Rezîn b. Muâviye","Alâî"],a:1,n:["İbnu's-Salâh ve İbn Hacer altıncı kitap olarak Dârimî'yi önerir.","Doğru (ö. 507).","Muvatta'ı ilave etmiştir.","Dârimî'yi altıncı kitap olarak saymıştır."],p:"130"},
{q:"Kütüb-i tis'a imamlarından en yaşlısı ve en son vefat edeni sırasıyla kimdir?",o:["Ahmed b. Hanbel – Tirmizî","İmam Mâlik – Nesâî","Buhârî – İbn Mâce","Dârimî – Ebû Dâvûd"],a:1,n:["Yanlış.","Doğru. Mâlik 93/179; Nesâî 214/303.","Yanlış.","Yanlış."],p:"132"},
{q:"Kütüb-i sitte'deki sülâsî rivayetlerle ilgili hangisi doğrudur?",o:["Buhârî'de 22 sülâsî vardır","Müslim'de 5 sülâsî vardır","Nesâî'nin en âlî senedi sülâsîdir","Tirmizî'de hiç sülâsî yoktur"],a:0,n:["Doğru. İbn Mâce'de 5, Tirmizî'de 1 vardır.","Müslim ve Nesâî'nin en âlî rivayetleri rubâîdir.","Rubâîdir.","Bir tane vardır."],p:"129"},
{q:"Süyûtî'ye göre Sahîhayn'dan sonra en az zayıf hadis barındıran eser hangisidir?",o:["Ebû Dâvûd","Tirmizî","Nesâî","İbn Mâce"],a:2,n:["Nesâî'den sonra gelir.","Ebû Dâvûd'dan sonra gelir.","Doğru.","Şiddetli zayıf hadisler bulunur; mertebece en alttadır."],p:"128"}
]},
{id:"u13",scope:"final",bolum:"VI. Bölüm",title:"Sonraki Çalışmalar, Oryantalistler, Hint Alt Kıtası",pages:"132–139",qs:[
{q:"Hata düzeltme yöntemlerinden \"keşt\" nedir?",o:["Hatalı kısmın üzerini çizmek","Bıçak gibi keskin bir aletle kazımak","Islak parmakla silmek","Üzerine صح işareti koymak"],a:1,n:["Bu darb'dır.","Doğru.","Bu mahv'dır.","Dikkat çekme veya doğrusunu kenara yazma işaretidir."],p:"132"},
{q:"İslâm tarihinde ilk resmî eğitim kurumu hangisidir?",o:["Dârülhadis","Nizamiye medreseleri","Beytü'l-hikme","Mescid-i Nebevî"],a:1,n:["İlk dârülhadis hicrî 6. asırda Şam'da kurulmuştur; medreseden ileri seviyededir.","Doğru.","Yanlış.","İlk dört asırda mescitler ilim merkeziydi ama resmî kurum değildi."],p:"132"},
{q:"İbnu's-Salâh'ın hadislerin sıhhati konusundaki tartışmalı görüşü nedir?",o:["Her hadis yeniden incelenmelidir","Hadisler hakkında yeniden sıhhat hükmü verilemez, öncekilerle yetinilmelidir","Sadece Buhârî'nin hükmü geçerlidir","Zayıf hadislerle amel edilemez"],a:1,n:["Ters.","Doğru. Bulkînî, İbn Hacer, Sehâvî, Süyûtî ve Ali el-Kārî bu görüşe muhalefet etmiştir.","Yanlış.","Yanlış."],p:"133"},
{q:"Kütüb-i sitte ravilerini içeren ilk rical kitabı hangisidir?",o:["Tehzîbü'l-Kemâl – Mizzî","el-Kemâl fî esmâi'r-ricâl – Abdülganî el-Makdisî","Tehzîbü't-Tehzîb – İbn Hacer","Takrîbü't-Tehzîb – İbn Hacer"],a:1,n:["el-Kemâl'in eksiklerini gidermek için yazılmıştır.","Doğru.","Tehzîbü'l-Kemâl'i kısaltıp ilaveler yapmıştır (12.415 ravi).","Tehzîbü't-Tehzîb'in ihtisarıdır."],p:"133–134"},
{q:"Bir hadis kitabının başka eserlerde olmayan hadislerini bir araya getiren çalışma türü hangisidir? (Heysemî'nin Mecma'u'z-zevâid'i gibi)",o:["Etrâf","Zevâid","Tahrîc","Cem"],a:1,n:["Hadisin baş kısmını zikreder (Mizzî'nin Tuhfetü'l-eşrâf'ı).","Doğru. İbn Hacer'in el-Metâlibü'l-âliye'si de bu türdendir.","Başka ilim dallarındaki kitaplarda geçen hadislerin kaynağını gösterir.","Birden çok kitabın hadislerini toplar (Câmiu'l-usûl)."],p:"134"},
{q:"Zeylaî'nin Nasbu'r-râye'si hangi çalışma türüne ve hangi esere aittir?",o:["Şerh – Buhârî","Tahrîc – Hidâye","Zevâid – İbn Mâce","Etrâf – Sahîhayn"],a:1,n:["Yanlış.","Doğru. Irâkî de İhyâ'nın hadislerini tahrîc etmiştir.","Bûsîrî'nin Misbâhu'z-zücâce'si İbn Mâce zevâididir.","Yanlış."],p:"135"},
{q:"Tespit edilebildiği kadarıyla ilk şerh çalışması hangisidir?",o:["Fethu'l-bârî","Meâlimü's-sünen – Hattâbî","el-Mu'lim – Mâzerî","Ârizatü'l-ahvezî"],a:1,n:["Hicrî 9. asır.","Doğru. Hicrî 4. asırda Ebû Dâvûd üzerine yazılmıştır.","Müslim'in ilk şerhidir.","Tirmizî şerhidir (İbnü'l-Arabî)."],p:"135"},
{q:"\"Müşterek ravi (common link)\" teorisini ortaya atan ve geliştiren oryantalistler sırasıyla kimlerdir?",o:["Goldziher – Schacht","Schacht – Juynboll","Juynboll – Goldziher","Schacht – Goldziher"],a:1,n:["Goldziher metin esaslı yaklaşımla anılır.","Doğru.","Yanlış.","Yanlış."],p:"135–137"},
{q:"Schacht'ın Hasan-ı Basrî'nin kader risalesinde hadis bulunmamasından hareketle o hadislerin sonradan çıktığını söylemesi hangi yöntemdir?",o:["Metin esaslı","İsnad esaslı","Kaynak esaslı (e silentio)","Müşterek ravi"],a:2,n:["Goldziher'in \"üç mescit\" iddiası bu türdendir.","Müşterek ravi ve isnadların geriye doğru gelişimi bu türdendir.","Doğru. Bir âlimin bütün hadisleri bildiği ön kabulüne dayandığı için eleştirilir.","Yanlış."],p:"138"},
{q:"Goldziher'in \"üç mescit\" hadisini Zührî'nin uydurduğu iddiası nasıl çürütülür?",o:["Hadis sadece Zührî'den gelir","Zührî'nin Abdülmelik ile görüşmesi İbn Zübeyr'in öldürülmesinden çok sonradır ve hadis altı sahabiden rivayet edilmiştir","Hadis Kur'ân'da geçer","Zührî Abdülmelik'i hiç görmemiştir"],a:1,n:["Yanlış. Birçok tâbiîden de gelir.","Doğru. Goldziher ayrıca Emevî düşmanı Şiî Ya'kûbî'yi kaynak gösterir.","Yanlış.","Görüşme vardır ama 81–84 yıllarındadır."],p:"137"},
{q:"Hint alt kıtasında Aligarh ekolünün kurucusu kimdir?",o:["Nezir Hüseyin","Seyyid Ahmed Han","Abdullah Çekrâlevî","Enver Şah Keşmîrî"],a:1,n:["Son dönem ehl-i hadis hareketinin kurucusudur.","Doğru. Ona göre sadece Kur'ân'ın ruhuna ve akla uyan hadisler makbuldür.","Ehl-i Kur'ân ekolüyle anılır.","Diyûbend (Hanefî) ekolünün temsilcisidir."],p:"138–139"},
{q:"Hadis fetvalarıyla ilgili literatürün ilk örneği hangisidir?",o:["İbnu's-Salâh'ın Fetâvâ ve mesâil'i","Nevevî'nin Takrîb'i","Süyûtî'nin Tedrîb'i","İbn Hacer'in Nüzhe'si"],a:0,n:["Doğru. Hicrî 7. asırdan itibaren; ilk dönemde sualât/icâbât adlarıyla bilinir.","Yanlış.","Yanlış.","Yanlış."],p:"135"}
]}

{q:"Hangisi İbnu's-Salâh'ın Mukaddime'si üzerine yapılmış nüket tarzı bir çalışma değildir?",o:["Zerkeşî – en-Nüket","Moğlatay – Islâhu İbni's-Salâh","İbn Hacer – en-Nüket","Bulkînî – Mahâsinü'l-ıstılâh"],a:3,n:["Nüket tarzıdır.","Nüket tarzıdır.","Nüket tarzıdır.","Şerhtir. Diğer şerhler: İbn Cemâa'nın el-Cevâhir'i, Enbâsî'nin eş-Şeze'l-feyyâh'ı."],p:"30"},
{q:"Seyyid Şerîf Cürcânî'nin Muhtasar fî ulûmi'l-hadîs'i nedir?",o:["Buhârî şerhi","Mukaddime, Takrîb, el-Menhel, Hulâsa ve Mişkât şerhi mukaddimesinin özeti","Mevzu hadisler kitabı","Ricâl kitabı"],a:1,n:["Yanlış.","Doğru.","Yanlış.","Yanlış."],p:"31"},
{q:"Aşağıdaki eser–müellif eşleştirmelerinden hangisi yanlıştır?",o:["el-Manzûmetü'l-Beykûniyye – Ömer el-Beykûnî","Fethu'l-muğîs – Sehâvî","el-Mûkıza – İbn Dakîkul'îd","Tedrîbü'r-râvî – Süyûtî"],a:2,n:["Doğru eşleşme.","Doğru eşleşme (Elfiyye şerhi).","Yanlış eşleşme. el-Mûkıza Zehebî'nindir; İbn Dakîkul'îd'in eseri el-İktirâh'tır.","Doğru eşleşme (Nevevî'nin Takrîb'inin şerhi)."],p:"31"}
],
u2:[
